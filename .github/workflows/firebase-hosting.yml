# dashboard フォルダを Firebase Hosting（https://shiitake-iot.web.app/）にも置く。
# 拠点シフト表のGoogleログインを、ページと同じ場所（web.app）で行うため。
# 鍵はリポジトリの Secrets の FIREBASE_SERVICE_ACCOUNT（Firebase Hosting 管理者のサービスアカウント）
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: shiitake-iot
