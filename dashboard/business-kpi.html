<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>椎茸事業部 経営ダッシュボード</title>
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="経営KPI">

<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e3e6ea;
    --text: #1f2430;
    --muted: #6b7280;
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; }
  header .subtitle { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  #last-updated { font-size: 0.78rem; color: var(--muted); }
  #refresh-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 0.82rem;
    transition: background 0.15s;
  }
  #refresh-btn:hover { background: #f0f1f3; }

  .site-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .site-tab {
    padding: 7px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; color: var(--muted); border: 1px solid var(--border); background: var(--surface);
    transition: background 0.12s, color 0.12s;
  }
  .site-tab:hover { color: var(--text); }
  .site-tab.active { background: #1f2430; color: #fff; border-color: #1f2430; }

  /* ── メインタブ(概要/拠点比較/年度比較) ── */
  .main-tabs { display: flex; gap: 4px; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 28px; }
  .main-tab {
    padding: 11px 18px; background: none; border: none; font-size: 0.88rem; font-weight: 600;
    color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .main-tab:hover { color: var(--text); }
  .main-tab.active { color: #1f2430; border-bottom-color: #1f2430; }

  .coverage-banner {
    margin: 14px 28px 0;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.78rem;
    line-height: 1.6;
    color: #1e3a5f;
  }
  .coverage-banner strong { color: #1d4ed8; }

  main { padding: 20px 28px 48px; display: flex; flex-direction: column; gap: 22px; }

  .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
  .section-title .sub { color: var(--muted); font-size: 0.76rem; font-weight: 400; margin-left: 8px; }

  /* ── 経営サマリー KPIカード ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    gap: 12px;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.03);
  }
  .kpi-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .kpi-value { font-size: 1.5rem; font-weight: 700; margin-top: 6px; line-height: 1.1; }
  .kpi-value .kpi-unit { font-size: 0.68rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .kpi-deltas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 7px; font-size: 0.74rem; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--bad); }
  .kpi-asof { font-size: 0.68rem; color: var(--muted); margin-top: 5px; }

  /* ── パネル(2x2 + 下段) ── */
  .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 980px) { .panel-grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    display: flex; flex-direction: column;
  }
  .panel-title { font-size: 0.95rem; font-weight: 700; }
  .panel-sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; margin-bottom: 12px; }
  .chart-wrap { height: 260px; position: relative; cursor: pointer; }
  .chart-wrap.small { height: 140px; }
  .composite-split { display: flex; flex-direction: column; gap: 16px; flex: 1; }

  /* ── 年別スプリット表示(2025/2026を並べる) ── */
  .year-split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .year-split-grid { grid-template-columns: 1fr; } }
  .year-split-grid .chart-wrap { height: 220px; }
  .year-chart-title { font-size: 0.72rem; color: var(--muted); font-weight: 600; margin-bottom: 4px; text-align: center; }
  .metric-block-title { font-size: 0.85rem; font-weight: 700; margin: 14px 0 8px; }

  .year-select-row { display: flex; gap: 20px; margin-bottom: 16px; font-size: 0.85rem; flex-wrap: wrap; }
  .year-select-row label { display: flex; align-items: center; gap: 6px; }
  .year-select-row select { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; background: #fff; color: var(--text); }

  .todo-note {
    margin-top: 10px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.72rem;
    line-height: 1.6;
    color: #78350f;

  .todo-note code { background: #fef3c7; padding: 1px 5px; border-radius: 3px; }

  /* ── アラート / テーブル ── */

  thead th {

  thead th.num { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  tbody tr.footer-row { background: #f7f8fa; font-weight: 700; }
  td { padding: 7px 14px; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.dim { color: var(--muted); }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 0.72rem; font-weight: 700; }
  .badge-ok   { background: #dcfce7; color: #15803d; }
  .badge-warn { background: #fef3c7; color: #b45309; }

  .zoom-close:hover { color: var(--text); }
  .zoom-title { font-size: 1rem; font-weight: 700; margin-bottom: 14px; padding-right: 28px; }

  @media (max-width: 640px) {

    .main-tabs { padding: 0 14px; }
    .coverage-banner { margin: 14px 14px 0; }
    .chart-wrap { height: 220px; }
  }
</style>

  nantan: [8722794,8814886,8925983,6168925,7745634,6378445,5327551,7371925,7244655,11950353,11784106,20796248,     13572384,12390664,11141335,8547530,8592262,10370057,10247242,null],

// g単価 (円/kg) — シート側の「g単価(売上ベース)」列は参照せず、取得した売上・出荷量から

// 菌床仕入本数 (本) — 菌床本数シート「菌床数集計」タブ 各拠点合計行(千葉七河+自社菌床), D列(2025.1)〜 ※ライブ取得
const BED_COUNT = {

  gunma:  [22680,17640,2520,10080,12600,10080,14490,14760,18170, 22610,45360,47880, 27720,22680,20160,17640,23930,18900,20160,16380],

  gunma:  [5128410,3982230,568890,2275560,2844450,2275560,3271117,3342570,5122461,5304306,10641456,11232648,   6503112,5342148,4737696,4138344,5613978,4433940,4729536,null],
  nantan: [3428040,5120010,568890,2853910,3386250,2519370,3467520,3742980,4672251,5072346,9116966,11074582,     4628974,2749833,4859239,2771516,3249210,4030216,4729536,null],
};

// ────────────────────────────────────────────────────────────────
// ライブ取得（Google Sheets gviz）— 上記フォールバック値を元シートの最新値で上書きする
// 収穫量シートは行番号のみが頼りでラベル照合ができないため対象外(HARVESTは手動更新のまま)。
// ────────────────────────────────────────────────────────────────
const LIVE_SHEETS = {
  bedCount: { id: '1oR_Qp16haR6zccY7LZJ_OW1hqu8_dnb9k_yj1iLunzY', tab: '菌床数集計',              label: '菌床仕入本数' },
  shipment: { id: '1RyGT1x_qwJnjiKe5PMMn9Eb58wIxWB15XhjowmEcfQM',                                  label: '出荷量・出荷額' },
  sales:    { id: '1iPrycBqvU-gD77QNpezLpyYoDHltI4FsWLXZ858TCxk', tab: '26年度計画①（実績入力用）', label: '売上・菌床代' },
};

// 大きいシート(特に売上・菌床代シートは999行×50列超)ではgvizの応答に時間がかかることがあるため、
// タイムアウトは長めに取り、失敗時は1回だけ再試行する(一時的なネットワーク不調・応答遅延を吸収するため)。
async function fetchSheetOnce(sheetId, sheetName, headers) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&headers=${headers}`;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  try {
    const res = await fetch(url, { signal: controller.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${sheetName}`);
    const text = await res.text();
    const json = JSON.parse(text.replace(/^[^{]+/, '').replace(/[^}]+$/, ''));
    if (json.status === 'error') throw new Error(json.errors?.[0]?.detailed_message || 'シートエラー');
    const table = json.table;
    // 応答が極端に短い(行がほぼ無い)場合は、途中で応答が切れた/取得失敗のサインとみなし再試行対象にする
    if (!table || !table.rows || table.rows.length < 2) {
      throw new Error(`${sheetName}: 応答データが空または不完全です ${sampleRowStrings(table && table.rows)}`);
    }
    return table;
  } finally {
    clearTimeout(timer);
  }
}

async function fetchSheet(sheetId, sheetName, headers = 1) {
  try {
    return await fetchSheetOnce(sheetId, sheetName, headers);
  } catch (e) {
    await new Promise(r => setTimeout(r, 1000));
    return await fetchSheetOnce(sheetId, sheetName, headers);
  }
}

// エラーメッセージに実際の応答内容の先頭数行を埋め込むための診断用ヘルパー。
// 期待通りの取得ができない場合に「実際に何が返ってきたか」をバナー上で確認できるようにする。
function sampleRowStrings(rows, maxRows = 5, maxCols = 6) {
  const out = [];
  for (let i = 0; i < (rows || []).length && out.length < maxRows; i++) {
    const cells = (rows[i].c || []).slice(0, maxCols).map(c => (c && c.v != null ? String(c.v) : '·'));
    out.push(`[${i}]${cells.join(',')}`);
  }
  return out.join(' ');
}

// 菌床数集計タブ: 拠点名(B列)は各ブロック先頭行のみ入っているため直前の値を引き継ぎ、
// 「合計」行(C列)を見つけたらD列以降N列分(2025.1〜)を月次配列として取り出す。
// 列は見出しの表記ゆれ(2025.10が"2025.1"と表示される既知の不具合)を避けるためD列起点の位置で判定する。
function parseBedCountTable(table) {
  const NAME_MAP = { 'いなべ': 'inabe', '群馬': 'gunma', '南丹': 'nantan' };
  const result = { inabe: Array(N).fill(null), gunma: Array(N).fill(null), nantan: Array(N).fill(null) };
  let currentSite = null;
  (table.rows || []).forEach(row => {
    const cells = row.c || [];
    const siteName = cells[1]?.v != null ? String(cells[1].v).trim() : '';
    if (siteName) currentSite = NAME_MAP[siteName] || null;
    const rowType = cells[2]?.v != null ? String(cells[2].v).trim() : '';
    if (rowType === '合計' && currentSite) {
      const vals = [];
      for (let i = 0; i < N; i++) {
        const v = cells[3 + i]?.v;
        vals.push(v != null && v !== '' && !isNaN(v) ? Number(v) : null);
      }
      result[currentSite] = vals;
    }
  });
  // 3拠点すべてが空の場合は、シート構成が想定と異なる(または取得内容が不完全な)可能性が高いため
  // 「取得成功だがデータ無し」を「エラー」として明示的に扱う
  if (Object.values(result).every(arr => arr.every(v => v == null))) {
    throw new Error(`拠点の合計行が見つかりません(取得行数=${(table.rows || []).length}) ${sampleRowStrings(table.rows)}`);
  }
  return result;
}

// 出荷量＆出荷額シート: 「{年}{拠点名}」タブ(例:2025いなべ)。列はラベル行の文言(出荷量(固定)/出荷額/売上)で
// 特定し、行は「n月」ラベルで特定する(行・列位置に依存しないため多少の行列挿入があっても壊れにくい)。
// g単価はシート側の「g単価(売上ベース)」列を読まず、取得した売上・出荷量から自前計算する
// (円/kg = 売上(円) × 1000 ÷ 出荷量(g))。売上列のラベルが見つからない場合のみF列(インデックス5)にフォールバックする。
async function fetchShipmentSiteYear(sheetId, year, siteNameJP) {
  const tabName = `${year}${siteNameJP}`;
  const table = await fetchSheet(sheetId, tabName, 1);
  const rows = table.rows || [];
  let colB = null, colE = null, colF = null;
  rows.forEach(row => {
    (row.c || []).forEach((c, i) => {
      const label = c && c.v != null ? String(c.v).trim() : '';
      // 出荷量の見出しはタブによって表記が異なる(いなべ:「出荷量(固定)」／群馬・南丹:「出荷量」)
      if (label === '出荷量(固定)' || label === '出荷量') colB = i;
      if (label === '出荷額') colE = i;
      if (label === '売上') colF = i;
    });
  });
  if (colB == null || colE == null) {
    throw new Error(`${tabName}: 列見出しが見つかりません(取得行数=${rows.length}) ${sampleRowStrings(rows)}`);
  }
  // 売上列のラベルが見つからない場合はF列(0始まりで5列目)を仮定してフォールバックする
  if (colF == null) colF = 5;

  const shipment = Array(12).fill(null);
  const shipmentValue = Array(12).fill(null);
  const unitPrice = Array(12).fill(null);
  rows.forEach(row => {
    const cells = row.c || [];
    const monthLabel = cells[0]?.v != null ? String(cells[0].v) : (cells[0]?.f || '');
    const m = String(monthLabel).match(/^(\d{1,2})月$/);
    if (!m) return;
    const month = parseInt(m[1], 10);
    if (month < 1 || month > 12) return;
    const bVal = cells[colB]?.v;
    const eVal = cells[colE]?.v;
    const fVal = cells[colF]?.v;
    shipment[month - 1] = (bVal != null && bVal !== 0) ? +(bVal / 1000).toFixed(2) : null;
    shipmentValue[month - 1] = (eVal != null && eVal !== 0) ? Math.round(eVal) : null;
    // 売上(円) × 1000 ÷ 出荷量(g) = 円/kg
    unitPrice[month - 1] = (bVal != null && bVal !== 0 && fVal != null && fVal !== 0) ? Math.round(fVal * 1000 / bVal) : null;
  });
  return { shipment, shipmentValue, unitPrice };
}

// 全拠点タブ(例:2025全拠点)から全社合計のg単価用に出荷量・売上を取得する。
// シート側の「g単価(売上ベース)」列は読まず、売上÷出荷量で自前計算する(円/kg = 売上(円)×1000÷出荷量(g))。
// 列はラベル(出荷量(規格値)/売上実績)照合を優先し、見つからない場合のみ位置(出荷量=インデックス1,
// 売上=インデックス5)にフォールバックする。
async function fetchTotalUnitPriceYear(sheetId, year) {
  const tabName = `${year}全拠点`;
  const table = await fetchSheet(sheetId, tabName, 1);
  const rows = table.rows || [];
  let colB = null, colF = null;
  rows.forEach(row => {
    (row.c || []).forEach((c, i) => {
      const label = c && c.v != null ? String(c.v).trim() : '';
      if (label === '出荷量(規格値)') colB = i;
      if (label === '売上実績') colF = i;
    });
  });
  // ラベルが見つからない場合は出荷量=B列(インデックス1)、売上=F列(インデックス5)を仮定してフォールバックする
  if (colB == null) colB = 1;
  if (colF == null) colF = 5;

  const unitPrice = Array(12).fill(null);
  rows.forEach(row => {
    const cells = row.c || [];
    const monthLabel = cells[0]?.v != null ? String(cells[0].v) : (cells[0]?.f || '');
    const m = String(monthLabel).match(/^(\d{1,2})月$/);
    if (!m) return;
    const month = parseInt(m[1], 10);
    if (month < 1 || month > 12) return;
    const bVal = cells[colB]?.v;
    const fVal = cells[colF]?.v;
    unitPrice[month - 1] = (bVal != null && bVal !== 0 && fVal != null && fVal !== 0) ? Math.round(fVal * 1000 / bVal) : null;
  });
  return unitPrice;
}

// 拠点ごとに独立して取得し、1拠点が失敗しても他拠点の成功分は反映する(全滅を避ける)。
// 同一スプレッドシートへの同時リクエストはgviz側で不安定になることがある(観測: 2つの年を
// 並列取得すると、どちらか一方だけがランダムに「列見出しが見つからない」応答になる)ため、
// 同一スプレッドシートIDに対する取得は年単位も含めて完全に直列化する。
async function fetchShipmentAll(sheetId) {
  const SITE_JP = { inabe: 'いなべ', gunma: '群馬', nantan: '南丹' };
  const shipment = {}, shipmentValue = {}, unitPrice = {};
  const failures = [];
  for (const key of Object.keys(SITE_JP)) {
    try {
      const y25 = await fetchShipmentSiteYear(sheetId, 2025, SITE_JP[key]);
      const y26 = await fetchShipmentSiteYear(sheetId, 2026, SITE_JP[key]);
      shipment[key] = [...y25.shipment, ...y26.shipment].slice(0, N);
      shipmentValue[key] = [...y25.shipmentValue, ...y26.shipmentValue].slice(0, N);
      unitPrice[key] = [...y25.unitPrice, ...y26.unitPrice].slice(0, N);
    } catch (e) {
      failures.push(`${SITE_JP[key]}: ${e.message}`);
    }
  }

  // 全社合計のg単価は拠点の加重平均ではなく、全拠点タブの「g単価(売上ベース)」を直接採用する
  // (同一スプレッドシートへの直列化方針に合わせ、こちらも年単位で順に取得する)
  try {
    const t25 = await fetchTotalUnitPriceYear(sheetId, 2025);
    const t26 = await fetchTotalUnitPriceYear(sheetId, 2026);
    unitPrice.total = [...t25, ...t26].slice(0, N);
  } catch (e) {
    failures.push(`全拠点: ${e.message}`);
  }

  return { shipment, shipmentValue, unitPrice, failures };
}

// 売上・菌床代シート: 列構成が期間によって変化する(実績のみ1列 → 計画/実績/予実差異/前月差異の4列 →
// 計画/実績の2列)ため、月ラベル行("R7.1"等)と実績/計画マーカー行を毎回スキャンして「実績」列だけを
// 特定する。対象行も固定行番号ではなく科目名(売上高（いなべ）等)で照合するため行挿入に強い。
function parseSalesTable(table) {
  const REVENUE_LABELS = { '売上高（いなべ）': 'inabe', '売上高（安中）': 'gunma', '売上高（南丹）': 'nantan' };
  const COST_LABELS = { '売上原価（いなべ）菌床代': 'inabe', '売上原価（安中）菌床代': 'gunma', '売上原価（南丹）菌床代': 'nantan' };
  const revenue = { inabe: Array(N).fill(null), gunma: Array(N).fill(null), nantan: Array(N).fill(null) };
  const substrateCost = { inabe: Array(N).fill(null), gunma: Array(N).fill(null), nantan: Array(N).fill(null) };

  const rows = table.rows || [];
  let monthRowIdx = -1, markerRowIdx = -1;
  rows.forEach((row, i) => {
    const joined = (row.c || []).map(c => (c && c.v != null ? String(c.v) : '')).join('|');
    if (monthRowIdx === -1 && (joined.match(/R\d+\.\d+/g) || []).length >= 10) monthRowIdx = i;
    if (markerRowIdx === -1 && (joined.match(/実績/g) || []).length >= 5 && (joined.match(/計画/g) || []).length >= 5) markerRowIdx = i;
  });
  if (monthRowIdx === -1 || markerRowIdx === -1) {
    throw new Error(`月ラベル行/実績列が見つかりません(取得行数=${rows.length}) ${sampleRowStrings(rows)}`);
  }

  const monthCells = rows[monthRowIdx].c || [];
  const markerCells = rows[markerRowIdx].c || [];
  const colToIdx = {};
  const maxCols = Math.max(monthCells.length, markerCells.length);
  for (let c = 0; c < maxCols; c++) {
    const marker = markerCells[c]?.v != null ? String(markerCells[c].v).trim() : '';
    if (marker !== '実績') continue;
    const label = monthCells[c]?.v != null ? String(monthCells[c].v).trim() : '';
    const m = label.match(/^R(\d+)\.(\d+)$/);
    if (!m) continue;
    const year = 2018 + parseInt(m[1], 10);
    const month = parseInt(m[2], 10);
    const idx = (year - 2025) * 12 + (month - 1);
    if (idx >= 0 && idx < N) colToIdx[c] = idx;
  }

  rows.forEach(row => {
    const cells = row.c || [];
    const label = cells[0]?.v != null ? String(cells[0].v).trim() : '';
    const key = REVENUE_LABELS[label] || COST_LABELS[label];
    if (!key) return;
    const target = REVENUE_LABELS[label] ? revenue : substrateCost;
    Object.entries(colToIdx).forEach(([c, idx]) => {
      const v = cells[c]?.v;
      target[key][idx] = (v != null && v !== 0) ? Math.round(v) : null;
    });
  });

  return { revenue, substrateCost };
}

let liveStatus = { bedCount: 'pending', shipment: 'pending', sales: 'pending' };
let liveErrorMsgs = {};
let lastLiveFetchAt = null;

function coverageText(arr) {
  const { idx } = lastValid(arr);

async function refreshLiveData() {
  liveStatus = { bedCount: 'loading', shipment: 'loading', sales: 'loading' };
  liveErrorMsgs = {};
  updateLiveBanner();

  const [bedRes, shipRes, salesRes] = await Promise.allSettled([
    fetchSheet(LIVE_SHEETS.bedCount.id, LIVE_SHEETS.bedCount.tab, 1).then(parseBedCountTable),
    fetchShipmentAll(LIVE_SHEETS.shipment.id),
    fetchSheet(LIVE_SHEETS.sales.id, LIVE_SHEETS.sales.tab, 1).then(parseSalesTable),
  ]);

  if (bedRes.status === 'fulfilled') {
    Object.assign(BED_COUNT, bedRes.value);
    liveStatus.bedCount = 'ok';
  } else {
    liveStatus.bedCount = 'error';
    liveErrorMsgs.bedCount = bedRes.reason?.message || String(bedRes.reason);
    console.error('菌床仕入本数の取得に失敗:', bedRes.reason);
  }

  if (shipRes.status === 'fulfilled') {
    Object.assign(SHIPMENT, shipRes.value.shipment);
    Object.assign(SHIPMENT_VALUE, shipRes.value.shipmentValue);
    Object.assign(UNIT_PRICE, shipRes.value.unitPrice);
    if (shipRes.value.failures.length) {
      liveStatus.shipment = 'error';
      liveErrorMsgs.shipment = shipRes.value.failures.join(' / ');
      console.error('出荷量・出荷額の取得に一部失敗:', shipRes.value.failures);
    } else {
      liveStatus.shipment = 'ok';
    }
  } else {
    liveStatus.shipment = 'error';
    liveErrorMsgs.shipment = shipRes.reason?.message || String(shipRes.reason);
    console.error('出荷量・出荷額の取得に失敗:', shipRes.reason);
  }

  if (salesRes.status === 'fulfilled') {
    Object.assign(REVENUE, salesRes.value.revenue);
    Object.assign(SUBSTRATE_COST, salesRes.value.substrateCost);
    liveStatus.sales = 'ok';
  } else {
    liveStatus.sales = 'error';
    liveErrorMsgs.sales = salesRes.reason?.message || String(salesRes.reason);
    console.error('売上・菌床代の取得に失敗:', salesRes.reason);
  }

  lastLiveFetchAt = new Date();
  DATA = buildData();
  updateLiveBanner();
  render();
}

function calcSite(siteKey) {
  const harvest       = HARVEST[siteKey];
  const shipment      = SHIPMENT[siteKey];
  const bedCount      = BED_COUNT[siteKey];
  const shipmentValue = SHIPMENT_VALUE[siteKey];
  const revenue       = REVENUE[siteKey];
  const substrateCost = SUBSTRATE_COST[siteKey];

  const unitPriceLive = UNIT_PRICE[siteKey];
  const yieldRate   = shipment.map((v,i) => (v == null || !harvest[i]) ? null : +(v / harvest[i] * 100).toFixed(1));
  // g単価は出荷量＆出荷額シートI列(g単価・出荷額ベース)のライブ値を優先し、未取得の月のみ出荷額÷出荷量で補完
  const unitPrice   = shipment.map((v,i) => {
    if (unitPriceLive && unitPriceLive[i] != null) return unitPriceLive[i];
    return (v == null || shipmentValue[i] == null) ? null : Math.round(shipmentValue[i] / v);
  });
  const costRatio   = revenue.map((v,i) => (v == null || substrateCost[i] == null) ? null : +(substrateCost[i] / v * 100).toFixed(1));
  const grossProfit = revenue.map((v,i) => (v == null || substrateCost[i] == null) ? null : v - substrateCost[i]);
  // 1菌床あたり収穫量 (g/本) = 収穫量(kg)×1000 ÷ 菌床仕入本数
  const harvestPerBed = harvest.map((v,i) => (v == null || !bedCount[i]) ? null : Math.round(v * 1000 / bedCount[i]));
  // 1菌床あたり出荷量 (g/本) = 出荷量(kg)×1000 ÷ 菌床仕入本数
  const shipmentPerBed = shipment.map((v,i) => (v == null || !bedCount[i]) ? null : Math.round(v * 1000 / bedCount[i]));
  // 売上÷菌床代 = 菌床投資売上倍率 (倍)
  const salesCostRatio = revenue.map((v,i) => (v == null || !substrateCost[i]) ? null : +(v / substrateCost[i]).toFixed(2));
  // 1菌床単価 (円/本) = 菌床仕入額 ÷ 菌床仕入本数
  const bedUnitCost = substrateCost.map((v,i) => (v == null || !bedCount[i]) ? null : Math.round(v / bedCount[i]));

  return { harvest, shipment, bedCount, shipmentValue, revenue, substrateCost, yieldRate, unitPrice, costRatio, grossProfit, harvestPerBed, shipmentPerBed, salesCostRatio, bedUnitCost };
}

// 全社合計（各配列を月ごとに合算。null月はnull）
function sumArr(...arrs) {
  return Array.from({length: N}, (_, i) => {
    if (arrs.some(a => a[i] == null)) return null;
    return arrs.reduce((s,a) => s + a[i], 0);
  });
}

// ライブ取得したシートデータで上書きした後、DATAを再計算するために関数化
function buildData() {
  const data = {};
  SITES.forEach(s => { data[s.key] = calcSite(s.key); });

  data.total = {
    harvest:  sumArr(data.inabe.harvest, data.gunma.harvest, data.nantan.harvest),
    shipment: sumArr(data.inabe.shipment, data.gunma.shipment, data.nantan.shipment),
    bedCount: sumArr(data.inabe.bedCount, data.gunma.bedCount, data.nantan.bedCount),
    shipmentValue: sumArr(data.inabe.shipmentValue, data.gunma.shipmentValue, data.nantan.shipmentValue),
    revenue:  sumArr(data.inabe.revenue, data.gunma.revenue, data.nantan.revenue),
    substrateCost: sumArr(data.inabe.substrateCost, data.gunma.substrateCost, data.nantan.substrateCost),
    grossProfit: sumArr(data.inabe.grossProfit, data.gunma.grossProfit, data.nantan.grossProfit),
  };
  data.total.yieldRate = data.total.shipment.map((v,i) => (v == null || !data.total.harvest[i]) ? null : +(v / data.total.harvest[i] * 100).toFixed(1));
  // 全社合計のg単価は全拠点タブのライブ値(g単価・売上ベース)を優先し、未取得の月のみ出荷額÷出荷量で補完
  data.total.unitPrice = data.total.shipment.map((v,i) => {
    if (UNIT_PRICE.total && UNIT_PRICE.total[i] != null) return UNIT_PRICE.total[i];
    return (v == null || data.total.shipmentValue[i] == null) ? null : Math.round(data.total.shipmentValue[i] / v);
  });
  data.total.costRatio = data.total.revenue.map((v,i) => (v == null || data.total.substrateCost[i] == null) ? null : +(data.total.substrateCost[i] / v * 100).toFixed(1));
  data.total.harvestPerBed = data.total.harvest.map((v,i) => (v == null || !data.total.bedCount[i]) ? null : Math.round(v * 1000 / data.total.bedCount[i]));
  data.total.shipmentPerBed = data.total.shipment.map((v,i) => (v == null || !data.total.bedCount[i]) ? null : Math.round(v * 1000 / data.total.bedCount[i]));
  data.total.salesCostRatio = data.total.revenue.map((v,i) => (v == null || !data.total.substrateCost[i]) ? null : +(v / data.total.substrateCost[i]).toFixed(2));
  data.total.bedUnitCost = data.total.substrateCost.map((v,i) => (v == null || !data.total.bedCount[i]) ? null : Math.round(v / data.total.bedCount[i]));
  return data;
}

};
const COMPARE_METRIC_KEYS = Object.keys(METRIC_DEFS);

// ────────────────────────────────────────────────────────────────
// 共通ユーティリティ
// ────────────────────────────────────────────────────────────────
const fmt = (n, digits = 0) => n == null ? '—' : n.toLocaleString('ja-JP', { minimumFractionDigits: digits, maximumFractionDigits: digits });
const fmtUnit = (n, unit, digits = 0) => n == null ? '—' : `${fmt(n, digits)} ${unit}`;
function pctLabel(pct) {
  if (pct == null) return '—';
  return pct >= 0 ? `+${pct.toFixed(1)}%` : `▲${Math.abs(pct).toFixed(1)}%`;
}
function lastValid(arr) {
  for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return { value: arr[i], idx: i };
  return { value: null, idx: -1 };
}
function sumValid(arr) { return arr.filter(v => v != null).reduce((s,v) => s+v, 0); }
function avgValid(arr) { const v = arr.filter(v => v != null); return v.length ? sumValid(v) / v.length : null; }

// 最新値 + 前月比 + 前年比(同月, 12ヶ月前)をまとめて算出
function cardStat(arr) {
  const last = lastValid(arr);
  if (last.idx < 0) return { value: null, idx: -1, mom: null, momPct: null, yoy: null, yoyPct: null };
  const prev = last.idx >= 1 ? arr[last.idx - 1] : null;
  const yoyIdx = last.idx - 12;
  const yoyVal = yoyIdx >= 0 ? arr[yoyIdx] : null;
  const mom = prev != null ? last.value - prev : null;
  const momPct = (mom != null && prev) ? mom / prev * 100 : null;
  const yoy = yoyVal != null ? last.value - yoyVal : null;
  const yoyPct = (yoy != null && yoyVal) ? yoy / yoyVal * 100 : null;
  return { value: last.value, idx: last.idx, mom, momPct, yoy, yoyPct };
}

// 20ヶ月の通し配列から該当年の1〜12月を切り出す（存在しない月はnull埋め）
const YEARS = [2025, 2026];
const YEAR_MONTH_LABELS = Array.from({ length: 12 }, (_, i) => `${i+1}月`);
function yearSlice(arr, year) {
  const start = year === 2025 ? 0 : 12;
  const s = arr.slice(start, start + 12);
  while (s.length < 12) s.push(null);
  return s;
}
function sliceDataset(d, year) {
  const out = {};
  Object.keys(d).forEach(k => { out[k] = yearSlice(d[k], year); });
  return out;
}

function kpiCardHtml(d, c) {
  const digits = c.digits || 0;
  const st = cardStat(d[c.key]);
  const color = COLORS[c.key] || '#1f2430';
  const cls = (p) => {
    if (p == null) return '';
    const isGoodMove = c.good ? (p >= 0) === (c.good === 'up') : (p >= 0);
    return isGoodMove ? 'up' : 'down';
  };
  return `<div class="kpi-card">
    <div class="kpi-label">${c.label}</div>
    <div class="kpi-value" style="color:${color}">${fmt(st.value, digits)}<span class="kpi-unit">${c.unit}</span></div>
    <div class="kpi-deltas">
      ${st.momPct != null ? `<span class="delta ${cls(st.momPct)}">前月比 ${pctLabel(st.momPct)}</span>` : ''}
      ${st.yoyPct != null ? `<span class="delta ${cls(st.yoyPct)}">前年比 ${pctLabel(st.yoyPct)}</span>` : ''}
    </div>
    <div class="kpi-asof">${st.idx >= 0 ? MONTH_LABELS[st.idx] : ''}時点</div>
  </div>`;
}

// チャート共通描画（複数軸対応の棒+折れ線コンボ / 散布図）
// ────────────────────────────────────────────────────────────────
function drawCombo(canvasId, labels, series) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId).getContext('2d');
  const axesUsed = [...new Set(series.map(s => s.axis || 'y'))];

  const datasets = series.map(s => ({
    type: s.type || 'bar',
    label: s.label,
    data: s.data,
    backgroundColor: s.type === 'line' ? 'transparent' : s.color + 'cc',
    borderColor: s.color,
    borderWidth: s.type === 'line' ? 2.5 : 1,
    borderRadius: s.type === 'line' ? 0 : 4,
    borderDash: s.dash || undefined,
    pointRadius: s.type === 'line' ? 3 : 0,
    tension: 0.3,
    spanGaps: false,
    yAxisID: s.axis || 'y',
  }));

  const scales = { x: { ticks: { color: '#6b7280', font: { size: 10 } }, grid: { display: false } } };
  axesUsed.forEach(id => {
    scales[id] = {
      position: id === 'y' ? 'left' : 'right',
      ticks: { color: '#6b7280', font: { size: 10 } },
      grid: { drawOnChartArea: id === 'y', color: '#eef0f3' },
    };
  });

  charts[canvasId] = new Chart(ctx, {
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { color: '#374151', font: { size: 10 }, boxWidth: 12, padding: 10 } },
        tooltip: {
          backgroundColor: '#ffffff', borderColor: '#e3e6ea', borderWidth: 1,
          titleColor: '#1f2430', bodyColor: '#374151',
          callbacks: { label: (c) => `${c.dataset.label}: ${c.parsed.y == null ? '—' : c.parsed.y.toLocaleString('ja-JP')}` },
        },
      },
      scales,
    },
  });
}

function drawScatter(canvasId, d, labels) {
  labels = labels || MONTH_LABELS;
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId).getContext('2d');
  const points = labels.map((m, i) => (d.shipment[i] != null && d.unitPrice[i] != null) ? { x: d.shipment[i], y: d.unitPrice[i], label: m } : null).filter(Boolean);

  charts[canvasId] = new Chart(ctx, {
    type: 'scatter',
    data: { datasets: [{ label: '出荷量×g単価', data: points, backgroundColor: COLORS.shipment + 'aa', pointRadius: 5, pointHoverRadius: 7 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#ffffff', borderColor: '#e3e6ea', borderWidth: 1,
          titleColor: '#1f2430', bodyColor: '#374151',
          callbacks: { label: (c) => `${c.raw.label}: 出荷量${c.raw.x.toLocaleString('ja-JP')}kg / 単価${c.raw.y.toLocaleString('ja-JP')}円/kg` },
        },
      },
      scales: {
        x: { title: { display: true, text: '出荷量(kg)', color: '#6b7280', font: { size: 10 } }, ticks: { color: '#6b7280', font: { size: 10 } }, grid: { color: '#eef0f3' } },
        y: { title: { display: true, text: 'g単価(円/kg)', color: '#6b7280', font: { size: 10 } }, ticks: { color: '#6b7280', font: { size: 10 } }, grid: { color: '#eef0f3' } },

const ALERT_METRICS = [
  { key: 'revenue',        label: '売上',             digits: 0, good: 'up' },
  { key: 'shipment',       label: '出荷量',           digits: 0, good: 'up' },

  { key: 'bedCount',       label: '菌床仕入数',       digits: 0 },
  { key: 'substrateCost',  label: '菌床仕入額',       digits: 0, good: 'down' },

  { key: 'salesCostRatio', label: '菌床投資売上倍率', digits: 2, good: 'up' },
  { key: 'yieldRate',      label: '出荷歩留まり',     digits: 1, good: 'up' },
];

function buildAlertsHtml(d) {
  const rows = ALERT_METRICS.map(m => {
    const st = cardStat(d[m.key]);
    if (st.momPct == null) return null;
    const abs = Math.abs(st.momPct);
    const dirLabel = st.momPct >= 0 ? '上昇' : '低下';
    const isGoodMove = m.good ? (st.momPct >= 0) === (m.good === 'up') : null;
    let sev, sevLabel;
    if (abs < 3) { sev = 'ok'; sevLabel = '安定'; }
    else if (isGoodMove === true) { sev = 'ok'; sevLabel = '好調'; }
    else { sev = abs < 8 ? 'warn' : 'bad'; sevLabel = dirLabel; }
    return { m, st, sev, sevLabel };
  }).filter(Boolean);

  if (!rows.length) return `<div class="alert-empty">アラート対象データがありません</div>`;

  return `<table>
    <thead><tr><th>KPI</th><th>状態</th><th>内容</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${r.m.label}</td>
      <td><span class="badge badge-${r.sev}">${r.sevLabel}</span></td>
      <td>前月比 ${pctLabel(r.st.momPct)}（${MONTH_LABELS[r.st.idx]}時点）</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function buildMonthlyTableHtml(d) {
  const head = `<th>月</th>` + TABLE_COLUMNS.map(c => `<th class="num">${c.label}</th>`).join('');
  const rows = MONTH_LABELS.map((m, i) =>
    `<tr><td class="dim">${m}</td>${TABLE_COLUMNS.map(c => `<td class="num">${fmt(d[c.key][i], c.digits)}</td>`).join('')}</tr>`
  ).join('');
  const footer = `<tr class="footer-row"><td class="dim">累計/平均</td>${TABLE_COLUMNS.map(c => {
    const v = c.agg === 'sum' ? sumValid(d[c.key]) : avgValid(d[c.key]);
    const mul = Math.pow(10, c.digits);
    return `<td class="num">${v != null ? fmt(Math.round(v * mul) / mul, c.digits) : '—'}</td>`;
  }).join('')}</tr>`;
  return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}${footer}</tbody></table></div>`;
}

  ], d);
  renderCurrentYearCombo('composite-yieldrate', '出荷歩留まり', ds => [
    { label: '出荷歩留まり(%)', data: ds.yieldRate, color: COLORS.yieldRate, type: 'line', axis: 'y' },
  ], d);
  renderCurrentYearScatter('composite-scatter', '出荷量×g単価', d);

  document.getElementById('alerts-table').innerHTML = buildAlertsHtml(d);
  document.getElementById('monthly-table').innerHTML = buildMonthlyTableHtml(d);
}

// ────────────────────────────────────────────────────────────────
// タブ② 拠点比較
// ────────────────────────────────────────────────────────────────
function renderSiteCompareMetric(containerId, key) {
  const def = METRIC_DEFS[key];
  const el = document.getElementById(containerId);
  el.innerHTML = `<div class="metric-block-title">${def.label}（拠点比較）</div>
    <div class="year-split-grid">${YEARS.map(y => `
      <div>
        <div class="year-chart-title">${y}年</div>
        <div class="chart-wrap" onclick="openZoom('${containerId}-${y}')"><canvas id="${containerId}-${y}"></canvas></div>
      </div>`).join('')}</div>`;
  YEARS.forEach(y => {
    const series = SITES.map(site => ({
      label: site.name,
      data: yearSlice(DATA[site.key][key], y),
      color: site.color,
      type: def.kind,
      axis: 'y',
    }));
    chart(`${containerId}-${y}`, `${def.label} 拠点比較（${y}年）`, (id) => drawCombo(id, YEAR_MONTH_LABELS, series));
  });
}

function renderSiteCompare() {
  document.getElementById('main').innerHTML = `
    <section>
      <div class="section-title">拠点比較<span class="sub">いなべ／群馬／南丹を項目ごとに比較</span></div>
      <div class="panel">
        ${COMPARE_METRIC_KEYS.map(k => `<div id="sitecmp-${k}" style="margin-bottom:20px"></div>`).join('')}
      </div>
    </section>
  `;
  COMPARE_METRIC_KEYS.forEach(k => renderSiteCompareMetric(`sitecmp-${k}`, k));
}

// ────────────────────────────────────────────────────────────────
// タブ③ 年度比較
// ────────────────────────────────────────────────────────────────
function renderYearCompareMetric(containerId, key, d) {
  const def = METRIC_DEFS[key];
  const canvasId = `${containerId}-canvas`;
  document.getElementById(containerId).innerHTML = `
    <div class="metric-block-title">${def.label}</div>
    <div class="chart-wrap" onclick="openZoom('${canvasId}')"><canvas id="${canvasId}"></canvas></div>`;
  const series = [
    { label: `${yearCompareA}年`, data: yearSlice(d[key], yearCompareA), color: '#1e3a8a', type: def.kind, axis: 'y' },
    { label: `${yearCompareB}年`, data: yearSlice(d[key], yearCompareB), color: '#dc2626', type: def.kind, axis: 'y', dash: def.kind === 'line' ? [6,3] : undefined },
  ];
  chart(canvasId, `${def.label} 年度比較（${yearCompareA}年 / ${yearCompareB}年）`, (id) => drawCombo(id, YEAR_MONTH_LABELS, series));
}

function renderYearCompare() {
  const d = DATA[activeSite];
  const site = ALL_LOCS.find(l => l.key === activeSite);
  const opts = (selected) => YEARS.map(y => `<option value="${y}"${y === selected ? ' selected' : ''}>${y}年</option>`).join('');

  document.getElementById('main').innerHTML = `
    <section>
      <div class="section-title">年度比較<span class="sub">${site.name}</span></div>
      <div class="year-select-row">
        <label>比較年度A: <select onchange="setYearCompare('A', this.value)">${opts(yearCompareA)}</select></label>
        <label>比較年度B: <select onchange="setYearCompare('B', this.value)">${opts(yearCompareB)}</select></label>
      </div>
      <div class="panel">
        ${COMPARE_METRIC_KEYS.map(k => `<div id="yearcmp-${k}" style="margin-bottom:20px"></div>`).join('')}
      </div>
    </section>
  `;
  COMPARE_METRIC_KEYS.forEach(k => renderYearCompareMetric(`yearcmp-${k}`, k, d));
}

// ────────────────────────────────────────────────────────────────
// 描画本体
// ────────────────────────────────────────────────────────────────
const MAIN_TABS = [
  { key: 'overview',    label: '概要' },
  { key: 'sitecompare', label: '拠点比較' },
  { key: 'yearcompare', label: '年度比較' },
];

function render() {
  document.getElementById('main-tabs').innerHTML = MAIN_TABS.map(t =>
    `<button class="main-tab${t.key === activeMainTab ? ' active' : ''}" onclick="setMainTab('${t.key}')">${t.label}</button>`
  ).join('');

  const siteTabsEl = document.getElementById('site-tabs');
  siteTabsEl.style.display = activeMainTab === 'sitecompare' ? 'none' : '';
  siteTabsEl.innerHTML = ALL_LOCS.map(l =>
    `<button class="site-tab${l.key === activeSite ? ' active' : ''}" onclick="setSite('${l.key}')">${l.name}</button>`
  ).join('');

  destroyAllCharts();
  chartDefs = {};

  if (activeMainTab === 'sitecompare') renderSiteCompare();
  else if (activeMainTab === 'yearcompare') renderYearCompare();
  else renderOverview();

  document.getElementById('last-updated').textContent = `最終更新: ${new Date().toLocaleString('ja-JP')}`;
}

render();
updateLiveBanner();
refreshLiveData();
</script>
</body>
</html>
