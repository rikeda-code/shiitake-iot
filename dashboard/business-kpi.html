<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>椎茸事業部 経営ダッシュボード</title>
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="経営KPI">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e3e6ea;
    --text: #1f2430;
    --muted: #6b7280;
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; }
  header .subtitle { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  #last-updated { font-size: 0.78rem; color: var(--muted); }
  #refresh-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 0.82rem;
    transition: background 0.15s;
  }
  #refresh-btn:hover { background: #f0f1f3; }

  .site-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .site-tab {
    padding: 7px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; color: var(--muted); border: 1px solid var(--border); background: var(--surface);
    transition: background 0.12s, color 0.12s;
  }
  .site-tab:hover { color: var(--text); }
  .site-tab.active { background: #1f2430; color: #fff; border-color: #1f2430; }

  /* ── メインタブ(概要/拠点比較/年度比較) ── */
  .main-tabs { display: flex; gap: 4px; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 28px; }
  .main-tab {
    padding: 11px 18px; background: none; border: none; font-size: 0.88rem; font-weight: 600;
    color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .main-tab:hover { color: var(--text); }
  .main-tab.active { color: #1f2430; border-bottom-color: #1f2430; }

  .coverage-banner {
    margin: 14px 28px 0;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.78rem;
    line-height: 1.6;
    color: #1e3a5f;
  }
  .coverage-banner strong { color: #1d4ed8; }

  main { padding: 20px 28px 48px; display: flex; flex-direction: column; gap: 22px; }

  .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
  .section-title .sub { color: var(--muted); font-size: 0.76rem; font-weight: 400; margin-left: 8px; }

  /* ── 経営サマリー KPIカード ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    gap: 12px;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.03);
  }
  .kpi-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .kpi-value { font-size: 1.5rem; font-weight: 700; margin-top: 6px; line-height: 1.1; }
  .kpi-value .kpi-unit { font-size: 0.68rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .kpi-deltas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 7px; font-size: 0.74rem; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--bad); }
  .kpi-asof { font-size: 0.68rem; color: var(--muted); margin-top: 5px; }

  /* ── パネル(2x2 + 下段) ── */
  .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 980px) { .panel-grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    display: flex; flex-direction: column;
  }
  .panel-title { font-size: 0.95rem; font-weight: 700; }
  .panel-sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; margin-bottom: 12px; }
  .chart-wrap { height: 260px; position: relative; cursor: pointer; }
  .chart-wrap.small { height: 140px; }
  .composite-split { display: flex; flex-direction: column; gap: 16px; flex: 1; }

  /* ── 年別スプリット表示(2025/2026を並べる) ── */
  .year-split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .year-split-grid { grid-template-columns: 1fr; } }
  .year-split-grid .chart-wrap { height: 220px; }
  .year-chart-title { font-size: 0.72rem; color: var(--muted); font-weight: 600; margin-bottom: 4px; text-align: center; }
  .metric-block-title { font-size: 0.85rem; font-weight: 700; margin: 14px 0 8px; }
  .metric-block-title:first-child { margin-top: 0; }

  .period-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 12px 0 8px; }

  .year-select-row { display: flex; gap: 20px; margin-bottom: 16px; font-size: 0.85rem; flex-wrap: wrap; }
  .year-select-row label { display: flex; align-items: center; gap: 6px; }
  .year-select-row select { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; background: #fff; color: var(--text); }

  .todo-note {
    margin-top: 10px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.72rem;
    line-height: 1.6;
    color: #78350f;
  }
  .todo-note code { background: #fef3c7; padding: 1px 5px; border-radius: 3px; }

  /* ── アラート / テーブル ── */
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  thead th {
    background: #f7f8fa; padding: 9px 14px; text-align: left;
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  thead th.num { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  tbody tr.footer-row { background: #f7f8fa; font-weight: 700; }
  td { padding: 7px 14px; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.dim { color: var(--muted); }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 0.72rem; font-weight: 700; }
  .badge-ok   { background: #dcfce7; color: #15803d; }
  .badge-warn { background: #fef3c7; color: #b45309; }
  .badge-bad  { background: #fee2e2; color: #b91c1c; }
  .alert-empty { padding: 16px; color: var(--muted); font-size: 0.85rem; }

  /* ── コンテナごとの帯（南丹 要因分析） ── */
  .band-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.74rem; color: var(--muted); margin: 6px 0 4px; align-items: center; }
  .band-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .band-legend i { display: inline-block; width: 18px; height: 10px; border-radius: 3px; }
  .band-legend i.ongoing { background: repeating-linear-gradient(45deg, #9ca3af 0 3px, #e5e7eb 3px 6px); }
  .band-legend i.line60 { width: 0; height: 12px; border-left: 2px dashed #6b7280; border-radius: 0; }
  .band-site { margin-top: 14px; }
  .band-site-title { font-size: 0.85rem; font-weight: 700; border-left: 4px solid; padding-left: 8px; margin-bottom: 4px; }
  .band-row { display: grid; grid-template-columns: 112px 1fr 128px; align-items: center; height: 17px; font-size: 0.7rem; }
  .band-row:hover { background: #f7f8fa; }
  .band-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; text-align: right; }
  .band-label small { color: var(--muted); }
  .band-label em { font-style: normal; color: #7c3aed; font-weight: 700; margin-left: 2px; }
  .band-track { position: relative; height: 100%; border-left: 1px solid var(--border); }
  .band-bar { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; background: var(--c); }
  .band-bar.ongoing { background: repeating-linear-gradient(45deg, var(--c) 0 4px, transparent 4px 7px); border: 1px solid var(--c); }
  .band-60 { position: absolute; top: 0; bottom: 0; border-left: 2px dashed #9ca3af; }
  .band-val { padding-left: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .band-val small { color: var(--muted); }
  .band-axis { height: 18px; color: var(--muted); border-bottom: 1px solid var(--border); }
  .band-axis span { position: absolute; transform: translateX(-50%); top: 2px; font-size: 0.68rem; }
  @media (max-width: 640px) { .band-row { grid-template-columns: 84px 1fr 96px; } }

  /* ── グラフ拡大モーダル ── */
  .zoom-modal { display: none; position: fixed; inset: 0; background: rgba(15,17,23,0.55); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .zoom-modal.open { display: flex; }
  .zoom-modal-inner { background: #fff; border-radius: 14px; padding: 20px 24px 24px; width: 100%; max-width: 920px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .zoom-close { position: absolute; top: 10px; right: 14px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); line-height: 1; }
  .zoom-close:hover { color: var(--text); }
  .zoom-title { font-size: 1rem; font-weight: 700; margin-bottom: 14px; padding-right: 28px; }

  @media (max-width: 640px) {
    header, main { padding: 14px; }
    .main-tabs { padding: 0 14px; }
    .coverage-banner { margin: 14px 14px 0; }
    .chart-wrap { height: 220px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>🍄 椎茸事業部 経営ダッシュボード</h1>
    <div class="subtitle">結果 → 原因 → 生産性 → 原価 → 経営判断 ／ 月次</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
    <div class="site-tabs" id="site-tabs"></div>
    <span id="last-updated"></span>
    <button id="refresh-btn" onclick="refreshLiveData()">↻ 更新</button>
  </div>
</header>

<div class="main-tabs" id="main-tabs"></div>

<div class="coverage-banner" id="coverage-banner">
  <strong>データ最終反映月：</strong>
  収穫量・出荷量・出荷額＝2026年7月／菌床仕入本数＝2026年8月／売上＝2026年7月／菌床代＝2026年7月（各元シートへの入力状況により異なります）。それ以降は未入力のため「—」表示です。
</div>

<main id="main"></main>

<div id="zoom-modal" class="zoom-modal" onclick="if(event.target===this) closeZoom()">
  <div class="zoom-modal-inner">
    <button class="zoom-close" onclick="closeZoom()">×</button>
    <div class="zoom-title" id="zoom-title"></div>
    <div class="chart-wrap" style="height:65vh;cursor:default"><canvas id="zoom-canvas"></canvas></div>
  </div>
</div>

<script>
// ────────────────────────────────────────────────────────────────
// データ定義（既存のまま流用）
// ────────────────────────────────────────────────────────────────

const MONTH_LABELS = [
  '25/1','25/2','25/3','25/4','25/5','25/6','25/7','25/8','25/9','25/10','25/11','25/12',
  '26/1','26/2','26/3','26/4','26/5','26/6','26/7','26/8','26/9','26/10',
];
const N = MONTH_LABELS.length;

// ── 着地見込みの月 ──
// 月の途中で、元シートに「着地見込み」として入れた値を表示する月。棒は薄い色、折れ線は点線で区別する。
// 収穫量シートは見出し「着地見込み」、売上・菌床代シートは「着地見込」列から取る。
// 出荷量＆出荷額シートには着地見込みが無く、月の途中の実績(入力済み分だけ)が出てしまうため、

const FORECAST_IDX = MONTH_LABELS.indexOf(FORECAST_LABEL);
const isForecast = (idx) => idx >= 0 && idx === FORECAST_IDX;
const monthLabel = (idx) => MONTH_LABELS[idx] + (isForecast(idx) ? '（着地見込）' : '');

const SITES = [
  { key: 'inabe',  name: 'いなべ', color: '#38bdf8' },

  { key: 'nantan', name: '南丹',   color: '#34d399' },
];

const ALL_LOCS = [TOTAL_SITE, ...SITES];

// 菌床仕入本数 (本) — 菌床本数シート「菌床数集計」タブ 各拠点合計行(千葉七河+自社菌床), D列(2025.1)〜 ※ライブ取得
const BED_COUNT = {
  inabe:  [24453,25301,3248,24441,21605,10701,13063,23460,24362,31541,46440,50115, 22680,12960,23063,14930,25646,26133,18900,35638,35680,36390],

// 売上 (円) — 売上・菌床代シート「26年度計画①（実績入力用）」 いなべ14行目/群馬(安中)15行目/南丹16行目, Q列(2025.1)〜 実績のみ ※ライブ取得
// (26/10はBD列「R8.10 実績」。BC列の「着地見込」は残っているが、着地見込みの月以外では読まない)
const REVENUE = {

// ライブ取得（Google Sheets gviz）— 上記フォールバック値を元シートの最新値で上書きする

// ────────────────────────────────────────────────────────────────

};

// 大きいシート(特に売上・菌床代シートは999行×50列超)ではgvizの応答に時間がかかることがあるため、
// タイムアウトは長めに取り、失敗時は1回だけ再試行する(一時的なネットワーク不調・応答遅延を吸収するため)。
async function fetchSheetOnce(sheetId, sheetName, headers) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&headers=${headers}`;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  try {
    const res = await fetch(url, { signal: controller.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${sheetName}`);
    const text = await res.text();
    const json = JSON.parse(text.replace(/^[^{]+/, '').replace(/[^}]+$/, ''));
    if (json.status === 'error') throw new Error(json.errors?.[0]?.detailed_message || 'シートエラー');
    const table = json.table;
    // 応答が極端に短い(行がほぼ無い)場合は、途中で応答が切れた/取得失敗のサインとみなし再試行対象にする
    if (!table || !table.rows || table.rows.length < 2) {
      throw new Error(`${sheetName}: 応答データが空または不完全です ${sampleRowStrings(table && table.rows)}`);
    }
    return table;
  } finally {
    clearTimeout(timer);
  }
}

async function fetchSheet(sheetId, sheetName, headers = 1) {
  try {
    return await fetchSheetOnce(sheetId, sheetName, headers);
  } catch (e) {
    await new Promise(r => setTimeout(r, 1000));
    return await fetchSheetOnce(sheetId, sheetName, headers);
  }
}

// エラーメッセージに実際の応答内容の先頭数行を埋め込むための診断用ヘルパー。
// 期待通りの取得ができない場合に「実際に何が返ってきたか」をバナー上で確認できるようにする。
function sampleRowStrings(rows, maxRows = 5, maxCols = 6) {
  const out = [];
  for (let i = 0; i < (rows || []).length && out.length < maxRows; i++) {
    const cells = (rows[i].c || []).slice(0, maxCols).map(c => (c && c.v != null ? String(c.v) : '·'));
    out.push(`[${i}]${cells.join(',')}`);
  }
  return out.join(' ');
}

// 菌床数集計タブ: 拠点名(B列)は各ブロック先頭行のみ入っているため直前の値を引き継ぎ、
// 「合計」行(C列)を見つけたらD列以降N列分(2025.1〜)を月次配列として取り出す。
// 列は見出しの表記ゆれ(2025.10が"2025.1"と表示される既知の不具合)を避けるためD列起点の位置で判定する。
function parseBedCountTable(table) {
  const NAME_MAP = { 'いなべ': 'inabe', '群馬': 'gunma', '南丹': 'nantan' };
  const result = { inabe: Array(N).fill(null), gunma: Array(N).fill(null), nantan: Array(N).fill(null) };
  // このシートは本数ブロックの下に「金額(円)」ブロックが同じ(拠点＋合計)構成で続くため、
  // 単純に後勝ちで代入すると空の金額ブロックで本数が消える。拠点ごとに最初に見つかった
  // 「値の入った合計行」だけを採用する。
  const assigned = {};
  let currentSite = null;
  (table.rows || []).forEach(row => {
    const cells = row.c || [];
    const siteName = cells[1]?.v != null ? String(cells[1].v).trim() : '';
    if (siteName) currentSite = NAME_MAP[siteName] || null;
    const rowType = cells[2]?.v != null ? String(cells[2].v).trim() : '';
    if (rowType === '合計' && currentSite && !assigned[currentSite]) {
      const vals = [];
      for (let i = 0; i < N; i++) {
        const v = cells[3 + i]?.v;
        vals.push(v != null && v !== '' && !isNaN(v) ? Number(v) : null);
      }
      if (vals.some(v => v != null)) {
        result[currentSite] = vals;
        assigned[currentSite] = true;
      }
    }
  });
  // 3拠点すべてが空の場合は、シート構成が想定と異なる(または取得内容が不完全な)可能性が高いため
  // 「取得成功だがデータ無し」を「エラー」として明示的に扱う
  if (Object.values(result).every(arr => arr.every(v => v == null))) {
    throw new Error(`拠点の合計行が見つかりません(取得行数=${(table.rows || []).length}) ${sampleRowStrings(table.rows)}`);
  }
  return result;
}

// 「n月」行の判定。月セルが日付書式の場合、gvizは生値(v)を"Date(2026,0,1)"形式で返し
// 表示文字列(f)にだけ"1月"が入るため、f→vの順で照合する。
function monthFromCell(cell) {
  if (!cell) return null;
  for (const raw of [cell.f, cell.v]) {
    const m = String(raw ?? '').trim().match(/^(\d{1,2})月$/);
    if (!m) continue;
    const month = parseInt(m[1], 10);
    if (month >= 1 && month <= 12) return month;
  }
  return null;
}

// 数値セルの取り出し。gvizが数値を文字列で返す場合にも備える(0・数値以外は未入力扱い)。
function numOrNull(v) {
  const n = typeof v === 'number' ? v : (typeof v === 'string' && v.trim() !== '' ? Number(v) : NaN);
  return Number.isFinite(n) && n !== 0 ? n : null;
}

// gvizは列ごとに型を推定し、数値の列にある見出しの文字(出荷量・R8.9など)を値から落とす。
// そのため見出し行は headers=n で列名(table.cols[].label)として受け取り、ここから探す。
// 列名は上からn行分の文字が半角スペースでつながるので、最後の語を見出しとして使う。
function columnLabels(table) {
  return (table.cols || []).map(c => String(c.label || '').trim().split(/\s+/).pop());
}

// 出荷量＆出荷額シート: 「{年}{拠点名}」タブ(例:2025いなべ)。列は見出し(2行目の出荷量(固定)/出荷額/売上)で
// 特定し、行は「n月」ラベルで特定する(行・列位置に依存しないため多少の行列挿入があっても壊れにくい)。
async function fetchShipmentSiteYear(sheetId, year, siteNameJP) {
  const tabName = `${year}${siteNameJP}`;
  const table = await fetchSheet(sheetId, tabName, 2);
  const rows = table.rows || [];
  let colB = null, colE = null, colJ = null;
  columnLabels(table).forEach((label, i) => {
    // 出荷量の見出しはタブによって表記が異なる(いなべ:「出荷量(固定)」／群馬・南丹:「出荷量」)
    if (colB == null && (label === '出荷量(固定)' || label === '出荷量')) colB = i;
    if (colE == null && label === '出荷額') colE = i;
    if (colJ == null && label === 'g単価(売上ベース)') colJ = i;
  });
  if (colB == null || colE == null) {
    throw new Error(`${tabName}: 列見出しが見つかりません(列名=${columnLabels(table).slice(0, 12).join(',')})`);
  }
  // 売上単価は見出しが変わっても取得を続けられるよう、見つからない場合はJ列(0始まりで9)を採用する
  if (colJ == null) colJ = 9;

  const shipment = Array(12).fill(null);
  const shipmentValue = Array(12).fill(null);
  const unitPrice = Array(12).fill(null);
  // 同じタブの下の方に「1月〜12月」の行を持つ別の表があるため、上の表(各月の最初の行)だけを採用する
  const seen = new Set();
  rows.forEach(row => {
    const cells = row.c || [];
    const month = monthFromCell(cells[0]);
    if (month == null || seen.has(month)) return;
    seen.add(month);
    const bVal = numOrNull(cells[colB]?.v);
    const eVal = numOrNull(cells[colE]?.v);
    const jVal = numOrNull(cells[colJ]?.v);
    shipment[month - 1] = bVal != null ? +(bVal / 1000).toFixed(2) : null;
    shipmentValue[month - 1] = eVal != null ? Math.round(eVal) : null;
    // 売上単価はシートの値をそのまま採用する(丸めのみ。計算は一切しない)
    unitPrice[month - 1] = jVal != null ? +jVal.toFixed(4) : null;
  });
  return { shipment, shipmentValue, unitPrice, rows };
}

// 出荷量＆出荷額シート「{年}全拠点」タブ: 全社合計の売上単価は各拠点から算出せず、
// このタブの「g単価(売上ベース)」列(I列)の値をそのまま採用する。
async function fetchTotalUnitPriceYear(sheetId, year) {
  const tabName = `${year}全拠点`;
  const table = await fetchSheet(sheetId, tabName, 2);
  const rows = table.rows || [];
  let colI = columnLabels(table).indexOf('g単価(売上ベース)');
  if (colI < 0) colI = null;
  // 見出しが見つからない場合はI列(0始まりで8)を採用する
  if (colI == null) colI = 8;

  const unitPrice = Array(12).fill(null);
  // 同じタブの下の方に「1月〜12月」の行を持つ別の表があるため、上の表(各月の最初の行)だけを採用する
  const seen = new Set();
  rows.forEach(row => {
    const cells = row.c || [];
    const month = monthFromCell(cells[0]);
    if (month == null || seen.has(month)) return;
    seen.add(month);
    const v = numOrNull(cells[colI]?.v);
    unitPrice[month - 1] = v != null ? +v.toFixed(4) : null;
  });
  // 1件も取れなかった場合は「取得成功・データ0件」ではなく取得失敗として扱う
  // (黙ってフォールバック値をnullで上書きするとグラフから線が消えて原因が分からなくなるため)
  if (unitPrice.every(v => v == null)) {
    throw new Error(`${tabName}: 売上単価(g単価(売上ベース))の値が取得できません(取得行数=${rows.length}) ${sampleRowStrings(rows)}`);
  }
  return unitPrice;
}

// 拠点ごとに独立して取得し、1拠点が失敗しても他拠点の成功分は反映する(全滅を避ける)。
// 同一スプレッドシートへの同時リクエストはgviz側で不安定になることがある(観測: 2つの年を
// 並列取得すると、どちらか一方だけがランダムに「列見出しが見つからない」応答になる)ため、
// 同一スプレッドシートIDに対する取得は年単位も含めて完全に直列化する。
async function fetchShipmentAll(sheetId) {
  const SITE_JP = { inabe: 'いなべ', gunma: '群馬', nantan: '南丹' };
  const shipment = {}, shipmentValue = {}, unitPrice = {};
  const failures = [];
  for (const key of Object.keys(SITE_JP)) {
    try {
      const y25 = await fetchShipmentSiteYear(sheetId, 2025, SITE_JP[key]);
      const y26 = await fetchShipmentSiteYear(sheetId, 2026, SITE_JP[key]);
      shipment[key] = [...y25.shipment, ...y26.shipment].slice(0, N);
      shipmentValue[key] = [...y25.shipmentValue, ...y26.shipmentValue].slice(0, N);
      // 売上単価が1件も取れなかった場合はフォールバック値を維持し、失敗として明示する
      const up = [...y25.unitPrice, ...y26.unitPrice].slice(0, N);
      if (up.some(v => v != null)) {
        unitPrice[key] = up;
      } else {
        failures.push(`${SITE_JP[key]}(売上単価): 「g単価(売上ベース)」列の値が取得できません ${sampleRowStrings(y26.rows)}`);
      }
    } catch (e) {
      failures.push(`${SITE_JP[key]}: ${e.message}`);
    }
  }
  try {
    const t25 = await fetchTotalUnitPriceYear(sheetId, 2025);
    const t26 = await fetchTotalUnitPriceYear(sheetId, 2026);
    unitPrice.total = [...t25, ...t26].slice(0, N);
  } catch (e) {
    failures.push(`全拠点(売上単価): ${e.message}`);
  }

  return { shipment, shipmentValue, unitPrice, failures };
}

// 売上・菌床代シート: 列構成が期間によって変化する(実績のみ1列 → 計画/実績/予実差異/前月差異の4列 →
// 計画/実績の2列)ため、月ラベル行("R7.1"等)と実績/計画マーカー行から「実績」列だけを特定する。
// この2行は数値の列にあり値からは落ちるので、上6行を列名(headers=6、例「R8.9 実績」)として受け取る。
// 対象行も固定行番号ではなく科目名(売上高（いなべ）等)で照合するため行挿入に強い。
const SALES_HEADER_ROWS = 6;
function parseSalesTable(table) {
  const REVENUE_LABELS = { '売上高（いなべ）': 'inabe', '売上高（安中）': 'gunma', '売上高（南丹）': 'nantan' };
  const COST_LABELS = { '売上原価（いなべ）菌床代': 'inabe', '売上原価（安中）菌床代': 'gunma', '売上原価（南丹）菌床代': 'nantan' };
  const revenue = { inabe: Array(N).fill(null), gunma: Array(N).fill(null), nantan: Array(N).fill(null) };
  const substrateCost = { inabe: Array(N).fill(null), gunma: Array(N).fill(null), nantan: Array(N).fill(null) };

  const rows = table.rows || [];
  const colToIdx = {};
  (table.cols || []).forEach((col, c) => {
    // 着地見込みの月だけは「着地見込」列を採用する(実績列はまだ空のため)
    const m = String(col.label || '').trim().match(/R(\d+)\.(\d+)\s+(実績|着地見込)$/);
    if (!m) return;
    const marker = m[3];
    const year = 2018 + parseInt(m[1], 10);
    const month = parseInt(m[2], 10);
    const idx = (year - 2025) * 12 + (month - 1);
    if (idx < 0 || idx >= N) return;
    if ((marker === '着地見込') !== isForecast(idx)) return;
    colToIdx[c] = idx;
  });
  if (!Object.keys(colToIdx).length) {
    throw new Error(`月ラベル/実績の列が見つかりません(列名=${(table.cols || []).slice(0, 8).map(c => c.label).join(',')})`);
  }

  rows.forEach(row => {
    const cells = row.c || [];
    const label = cells[0]?.v != null ? String(cells[0].v).trim() : '';
    const key = REVENUE_LABELS[label] || COST_LABELS[label];
    if (!key) return;
    const target = REVENUE_LABELS[label] ? revenue : substrateCost;
    Object.entries(colToIdx).forEach(([c, idx]) => {
      const v = cells[c]?.v;
      target[key][idx] = (v != null && v !== 0) ? Math.round(v) : null;
    });
  });

  return { revenue, substrateCost };
}

let liveStatus = { bedCount: 'pending', shipment: 'pending', sales: 'pending' };
let liveErrorMsgs = {};
let lastLiveFetchAt = null;

function coverageText(arr) {
  const { idx } = lastValid(arr);
  if (idx < 0) return '未入力';
  const [yy, mm] = MONTH_LABELS[idx].split('/');
  return `20${yy}年${mm}月${isForecast(idx) ? '（着地見込）' : ''}`;
}

function updateLiveBanner() {
  const banner = document.getElementById('coverage-banner');
  if (!banner) return;
  const statusIcon = key => ({ ok: '🟢', error: '🔴', loading: '⏳', pending: '' }[liveStatus[key]] || '');
  const errLines = Object.entries(liveErrorMsgs).map(([key, msg]) =>
    `⚠ ${LIVE_SHEETS[key]?.label || key}のライブ取得に失敗したため前回値を表示しています（${msg}）`
  );
  banner.innerHTML = `
    <strong>データ最終反映月：</strong>
    収穫量＝${coverageText(DATA.total.harvest)}（手動更新）／
    出荷量・出荷額＝${coverageText(DATA.total.shipment)}${statusIcon('shipment')}／
    菌床仕入本数＝${coverageText(DATA.total.bedCount)}${statusIcon('bedCount')}／
    売上＝${coverageText(DATA.total.revenue)}${statusIcon('sales')}／
    菌床代＝${coverageText(DATA.total.substrateCost)}${statusIcon('sales')}
    （各元シートへの入力状況により異なります。それ以降は未入力のため「—」表示です）
    ${FORECAST_IDX >= 0 ? `<br>${FORECAST_LABEL}は着地見込み（グラフの棒は薄い色・折れ線は点線）。出荷量・出荷額・売上単価は月が締まるまで表示しません` : ''}
    ${lastLiveFetchAt ? `<br><span style="font-size:0.75rem;color:var(--muted)">最終ライブ取得: ${lastLiveFetchAt.toLocaleString('ja-JP')}</span>` : ''}
    ${errLines.length ? `<br>${errLines.map(l => `<span style="color:var(--bad)">${l}</span>`).join('<br>')}` : ''}
  `;
}

async function refreshLiveData() {
  liveStatus = { bedCount: 'loading', shipment: 'loading', sales: 'loading' };
  liveErrorMsgs = {};
  updateLiveBanner();

  const [bedRes, shipRes, salesRes] = await Promise.allSettled([
    fetchSheet(LIVE_SHEETS.bedCount.id, LIVE_SHEETS.bedCount.tab, 1).then(parseBedCountTable),
    fetchShipmentAll(LIVE_SHEETS.shipment.id),
    fetchSheet(LIVE_SHEETS.sales.id, LIVE_SHEETS.sales.tab, SALES_HEADER_ROWS).then(parseSalesTable),
  ]);

  if (bedRes.status === 'fulfilled') {
    Object.assign(BED_COUNT, bedRes.value);
    liveStatus.bedCount = 'ok';
  } else {
    liveStatus.bedCount = 'error';
    liveErrorMsgs.bedCount = bedRes.reason?.message || String(bedRes.reason);
    console.error('菌床仕入本数の取得に失敗:', bedRes.reason);
  }

  if (shipRes.status === 'fulfilled') {
    Object.assign(SHIPMENT, shipRes.value.shipment);
    Object.assign(SHIPMENT_VALUE, shipRes.value.shipmentValue);
    Object.assign(UNIT_PRICE, shipRes.value.unitPrice);
    if (shipRes.value.failures.length) {
      liveStatus.shipment = 'error';
      liveErrorMsgs.shipment = shipRes.value.failures.join(' / ');
      console.error('出荷量・出荷額の取得に一部失敗:', shipRes.value.failures);
    } else {
      liveStatus.shipment = 'ok';
    }
  } else {
    liveStatus.shipment = 'error';
    liveErrorMsgs.shipment = shipRes.reason?.message || String(shipRes.reason);
    console.error('出荷量・出荷額の取得に失敗:', shipRes.reason);
  }

  if (salesRes.status === 'fulfilled') {
    Object.assign(REVENUE, salesRes.value.revenue);
    Object.assign(SUBSTRATE_COST, salesRes.value.substrateCost);
    liveStatus.sales = 'ok';
  } else {
    liveStatus.sales = 'error';
    liveErrorMsgs.sales = salesRes.reason?.message || String(salesRes.reason);
    console.error('売上・菌床代の取得に失敗:', salesRes.reason);
  }

  lastLiveFetchAt = new Date();
  DATA = buildData();
  updateLiveBanner();
  render();
}

// 着地見込みの月を空にする(出荷量＆出荷額シートは月の途中の入力済み分しか無いため。FORECAST_LABELのコメント参照)
function withoutForecast(arr) {
  return arr.map((v, i) => isForecast(i) ? null : v);
}

function calcSite(siteKey) {
  const harvest       = HARVEST[siteKey];
  const shipment      = withoutForecast(SHIPMENT[siteKey]);
  const bedCount      = BED_COUNT[siteKey];
  const shipmentValue = withoutForecast(SHIPMENT_VALUE[siteKey]);
  const revenue       = REVENUE[siteKey];
  const substrateCost = SUBSTRATE_COST[siteKey];
  // 売上単価はシート「g単価(売上ベース)」列の値をそのまま使う(コード側では計算しない)
  const unitPrice     = withoutForecast(UNIT_PRICE[siteKey]);

  const yieldRate   = shipment.map((v,i) => (v == null || !harvest[i]) ? null : +(v / harvest[i] * 100).toFixed(1));
  const costRatio   = revenue.map((v,i) => (v == null || substrateCost[i] == null) ? null : +(substrateCost[i] / v * 100).toFixed(1));
  const grossProfit = revenue.map((v,i) => (v == null || substrateCost[i] == null) ? null : v - substrateCost[i]);
  // 1菌床あたり収穫量 (g/本) = 収穫量(kg)×1000 ÷ 菌床仕入本数
  const harvestPerBed = harvest.map((v,i) => (v == null || !bedCount[i]) ? null : Math.round(v * 1000 / bedCount[i]));
  // 1菌床あたり出荷量 (g/本) = 出荷量(kg)×1000 ÷ 菌床仕入本数
  const shipmentPerBed = shipment.map((v,i) => (v == null || !bedCount[i]) ? null : Math.round(v * 1000 / bedCount[i]));
  // 売上÷菌床代 = 菌床投資売上倍率 (倍)
  const salesCostRatio = revenue.map((v,i) => (v == null || !substrateCost[i]) ? null : +(v / substrateCost[i]).toFixed(2));
  // 1菌床単価 (円/本) = 菌床仕入額 ÷ 菌床仕入本数
  const bedUnitCost = substrateCost.map((v,i) => (v == null || !bedCount[i]) ? null : Math.round(v / bedCount[i]));

  return { harvest, shipment, bedCount, shipmentValue, revenue, substrateCost, unitPrice, yieldRate, costRatio, grossProfit, harvestPerBed, shipmentPerBed, salesCostRatio, bedUnitCost };
}

// 全社合計（各配列を月ごとに合算。null月はnull）
function sumArr(...arrs) {
  return Array.from({length: N}, (_, i) => {
    if (arrs.some(a => a[i] == null)) return null;
    return arrs.reduce((s,a) => s + a[i], 0);
  });
}

// ライブ取得したシートデータで上書きした後、DATAを再計算するために関数化
function buildData() {
  const data = {};
  SITES.forEach(s => { data[s.key] = calcSite(s.key); });

  data.total = {
    harvest:  sumArr(data.inabe.harvest, data.gunma.harvest, data.nantan.harvest),
    shipment: sumArr(data.inabe.shipment, data.gunma.shipment, data.nantan.shipment),
    bedCount: sumArr(data.inabe.bedCount, data.gunma.bedCount, data.nantan.bedCount),
    shipmentValue: sumArr(data.inabe.shipmentValue, data.gunma.shipmentValue, data.nantan.shipmentValue),
    revenue:  sumArr(data.inabe.revenue, data.gunma.revenue, data.nantan.revenue),
    substrateCost: sumArr(data.inabe.substrateCost, data.gunma.substrateCost, data.nantan.substrateCost),
    grossProfit: sumArr(data.inabe.grossProfit, data.gunma.grossProfit, data.nantan.grossProfit),
    // 売上単価は合算できないため、全拠点タブから取得した値をそのまま使う
    unitPrice: withoutForecast(UNIT_PRICE.total),
  };
  data.total.yieldRate = data.total.shipment.map((v,i) => (v == null || !data.total.harvest[i]) ? null : +(v / data.total.harvest[i] * 100).toFixed(1));
  data.total.costRatio = data.total.revenue.map((v,i) => (v == null || data.total.substrateCost[i] == null) ? null : +(data.total.substrateCost[i] / v * 100).toFixed(1));
  data.total.harvestPerBed = data.total.harvest.map((v,i) => (v == null || !data.total.bedCount[i]) ? null : Math.round(v * 1000 / data.total.bedCount[i]));
  data.total.shipmentPerBed = data.total.shipment.map((v,i) => (v == null || !data.total.bedCount[i]) ? null : Math.round(v * 1000 / data.total.bedCount[i]));
  data.total.salesCostRatio = data.total.revenue.map((v,i) => (v == null || !data.total.substrateCost[i]) ? null : +(v / data.total.substrateCost[i]).toFixed(2));
  data.total.bedUnitCost = data.total.substrateCost.map((v,i) => (v == null || !data.total.bedCount[i]) ? null : Math.round(v / data.total.bedCount[i]));
  return data;
}

// 目標値などの基準線。実績と区別できるよう、点を描かない灰色の破線で重ねる
const BASELINE_COLOR = '#6b7280';
function baselineSeries(value, label, length = 12) {
  return { label, data: Array(length).fill(value), color: BASELINE_COLOR, type: 'line', axis: 'y', dash: [4, 4], pointRadius: 0, baseline: true };
}

// 年別に切り出した12ヶ月の中で、着地見込みの月が何番目か(その年に無ければ-1)
function forecastIdxInYear(year) {
  const i = FORECAST_IDX - (year - YEARS[0]) * 12;
  return FORECAST_IDX >= 0 && i >= 0 && i < 12 ? i : -1;
}
// 系列に着地見込みの月を付ける(drawComboが棒を薄く・折れ線を点線にする)。基準線は対象外
function markForecast(series, year) {
  const f = forecastIdxInYear(year);
  series.forEach(s => { if (!s.baseline && s.forecastIdx == null) s.forecastIdx = f; });
  return series;
}

// 共通ユーティリティ
// ────────────────────────────────────────────────────────────────
const fmt = (n, digits = 0) => n == null ? '—' : n.toLocaleString('ja-JP', { minimumFractionDigits: digits, maximumFractionDigits: digits });
const fmtUnit = (n, unit, digits = 0) => n == null ? '—' : `${fmt(n, digits)} ${unit}`;
function pctLabel(pct) {
  if (pct == null) return '—';
  return pct >= 0 ? `+${pct.toFixed(1)}%` : `▲${Math.abs(pct).toFixed(1)}%`;
}
function lastValid(arr) {
  for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return { value: arr[i], idx: i };
  return { value: null, idx: -1 };
}
function sumValid(arr) { return arr.filter(v => v != null).reduce((s,v) => s+v, 0); }
function avgValid(arr) { const v = arr.filter(v => v != null); return v.length ? sumValid(v) / v.length : null; }

// 最新値 + 前月比 + 前年比(同月, 12ヶ月前)をまとめて算出
function cardStat(arr) {
  const last = lastValid(arr);
  if (last.idx < 0) return { value: null, idx: -1, mom: null, momPct: null, yoy: null, yoyPct: null };
  const prev = last.idx >= 1 ? arr[last.idx - 1] : null;
  const yoyIdx = last.idx - 12;
  const yoyVal = yoyIdx >= 0 ? arr[yoyIdx] : null;
  const mom = prev != null ? last.value - prev : null;
  const momPct = (mom != null && prev) ? mom / prev * 100 : null;
  const yoy = yoyVal != null ? last.value - yoyVal : null;
  const yoyPct = (yoy != null && yoyVal) ? yoy / yoyVal * 100 : null;
  return { value: last.value, idx: last.idx, mom, momPct, yoy, yoyPct };
}

// 20ヶ月の通し配列から該当年の1〜12月を切り出す（存在しない月はnull埋め）
const YEARS = [2025, 2026];
const YEAR_MONTH_LABELS = Array.from({ length: 12 }, (_, i) => `${i+1}月`);
function yearSlice(arr, year) {
  const start = year === 2025 ? 0 : 12;
  const s = arr.slice(start, start + 12);
  while (s.length < 12) s.push(null);
  return s;
}
function sliceDataset(d, year) {
  const out = {};
  Object.keys(d).forEach(k => { out[k] = yearSlice(d[k], year); });
  return out;
}

function kpiCardHtml(d, c) {

// チャート共通描画（複数軸対応の棒+折れ線コンボ / 散布図）
// ────────────────────────────────────────────────────────────────
function drawCombo(canvasId, labels, series) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId).getContext('2d');
  const axesUsed = [...new Set(series.map(s => s.axis || 'y'))];

  const datasets = series.map(s => {
    // 着地見込みの月: 棒は薄い色、折れ線はその月へつながる区間を点線・点を白抜きにする
    const f = s.forecastIdx != null ? s.forecastIdx : -1;
    const isLine = s.type === 'line';
    return {
      type: s.type || 'bar',
      label: s.label,
      data: s.data,
      backgroundColor: isLine ? 'transparent'
        : (f >= 0 ? s.data.map((_, i) => s.color + (i === f ? '4d' : 'cc')) : s.color + 'cc'),
      borderColor: s.color,
      borderWidth: isLine ? 2.5 : 1,
      borderRadius: isLine ? 0 : 4,
      borderDash: s.dash || undefined,
      segment: isLine && f >= 0 ? { borderDash: c => c.p1DataIndex === f ? [5, 4] : (s.dash || undefined) } : undefined,
      pointBackgroundColor: isLine && f >= 0 ? s.data.map((_, i) => i === f ? '#ffffff' : s.color) : undefined,
      pointRadius: s.pointRadius != null ? s.pointRadius : (isLine ? 3 : 0),
      tension: s.tension != null ? s.tension : 0.3,
      spanGaps: false,
      yAxisID: s.axis || 'y',
      forecastIdx: f,
    };
  });

  const scales = { x: { ticks: { color: '#6b7280', font: { size: 10 } }, grid: { display: false } } };
  axesUsed.forEach(id => {
    scales[id] = {
      position: id === 'y' ? 'left' : 'right',
      ticks: { color: '#6b7280', font: { size: 10 } },
      grid: { drawOnChartArea: id === 'y', color: '#eef0f3' },
    };
  });

  charts[canvasId] = new Chart(ctx, {
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { color: '#374151', font: { size: 10 }, boxWidth: 12, padding: 10 } },
        tooltip: {
          backgroundColor: '#ffffff', borderColor: '#e3e6ea', borderWidth: 1,
          titleColor: '#1f2430', bodyColor: '#374151',
          callbacks: { label: (c) => `${c.dataset.label}: ${c.parsed.y == null ? '—' : c.parsed.y.toLocaleString('ja-JP')}${c.dataIndex === c.dataset.forecastIdx ? '（着地見込）' : ''}` },
        },
      },
      scales,
    },
  });
}

function buildAlertsHtml(d) {
  const rows = ALERT_METRICS.map(m => {
    const st = cardStat(d[m.key]);
    if (st.momPct == null) return null;
    const abs = Math.abs(st.momPct);
    const dirLabel = st.momPct >= 0 ? '上昇' : '低下';
    const isGoodMove = m.good ? (st.momPct >= 0) === (m.good === 'up') : null;
    let sev, sevLabel;
    if (abs < 3) { sev = 'ok'; sevLabel = '安定'; }
    else if (isGoodMove === true) { sev = 'ok'; sevLabel = '好調'; }
    else { sev = abs < 8 ? 'warn' : 'bad'; sevLabel = dirLabel; }
    return { m, st, sev, sevLabel };
  }).filter(Boolean);

  if (!rows.length) return `<div class="alert-empty">アラート対象データがありません</div>`;

  return `<table>
    <thead><tr><th>KPI</th><th>状態</th><th>内容</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${r.m.label}</td>
      <td><span class="badge badge-${r.sev}">${r.sevLabel}</span></td>
      <td>前月比 ${pctLabel(r.st.momPct)}（${monthLabel(r.st.idx)}時点）</td>

  </table>`;
}

// ── 菌床投資売上倍率テーブル(表1: 各拠点×期間) ──
// 1ヶ月/2ヶ月/3ヶ月単位を切り替えられる。複数月の倍率は各月の倍率の平均ではなく、
// 期間合計の売上 ÷ 期間合計の菌床仕入額で算出する(月ごとの規模差に左右されないため)。
// 期間の区切りは年をまたがないよう各年の1月起点で区切る。
let salesCostPeriod = 1;

function salesCostBuckets(period) {
  const buckets = [];
  YEARS.forEach((year, yi) => {
    for (let start = 0; start < 12; start += period) {
      const idxs = [];
      for (let k = start; k < start + period && k < 12; k++) {
        const idx = yi * 12 + k;
        if (idx < N) idxs.push(idx);
      }
      if (!idxs.length) continue;
      const first = MONTH_LABELS[idxs[0]];
      const last = MONTH_LABELS[idxs[idxs.length - 1]];
      const label = idxs.length === 1 ? first : `${first}-${last.split('/')[1]}`;
      buckets.push({ label: label + (idxs.some(isForecast) ? '（着地見込含む）' : ''), idxs });
    }
  });
  return buckets;
}

function salesCostRatioFor(siteKey, idxs) {
  const d = DATA[siteKey];
  let revenue = 0, cost = 0, months = 0;
  idxs.forEach(i => {
    if (d.revenue[i] == null || d.substrateCost[i] == null) return;
    revenue += d.revenue[i];
    cost += d.substrateCost[i];
    months++;
  });
  if (!months || !cost) return null;
  return +(revenue / cost).toFixed(2);
}

// グラフ用: 年内を periodヶ月ずつに区切った倍率を、その期間の各月に同じ値で並べた配列にする
// (表1と同じ区切り・同じ定義なので、グラフの平均線と表の数値が一致する)
function periodRatioSeries(revenue, substrateCost, period) {
  const out = Array(revenue.length).fill(null);
  for (let start = 0; start < revenue.length; start += period) {
    const end = Math.min(start + period, revenue.length);
    let rev = 0, cost = 0, months = 0;
    for (let i = start; i < end; i++) {
      if (revenue[i] == null || substrateCost[i] == null) continue;
      rev += revenue[i]; cost += substrateCost[i]; months++;
    }
    if (!months || !cost) continue;
    const v = +(rev / cost).toFixed(2);
    for (let i = start; i < end; i++) out[i] = v;
  }
  return out;
}

function buildSalesCostTableHtml(period) {
  const cols = [...SITES, TOTAL_SITE];
  const head = `<th>期間</th>` + cols.map(c => `<th class="num">${c.name}</th>`).join('');
  const rows = salesCostBuckets(period).map(b =>
    `<tr><td class="dim">${b.label}</td>${cols.map(c => `<td class="num">${fmt(salesCostRatioFor(c.key, b.idxs), 2)}</td>`).join('')}</tr>`
  ).join('');
  const allIdxs = Array.from({ length: N }, (_, i) => i);
  const footer = `<tr class="footer-row"><td class="dim">全期間</td>${cols.map(c =>
    `<td class="num">${fmt(salesCostRatioFor(c.key, allIdxs), 2)}</td>`).join('')}</tr>`;
  return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}${footer}</tbody></table></div>`;
}

function renderSalesCostTable() {
  const el = document.getElementById('salescost-table');
  if (!el) return;
  el.innerHTML = buildSalesCostTableHtml(salesCostPeriod);
  document.querySelectorAll('#salescost-period .site-tab').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.period) === salesCostPeriod);
  });
}

  salesCostPeriod = period;
  renderSalesCostTable();
}

// 概要タブと同じ定義(当月収穫量÷当月仕入本数)で、期間合計の値を出す
function monthlyPerBed(siteKey, from, to) {
  const d = DATA[siteKey];
  let h = 0, b = 0;
  for (let i = from; i <= to && i < N; i++) {
    if (d.harvest[i] == null || !d.bedCount[i]) continue;
    h += d.harvest[i]; b += d.bedCount[i];
  }
  return b ? Math.round(h * 1000 / b) : null;
}

        <div>南丹は <strong>投入から50日目までの収穫は他拠点と同じか多い</strong>（50日目 南丹 ${at('nantan', 50)}g／いなべ ${at('inabe', 50)}g／群馬 ${at('gunma', 50)}g）。

        そのため南丹の累計は60日目ごろ ${at('nantan', 62)}g で止まり、いなべは90日目 ${at('inabe', 90)}g まで伸びる。</div>
        <div>もう一つは <strong>冬（25年10〜12月）に投入したコンテナが低い</strong>こと。南丹は ${A.nantan.startM['25/10'][0]}／${A.nantan.startM['25/11'][0]}／${A.nantan.startM['25/12'][0]}g で、同じ時期のいなべ（${A.inabe.startM['25/10'][0]}／${A.inabe.startM['25/11'][0]}／${A.inabe.startM['25/12'][0]}g）を大きく下回る。群馬も同じ時期は低い。

        <div>試算：南丹の54日目（平均的に切り上げる時期、${at('nantan', 54)}g）以降に、いなべと同じ伸び（54→90日目で +${at('inabe', 90) - at('inabe', 54)}g）が取れれば、南丹は約 ${at('nantan', 54) + at('inabe', 90) - at('inabe', 54)}g/菌床 になる。ただし群馬は長く続けても60日目以降の伸びが小さい（+${at('gunma', 90) - at('gunma', 60)}g）ので、日数を延ばすだけでなく2回目以降の発生を取れるかが条件になる。</div>
        <div>26年7〜10月投入のコンテナ（下の帯）で見ると、早く切り上げている点は同じ（60日以上続けたのは南丹 40本中4本、いなべ 35本中28本、群馬 26本中16本）。

  if (!el) return;
  document.querySelectorAll('#band-mode .site-tab').forEach(b => b.classList.toggle('active', b.dataset.mode === bandMode));
  const elapsed = bandMode === 'elapsed';
  // 横軸：日数モードは 0〜100日、日付モードは 7/1〜今日
  const x0 = elapsed ? 0 : bandDate('7/1');
  const x1 = elapsed ? 100 : bandDate(BAND_ASOF);
  const pos = v => Math.max(0, Math.min(100, (v - x0) / (x1 - x0) * 100));
  const ticks = elapsed
    ? [0, 20, 40, 60, 80, 100].map(v => ({ v, label: `${v}日` }))
    : ['7/1', '8/1', '9/1', '10/1', '11/1'].map(md => ({ v: bandDate(md), label: md }));
  document.getElementById('band-legend-line').innerHTML = elapsed ? '<i class="line60"></i>60日目' : '';

  // 拠点ごとの集計（栽培を終えたコンテナ）
  const stat = k => {
    const done = CONTAINER_BANDS[k].filter(r => r[3]);
    const beds = done.reduce((s, r) => s + r[5], 0);
    return {
      n: done.length, on: CONTAINER_BANDS[k].length - done.length,
      days: done.length ? (done.reduce((s, r) => s + r[4], 0) / done.length).toFixed(1) : '—',
      ge60: done.filter(r => r[4] >= 60).length,
      g: beds ? Math.round(done.reduce((s, r) => s + r[6] * r[5], 0) / beds) : null,
    };
  };
  document.getElementById('band-summary').innerHTML = `<div class="table-wrap" style="margin:6px 0 14px"><table>
    <thead><tr><th>拠点</th><th class="num">収穫を終えた本数</th><th class="num">平均栽培日数</th><th class="num">60日以上続けた本数</th><th class="num">1菌床当たり収穫量（終えた分）</th><th class="num">栽培中</th></tr></thead>
    <tbody>${SITES.map(s => { const t = stat(s.key); return `<tr><td>${s.name}</td><td class="num">${t.n}本</td><td class="num">${t.days}日</td>
      <td class="num">${t.ge60}本（${t.n ? Math.round(t.ge60 / t.n * 100) : 0}%）</td><td class="num">${fmt(t.g)}g</td><td class="num">${t.on}本</td></tr>`; }).join('')}</tbody>
  </table></div>`;

  const axis = `<div class="band-row band-axis"><div class="band-label"></div><div class="band-track">
    ${ticks.map(t => `<span style="left:${pos(t.v)}%${pos(t.v) >= 99 ? ';transform:translateX(-100%)' : ''}">${t.label}</span>`).join('')}</div><div class="band-val"></div></div>`;
  el.innerHTML = SITES.map(s => {
    const rows = CONTAINER_BANDS[s.key].map(r => {
      const [no, lot, st, en, days, beds, g] = r;
      const a = elapsed ? 0 : bandDate(st);
      const b = elapsed ? days : (en ? bandDate(en) : bandDate(BAND_ASOF));
      const left = pos(a), width = Math.max(0.6, pos(b) - left);
      const self = lot === '自社菌床' ? '<em>自</em>' : '';
      const tip = `${s.name} ${no}（${st}投入・${lot}・${fmt(beds)}本）${en ? `${en}終了` : '栽培中'}／${days}日／${g}g`;
      return `<div class="band-row" title="${tip}">
        <div class="band-label">${no}<small>（${st}）</small>${self}</div>
        <div class="band-track">${elapsed ? `<div class="band-60" style="left:${pos(60)}%"></div>` : ''}
          <div class="band-bar${en ? '' : ' ongoing'}" style="left:${left}%;width:${width}%;--c:${bandColor(g)}"></div></div>
        <div class="band-val">${days}日 <b style="color:${bandColor(g)}">${g}g</b>${en ? '' : ' <small>栽培中</small>'}</div>
      </div>`;
    }).join('');
    return `<div class="band-site"><div class="band-site-title" style="border-color:${s.color}">${s.name}（${CONTAINER_BANDS[s.key].length}本）</div>${axis}${rows}</div>`;
  }).join('');
}

// ────────────────────────────────────────────────────────────────
// 描画本体
// ────────────────────────────────────────────────────────────────
const MAIN_TABS = [
  { key: 'overview',    label: '概要' },
  { key: 'sitecompare', label: '拠点比較' },
  { key: 'yearcompare', label: '年度比較' },
  { key: 'nantan',      label: '南丹 要因分析' },
];

function render() {
  document.getElementById('main-tabs').innerHTML = MAIN_TABS.map(t =>
    `<button class="main-tab${t.key === activeMainTab ? ' active' : ''}" onclick="setMainTab('${t.key}')">${t.label}</button>`
  ).join('');

  const siteTabsEl = document.getElementById('site-tabs');
  siteTabsEl.style.display = (activeMainTab === 'sitecompare' || activeMainTab === 'nantan') ? 'none' : '';
  siteTabsEl.innerHTML = ALL_LOCS.map(l =>
    `<button class="site-tab${l.key === activeSite ? ' active' : ''}" onclick="setSite('${l.key}')">${l.name}</button>`
  ).join('');

  destroyAllCharts();
  chartDefs = {};

  if (activeMainTab === 'sitecompare') renderSiteCompare();
  else if (activeMainTab === 'yearcompare') renderYearCompare();
  else if (activeMainTab === 'nantan') renderNantanAnalysis();
  else renderOverview();

  document.getElementById('last-updated').textContent = `最終更新: ${new Date().toLocaleString('ja-JP')}`;
}

render();
updateLiveBanner();
refreshLiveData();
</script>
</body>
</html>
