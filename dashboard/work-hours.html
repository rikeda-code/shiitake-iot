function renderSummaryEmpChartDevContent(prodData, planData) {
  const { months, employees } = getExtendedActiveData();
  const content = document.getElementById('summary-content');
  const activeSites = SITES.filter(s => employees.some(e => e.base === s));
  const visibleRoleTypes = ROLE_TYPES.filter(wt => roleTypeFilter.has(wt));
  const { months: prodMonths, records } = prodData;

  // 標準工数エンジン（planDataがある場合のみ初期化）
  let stdEngine = null, stdRows = [], stdRowsByDiv = {};
  if (planData) {
    const { months: planMonths, records: planRecords } = planData;
    stdRows = loadYojitsuStdSettings();
    const conv = loadYojitsuCsConv();
    console.log('[empChartDev] planMonths:', planMonths?.length, 'planRecords:', planRecords?.length, 'stdRows:', stdRows?.length);
    stdEngine = createStdHoursEngine(planRecords, planMonths, months, planMonths.length, conv, null, '実数計画');
    ROLE_TYPES.forEach(wt => {
      stdRowsByDiv[wt] = stdRows.filter(r => r.div === wt);
      console.log(`[empChartDev] stdRowsByDiv[${wt}]:`, stdRowsByDiv[wt]?.length);
    });
  } else {
    console.warn('[empChartDev] planData is null/undefined');
  }

  // 業務区分ごとの標準工数（div='栽培' or '出荷'の設定行のみ使用）
  function calcStdForDiv(site, wt, mi) {
    if (!stdEngine) return null;
    const divRows = stdRowsByDiv[wt] || [];
    if (!divRows.length) return null;
    let total = 0, hasVal = false;
    divRows.forEach(r => {
      const result = stdEngine.calcRow(site, r, mi);
      if (result.h !== null) { total += result.h; hasVal = true; }
    });
    return hasVal ? Math.round(total * 10) / 10 : null;
  }

  // 生産実績側の指標値を、勤務実績側の表示列(months)に月文字列で突き合わせて取得する
  // （既存の生産性タブのprodVals()と同じ突き合わせ方式。延長分の空月(month:'')はnullのまま）
  function prodVals(site, metric) {
    const r = records.find(x => x.site === site && x.metric === metric);
    if (!r) return months.map(() => null);
    return months.map(m => {
      if (!m) return null;
      const pi = prodMonths.indexOf(normalizeMonth(m));
      return (pi >= 0 && r.values[pi] !== null) ? r.values[pi] : null;
    });
  }

  // 栽培／出荷それぞれの折れ線用データを拠点ごとに先に集めておき、
  // 同じ指標を重ねる全セクションで右軸の上限を揃える
  const lineValsBySite = {};
  activeSites.forEach(site => {
    lineValsBySite[site] = {
      '栽培': prodVals(site, DEV_LINE_METRIC_BY_ROLE['栽培']),
      '出荷': prodVals(site, DEV_LINE_METRIC_BY_ROLE['出荷']),
    };
  });
  const lineMaxByRole = {
    '栽培': computeSharedAxisMax(activeSites.map(site => lineValsBySite[site]['栽培']), 100, 1.1),
    '出荷': computeSharedAxisMax(activeSites.map(site => lineValsBySite[site]['出荷']), 100, 1.1),
  };

  const toggleHtml = planData ? `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;background:var(--card-bg2,#1e2a3a);border-radius:6px;width:fit-content">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:0.85rem;color:var(--muted)">
        <input type="checkbox" id="ecdev-std-toggle" ${empChartDevShowStd ? 'checked' : ''}
          onchange="window._ecdevToggleStd(this.checked)" style="accent-color:#38bdf8;cursor:pointer">
        標準工数を表示
      </label>
    </div>` : '';

  let html = `<div class="schart-shell">${toggleHtml}`;
  activeSites.forEach((site, si) => {
    visibleRoleTypes.forEach((wt, wi) => {
      const cid = `ecdev_${si}_${wi}`;
      html += `
        <div class="schart-section">
          <div class="schart-header" style="color:${SITE_COLORS[site]}">${site}　${wt}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div><div class="chart-section-label" style="padding-top:0;margin-bottom:6px">時間（h）</div>${chartWrapHtml(cid + '_h', months.length)}</div>
            <div><div class="chart-section-label" style="padding-top:0;margin-bottom:6px">人数（名）</div>${chartWrapHtml(cid + '_n', months.length)}</div>
          </div>
        </div>`;
    });
  });
  html += '</div>';
  content.innerHTML = html;

  // 各拠点×業務区分のデータセットを先に組み立てる（ページ内全グラフでY軸を統一するため）
  const perGroup = [];
  activeSites.forEach((site, si) => {
    visibleRoleTypes.forEach((wt, wi) => {
      const cid = `ecdev_${si}_${wi}`;
      const groupEmps = employees.filter(e => e.base === site && e.workType === wt);
      const datasetsH = EMP_CHART_TYPES.map(et => ({
        label: et,
        data: months.map((_, mi) => {
          const vals = groupEmps.filter(e => empDetailType(e.employment) === et).map(e => e.hours[mi]).filter(h => h !== null);
          return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)*10)/10 : null;
        }),
        backgroundColor: EMP_CHART_COLORS_MAP[et],
      }));
      // 標準工数バー（単色・非積み上げ）
      if (planData) {
        datasetsH.push({
          label: '標準工数',
          data: months.map((_, mi) => calcStdForDiv(site, wt, mi)),
          backgroundColor: '#38bdf844',
          borderColor: '#38bdf8',
          borderWidth: 1,
          stack: 'std',
          hidden: !empChartDevShowStd,
          _isStd: true,
        });
      }
      const datasetsN = EMP_CHART_TYPES.map(et => ({
        label: et,
        data: months.map((_, mi) => groupEmps.filter(e => empDetailType(e.employment) === et && e.hours[mi] !== null).length || null),
        backgroundColor: EMP_CHART_COLORS_MAP[et],
      }));
      const lineMetric = DEV_LINE_METRIC_BY_ROLE[wt];
      const lineOpts = lineMetric ? {
        label: lineMetric,
        unit: 'kg',
        color: DEV_LINE_COLOR_BY_ROLE[wt],
        dataH: lineValsBySite[site][wt],
        dataN: lineValsBySite[site][wt],
        max: lineMaxByRole[wt],
      } : undefined;
      perGroup.push({ cid, datasetsH, datasetsN, lineOpts });
    });
  });

  // フィルター適用後のデータをもとに、ページ内の全グラフで時間・人数それぞれ共通の軸上限を算出
  // （折れ線は右軸=y2側のため、この左軸の集計には含めない）
  const hMax = computeSharedAxisMax(perGroup.map(p => stackedMonthlyTotals(months, p.datasetsH.filter(d => !d._isStd))), 100, 1.1);
  const nMax = computeSharedAxisMax(perGroup.map(p => stackedMonthlyTotals(months, p.datasetsN)), 5, 1.1);

  perGroup.forEach(({ cid, datasetsH, datasetsN, lineOpts }) => {
    buildStackedBarSection(cid, months, datasetsH, datasetsN, hMax, nMax, lineOpts);
  });

  // 標準工数トグル
  window._ecdevToggleStd = show => {
    empChartDevShowStd = show;
    Object.values(summaryChartInstances).forEach(chart => {
      if (!chart) return;
      chart.data.datasets.forEach((ds, i) => {
        if (ds._isStd) chart.setDatasetVisibility(i, show);
      });
      chart.update();
    });
  };
}

/* ── Summary: 標準労働時間タブ ────────────────────────────────────
   棒: 当年稼働実績（実質勤務時間合計）＋前年実績（拠点別モードの
   栽培／出荷区分のみ、「時間_過去実績」シートより）。前年実績系列は
   STD_HOURS_BAR_SERIESへの追加のみで拡張した（2-5節の想定構造どおり）。
   折れ線: 標準労働時間（整理済み_MシートI列。月ごとに、その月に実績
   [実質勤務時間]があるスタッフのみを対象に合計）。
   拠点別モードは上部グローバルトグル（拠点／業務区分／雇用形態区分）と
   連動し、拠点サマリモードは3拠点を色分けして積み上げ表示する
   （予実＞比較＞拠点サマリと同じ「いなべ最上部→南丹最下部」の積み上げ順
   ＋凡例は元の拠点順、というパターンを踏襲）。拠点サマリモードには
   前年実績を追加しない（対象は拠点別モードのみ） ─────────────────── */
let stdHoursSubtab = 'site'; // 'site'=拠点別 / 'summary'=拠点サマリ
// 'hours'=時間（実装済み） / 'count'=人数（ステップ①では枠組みのみ。データ集計・
// グラフ描画はステップ②で実装予定）
let stdHoursMetric = 'hours';

// 「時間_過去実績」シートの拠点ブロック内で、前年実績として使う行ラベルと
// 対応する業務区分（栽培/出荷のみ。配送・栽培／配送・出荷には対応データがない）
const PAST_YEAR_ROW_LABELS = { '収穫作業時間': '栽培', '出荷作業時間': '出荷' };

// 「YYYY年M月」表示ラベルをYYYYMM数値に戻す（前年実績の月対応付けに使用）
function monthLabelToYm(label) {
  const m = String(label).match(/^(\d{4})年(\d{1,2})月$/);
  return m ? parseInt(m[1]) * 100 + parseInt(m[2]) : null;
}

async function fetchPastYearSheet() {
  // 「時間_過去実績」は拠点ブロックが縦に繰り返される構造（拠点名行がそのまま
  // 年月ヘッダー行を兼ね、その下にデータ行×N→空白行、を3拠点分）で、gvizの
  // 見出し自動結合(headers>0)では正しく扱えないため、標準工数設定シートと同様に
  // headers=0で生データを取得し、parsePastYearSheet()側でブロック境界を手動判定する
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(PAST_YEAR_SHEET_NAME)}&headers=0`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.replace(/^[^{]+/, '').replace(/[^}]+$/, ''));
  return parsePastYearSheet(json);
}

// セル内の余分な空白（全角スペース含む）を除去してから比較・判定できるようにする
function normalizeCellLabel(s) {
  return String(s ?? '').replace(/[　\s]+/g, ' ').trim();
}

// 年月ヘッダーの先頭列（連番の起点）だけをYYYYMM数値に変換する。実シートでの主要
// フォーマットは「2024.01」のような単純な数値セル（整数部=年、小数部が月）だが、
// 年によって小数部の桁数表記が変わることがある（2024年:「2024.01」〜「2024.09」の
// ゼロ埋め2桁、2025年:「2025.1」〜「2025.7」のゼロ埋めなし1桁、等）。同じ小数部0.1が
// 「1月(1桁表記)」「10月(2桁表記)」のどちらにも解釈できてしまい1セル単位では原理的に
// 一意に決められないため、月の判定はここ（起点セル）でのみ行い、以降の列は
// resolvePastYearYmCols()で1列ごとに+1する連番方式で機械的に求める
function parsePastYearYmCellBest(c) {
  if (!c) return null;
  const v = c.v;
  if (typeof v === 'number' && !isNaN(v)) {
    const year = Math.floor(v);
    const frac = v - year;
    // 小数部を10倍した値がほぼ整数なら1桁表記（例:2025.1→1月）、そうでなければ
    // 2桁表記（例:2024.01→1月、2024.10→10月）とみなす簡易ヒューリスティック。
    // 0.1（1月/1桁 と 10月/2桁 の衝突）のように原理的に一意に決まらない値もあるが、
    // 起点セルは通常ゼロ埋め2桁表記の年初（例:2024.01）であるため実用上問題にならない
    const asTenths = frac * 10;
    const isTenths = Math.abs(asTenths - Math.round(asTenths)) < 1e-6;
    const month = Math.round(isTenths ? asTenths : frac * 100);
    if (month >= 1 && month <= 12) return year * 100 + month;
  }
  if (typeof v === 'string') {
    const dm = v.match(/^Date\((\d+),\s*(\d+)/);
    if (dm) return parseInt(dm[1]) * 100 + (parseInt(dm[2]) + 1); // gvizの月は0始まり
  }
  const text = normalizeCellLabel(c.f ?? (typeof v === 'string' ? v : ''));
  const m = text.match(/(\d{4})[.\/-](\d{1,2})(?!\d)/);
  return m ? parseInt(m[1]) * 100 + parseInt(m[2]) : null;
}

// ブロック内の年月ヘッダー列を連番方式で解決する。headerCellsは値が入っている
// （＝ヘッダーとして存在する）列を先頭から順に並べたもの。1列目のみ
// parsePastYearYmCellBest()で年月を特定し、2列目以降はセルの値を見ずに
// 1列進むごとに月を+1（12月の次は年+1で1月に戻る）で機械的に割り当てる
function resolvePastYearYmCols(headerCells) {
  if (!headerCells.length) return [];
  const first = parsePastYearYmCellBest(headerCells[0].cell);
  if (first === null) return [];

  let year = Math.floor(first / 100);
  let month = first % 100;
  return headerCells.map(({ idx }, i) => {
    if (i > 0) {
      month += 1;
      if (month > 12) { month = 1; year += 1; }
    }
    return { idx, ym: year * 100 + month };
  });
}

// 戻り値: { [site]: { [role]: { [ym]: 数値 } } }（role は '栽培' | '出荷'）
function parsePastYearSheet(json) {
  const rows = json.table.rows || [];
  const cellText = (row, cIdx) => {
    const c = row && row.c && row.c[cIdx];
    return normalizeCellLabel(c ? (c.v ?? c.f ?? '') : '');
  };
  const cellNumber = (row, cIdx) => {
    const c = row && row.c && row.c[cIdx];
    if (!c) return null;
    const raw = c.v !== undefined && c.v !== null ? c.v : c.f;
    if (raw === undefined || raw === null || raw === '') return null;
    const n = Number(raw);
    return isNaN(n) ? null : n;
  };

  const result = {};
  let currentSite = null;
  let currentYmCols = null; // [{ idx, ym }]

  rows.forEach(row => {
    const label = cellText(row, 0);

    if (SITES.includes(label)) {
      // 拠点名行そのものが年月ヘッダー行を兼ねる（A列=拠点名、B列以降=年月）。
      // 別行を年月ヘッダーとして待つのではなく、この行のB列以降を直接読み取る
      currentSite = label;
      const headerCells = [];
      (row?.c || []).forEach((c, cIdx) => {
        if (cIdx === 0) return; // A列は拠点名
        if (c && c.v !== null && c.v !== undefined && c.v !== '') headerCells.push({ idx: cIdx, cell: c });
      });
      currentYmCols = resolvePastYearYmCols(headerCells);
      return;
    }
    if (!currentSite || !currentYmCols) return; // 最初の拠点ブロックが始まる前の行は無視

    const role = PAST_YEAR_ROW_LABELS[Object.keys(PAST_YEAR_ROW_LABELS).find(k => label.includes(k))];
    if (!role) return; // 収穫作業時間／出荷作業時間以外の行（収穫量・シフト人数等）は対象外

    if (!result[currentSite]) result[currentSite] = {};
    const byYm = {};
    currentYmCols.forEach(({ idx, ym }) => { byYm[ym] = cellNumber(row, idx); });
    result[currentSite][role] = byYm;
  });

  return result;
}

// 当年稼働実績（実質勤務時間合計）＋前年実績。将来別の系列を追加する場合も
// { key, label, color, compute(emps, months, ctx) } の形で1件追加するだけでよい。
// 配列内の並び順は「拠点サマリモード」がSTD_HOURS_BAR_SERIES[0]（=current）を
// 直接参照しているため変更しないこと（表示順の入れ替えはrenderStdHoursSiteView側で行う）
const STD_HOURS_BAR_SERIES = [
  {
    key: 'current',
    label: '当年稼働実績',
    color: '#60a5fa',
    compute: (emps, months) => months.map((_, mi) => {
      const vals = emps.map(e => e.hours[mi]).filter(h => h !== null);
      return vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) * 10) / 10 : null;
    }),
  },
  {
    key: 'previous',
    label: '前年実績',
    color: '#94a3b8',
    // ctx: { site, workType }（拠点別モードでのみ渡される。拠点サマリモードは非対応のため未使用）。
    // pastYearDataのキーは'栽培'/'出荷'のみのため、配送・栽培／配送・出荷はbyYmがundefinedとなり
    // 自然に全月nullを返す（対応する前年データが存在しないため）
    compute: (emps, months, ctx) => {
      const byYm = ctx && pastYearData && pastYearData[ctx.site] && pastYearData[ctx.site][ctx.workType];
      return months.map(label => {
        if (!byYm) return null;
        const ym = monthLabelToYm(label);
        if (ym === null) return null;
        const v = byYm[ym - 100]; // ちょうど1年前の同月
        return (typeof v === 'number' && !isNaN(v)) ? Math.round(v * 10) / 10 : null;
      });
    },
  },
];

// 拠点サマリモード用：選択中拠点（拠点トグル連動）の前年実績時間を、栽培＋出荷の
// 合算のみで月ごとに合算する。配送・栽培／配送・出荷は「時間_過去実績」に対応データが
// 無いため対象外。上部グローバル業務区分トグルには連動させず、常に栽培＋出荷の
// 固定合算とする（雇用形態区分の内訳データも存在しないため連動不可）
function computePastYearHoursSummaryBar(months) {
  return months.map(label => {
    const ym = monthLabelToYm(label);
    if (ym === null) return null;
    const prevYm = ym - 100;
    let sum = 0, any = false;
    SITES.forEach(site => {
      if (!siteFilter.has(site)) return;
      const bySite = pastYearData && pastYearData[site];
      if (!bySite) return;
      ['栽培', '出荷'].forEach(role => {
        const byYm = bySite[role];
        const v = byYm ? byYm[prevYm] : undefined;
        if (typeof v === 'number' && !isNaN(v)) { sum += v; any = true; }
      });
    });
    return any ? Math.round(sum * 10) / 10 : null;
  });
}

// stdHoursMergeData（3拠点マージ、H列＝名前・R列＝標準労働時間）から、正規化した
// 氏名をキーとする標準労働時間のMapを作る。B列＝1（稼働フラグ）の行のみを対象とする
// （B=2の新規要員行は整理済み_M側にまだ実績が無く、computeStdHoursLine()の
// hours[mi] !== null判定で元々対象外のため含めない）。同名の行が複数あれば合算する
function threeSiteMergeStdHoursByName() {
  const map = new Map();
  if (!stdHoursMergeData) return map;
  stdHoursMergeData.rows.forEach(r => {
    if (r.activeFlag !== 1) return;
    const key = normalizeName(r.name);
    map.set(key, (map.get(key) || 0) + r.stdHours);
  });
  return map;
}

// 標準労働時間（月ごとに、その月に実績[実質勤務時間]があるスタッフのみを対象に合計）。
// parseDuration()は0以下の値を既にnullとして返しているため、hours[mi] !== nullの
// 判定だけで「実質勤務時間が0または未入力のスタッフを除外」の条件を満たせる。
// 合計する値は整理済み_MのI列（e.stdHours）ではなく、3拠点マージのR列を氏名突き合わせ
// で取得する（normalizeName()で表記ゆれ・括弧付き注記を吸収）。一致する行がない場合は
// 0扱いとする
function computeStdHoursLine(emps, months) {
  const stdHoursByName = threeSiteMergeStdHoursByName();
  return months.map((_, mi) => {
    // 工数振替の「応援」仮想従業員（computeTransferAdjustments()生成分）は元の従業員と
    // 同一人物のため、氏名突き合わせでは元の記録と同じ3拠点マージ行にマッチしてしまう。
    // 標準労働時間の概念自体が無い仮想レコードのため、二重集計を避けるために除外する
    const vals = emps
      .filter(e => e.hours[mi] !== null && !e.isTransferVirtual)
      .map(e => stdHoursByName.get(normalizeName(e.name)) ?? 0);
    return vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) * 10) / 10 : null;
  });
}

// computeStdHoursLine()を、整理済み_Mのemployees全体ではなくdiv（業務区分）・site
// （拠点。nullなら全拠点）で絞り込んだ従業員だけに適用したもの。予実＞比較（繁忙期
// 見込み）タブで、過去月（実績が既に確定している月）の「標準労働時間」棒に使う
// （3拠点マージのB=1・B=2集計は将来月の見込み値のため、過去月には使わない）。
// 整理済み_M側の業務区分は細分表記（配送・栽培／配送・出荷等）のため、3拠点マージ側の
// 正規化済みバケット（栽培/出荷/配送）とはworkTypeClass()を介して対応付ける
// （renderPlanCompareCharts2内の実績工数集計・window._planCmpChartData2と同じ判定方法。
// e.workType === divの直接比較では配送・栽培／配送・出荷が一致しない）。
// 引数monthsは呼び出し側（比較タブ）の計画月ラベル（"2025/12"形式）。整理済み_Mの
// 月インデックスとは一致しない可能性があるため、workHoursForPlanMonths()と同様に
// normalizeMonth()でカレンダー月を突き合わせてhours配列をmonths基準に並べ替えてから
// computeStdHoursLine()に渡す
function computeStdHoursLineForDivSite(div, site, months) {
  const { employees, months: activeMonths } = getActiveData();
  const typeFilter = div === '栽培'
    ? wt => workTypeClass(wt) === 'wt-栽培'
    : div === '配送'
      ? wt => workTypeClass(wt) === 'wt-配送'
      : wt => workTypeClass(wt) === 'wt-出荷';
  const emps = employees
    .filter(e => typeFilter(e.workType) && (site == null || e.base === site))
    .map(e => ({
      ...e,
      hours: months.map(planMonth => {
        const ami = activeMonths.findIndex(m => normalizeMonth(m) === planMonth);
        return ami >= 0 ? e.hours[ami] : null;
      }),
    }));
  return computeStdHoursLine(emps, months);
}

// 上部グローバル業務区分トグルによる絞り込み。ROLE_TYPESに含まれない業務区分
// （例:「拠点業務」）はトグルの対象外のため常に含める（名簿タブと同じ扱い）
function stdHoursRoleVisible(e) {
  return !ROLE_TYPES.includes(e.workType) || roleTypeFilter.has(e.workType);
}

/* ── 人数画面（ステップ②） ───────────────────────────────────────
   棒: 当年実績（整理済み_Mベース、countActiveEmployees()を流用し「業務区分別（表）」
   タブの計/人数と同一ロジック）＋前年実績（「人数_過去実績」シートより）。
   折れ線は不要（棒2本のみ）。拠点別モードは時間画面と同じ拠点×業務区分12
   セクション構成だが、前年実績は業務区分の内訳が無いため同一拠点内は常に
   同じ拠点合計値になる。拠点サマリモードは、時間画面と異なり前年棒も表示する
   （3拠点合算・雇用形態区分トグル連動の1本棒＋拠点別積み上げの当年棒） ──── */

// 「人数_過去実績」シートの行はA列=拠点名、B列=区分名（社員/パート/技能実習生/合計）。
// 群馬拠点はA列が「安中」という表記になっているため、シート上のラベルと実際の
// 拠点名の対応を明示的に定義する。B列の区分名はブロックによって拠点名が前に付く
// 場合（例:「いなべ社員」）と付かない場合（例:「社員」のみ）があり表記が統一
// されていないため、拠点の判定（A列）と区分の判定（B列）を独立に行う
const COUNT_ROW_SITE_ALIAS = { 'いなべ': 'いなべ', '安中': '群馬', '南丹': '南丹' };
const COUNT_ROW_SUFFIXES = ['社員', 'パート', '技能実習生', '合計'];

// row: A列(index0)=拠点名、B列(index1)=区分名（拠点名接頭辞の有無は問わない、
// endsWith()で末尾一致を見る）。A列が対象拠点（いなべ/安中/南丹）に一致しない行
// （本社・鹿沼・総計等）はnullを返し対象外とする
function matchCountRowLabel(row) {
  const siteLabel = normalizeCellLabel(row?.c?.[0] ? (row.c[0].v ?? row.c[0].f ?? '') : '');
  const site = COUNT_ROW_SITE_ALIAS[siteLabel];
  if (!site) return null;

  const classLabel = normalizeCellLabel(row?.c?.[1] ? (row.c[1].v ?? row.c[1].f ?? '') : '');
  const empClass = COUNT_ROW_SUFFIXES.find(suffix => classLabel.endsWith(suffix));
  if (!empClass) return null;

  return { site, empClass };
}

// 簡易なRFC4180準拠CSVパーサー（ダブルクォートで囲まれたフィールド内の
// カンマ・改行・エスケープされたダブルクォート""に対応）。「人数_過去実績」の
// CSV取得（tqx=out:csv）専用の軽量な自前実装で、外部ライブラリには依存しない
function parseCsv(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  let i = 0;
  const len = text.length;
  while (i < len) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += ch; i++; continue;
    }
    if (ch === '"') { inQuotes = true; i++; continue; }
    if (ch === ',') { row.push(field); field = ''; i++; continue; }
    if (ch === '\r') { i++; continue; } // CRLFのCRは無視し、直後のLFで改行確定する
    if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += ch; i++;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); } // 末尾に改行が無い最終行を回収
  return rows;
}

// 「人数_過去実績」シートは、以下2つの問題を回避するため /export?format=csv&gid=
// で取得する（PROD_GID・PLAN_GIDと同様、シート名ではなくgid指定）。
// 1. gvizのJSON出力（tqx=out:json）は列単位で型推論を行い、列内の大多数のセルの型
//    （このシートではC列以降がほぼ数値のため数値型と推論される）と異なる型のセル
//    （3行目の「10月度」等の文字列）を強制的にnull化してしまう
// 2. gviz/tqのsheet=名前指定エンドポイントは、シート編集後も古い内容を長時間
//    キャッシュし続ける（=反映が極端に遅れる）ことが実データで確認された。
//    同じ内容を/export?format=csvで取得すると最新の内容が正しく反映されていたため、
//    gid指定のexportエンドポイントに切り替えることでこの問題も回避する
// CSVの2次元配列をgvizのJSON形式相当（{c:[{v},...]}）に詰め替えることで、
// 既存のparsePastYearCountSheet()をそのまま再利用する。
// 「時間_過去実績」等、他のシート取得（gviz/tq、JSON形式）は変更しない
async function fetchPastYearCountSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${PAST_YEAR_COUNT_GID}`;
  const res = await fetch(url);
  let text = await res.text();
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // /exportはUTF-8 BOM付きで返ることがあるため除去
  const csvRows = parseCsv(text);
  const fakeJson = { table: { rows: csvRows.map(cells => ({ c: cells.map(v => ({ v })) })) } };
  return parsePastYearCountSheet(fakeJson);
}

// gvizは先頭列（A・B列）が両方とも空欄の行を、他の列にデータがあっても
// レスポンス（json.table.rows）から丸ごと省略することがある。年月ヘッダー行は
// 本来A・B列が空欄になり得るため、固定の行番号（2行目・3行目）や固定の
// データ開始列（B列）を前提にせず、内容（4桁の妥当な年の数値／
// 「N月度」パターンのテキスト）から年月行・データ開始列を動的に検出する

// CSV化されたセル値は常に文字列のため、桁区切りのカンマ（例:"1,234"）が
// 含まれる可能性を考慮し、数値変換の前にカンマを取り除く（CSVの区切り文字
// そのものと衝突するケースはダブルクォートで囲まれるためparseCsv()側で
// 正しく1フィールドとして扱われるが、念のため数値解釈側でも安全策を入れる）
function stripThousandsSeparator(raw) {
  return typeof raw === 'string' ? raw.replace(/,/g, '') : raw;
}
function isPlausibleYearValue(raw) {
  if (raw === null || raw === undefined || raw === '') return false;
  const n = Number(stripThousandsSeparator(raw));
  return Number.isInteger(n) && n >= 2000 && n <= 2100;
}
function isMonthDoText(raw) {
  return typeof raw === 'string' && /^\d{1,2}月度$/.test(raw.trim());
}

// 戻り値: { [site]: { [empClass]: { [ym]: 数値 } } }（empClassは'社員'|'パート'|'技能実習生'。
// 「合計」行は社員/パート/技能実習生の内訳から都度合算するため取り込まない）
function parsePastYearCountSheet(json) {
  const rows = json.table.rows || [];

  const cellRaw = (row, cIdx) => {
    const c = row && row.c && row.c[cIdx];
    return c ? (c.v ?? c.f ?? null) : null;
  };
  const cellNumber = (row, cIdx) => {
    const raw = cellRaw(row, cIdx);
    if (raw === undefined || raw === null || raw === '') return null;
    const n = Number(stripThousandsSeparator(raw));
    return isNaN(n) ? null : n;
  };

  // 年行・月行を内容ベースで検出する（行番号は決め打ちしない）
  let yearRowIdx = -1, monthRowIdx = -1;
  rows.forEach((row, rIdx) => {
    if (!row || !row.c) return;
    if (yearRowIdx === -1 && row.c.some(c => c && isPlausibleYearValue(c.v ?? c.f))) yearRowIdx = rIdx;
    if (monthRowIdx === -1 && row.c.some(c => c && isMonthDoText(String(c.v ?? c.f ?? '')))) monthRowIdx = rIdx;
  });
  if (yearRowIdx === -1 || monthRowIdx === -1) {
    console.warn('[人数_過去実績] 年行または月行を検出できませんでした。前年実績（人数画面）は表示されません。');
    return {};
  }
  const yearRow = rows[yearRowIdx];
  const monthRow = rows[monthRowIdx];

  // 年月ヘッダー列を特定する。データ開始列も固定せず、実際に年月の値が
  // 見つかった列を基準にする。年はセル結合等で最初の列にしか値が入って
  // いない可能性があるため、空欄の場合は直前の年を引き継ぐ
  const ymCols = [];
  let lastYear = null;
  const colCount = Math.max(yearRow?.c?.length || 0, monthRow?.c?.length || 0);
  for (let cIdx = 0; cIdx < colCount; cIdx++) {
    const yRaw = cellRaw(yearRow, cIdx);
    if (isPlausibleYearValue(yRaw)) lastYear = Number(stripThousandsSeparator(yRaw));
    const mRaw = String(cellRaw(monthRow, cIdx) ?? '').trim();
    const mMatch = mRaw.match(/^(\d{1,2})月度$/);
    if (lastYear !== null && mMatch) {
      const month = parseInt(mMatch[1]);
      if (month >= 1 && month <= 12) ymCols.push({ idx: cIdx, ym: lastYear * 100 + month });
    }
  }

  const result = {};
  rows.forEach((row, rIdx) => {
    if (rIdx === yearRowIdx || rIdx === monthRowIdx) return; // 年月行はデータ行として扱わない
    const matched = matchCountRowLabel(row);
    if (!matched || matched.empClass === '合計') return;

    if (!result[matched.site]) result[matched.site] = {};
    const byYm = {};
    ymCols.forEach(({ idx, ym }) => { byYm[ym] = cellNumber(row, idx); });
    result[matched.site][matched.empClass] = byYm;
  });

  return result;
}

// 上部グローバル雇用区分トグルの生の値（例:「社員」「パート」「アルバイト」「技能実習生」等、
// 実際の表記は本番シート依存）を、「人数_過去実績」シートの3行区分（社員/パート/技能実習生）に
// 振り分ける。classifyEmp()と同じ考え方で、「社員」「技能実習生」に一致する区分は
// それぞれの行に、それ以外（表記に関わらず）はすべて「パート」行として扱う
function classifyCountEmpRow(employment) {
  if (!employment) return 'パート';
  if (employment.includes('社員')) return '社員';
  if (employment.includes('技能実習')) return '技能実習生';
  return 'パート';
}

// 現在チェックされている雇用区分（empTypeFilter）から、対応する
// 人数_過去実績シートの行区分の集合を求める（未初期化時は全区分を対象とする）
function activeCountBuckets() {
  const all = ['社員', 'パート', '技能実習生'];
  if (!empTypeFilter) return new Set(all);
  const buckets = new Set();
  empTypeFilter.forEach(raw => buckets.add(classifyCountEmpRow(raw)));
  return buckets;
}

// 指定拠点の前年実績人数を、指定した雇用区分バケットの集合で月ごとに合算する共通処理。
// 業務区分の内訳は存在しないため、常に拠点合計値になる
function computePastYearCountBarWithBuckets(site, months, buckets) {
  const bySite = pastYearCountData && pastYearCountData[site];
  return months.map(label => {
    if (!bySite) return null;
    const ym = monthLabelToYm(label);
    if (ym === null) return null;
    const prevYm = ym - 100;
    let sum = 0, any = false;
    buckets.forEach(b => {
      const byYm = bySite[b];
      const v = byYm ? byYm[prevYm] : undefined;
      if (typeof v === 'number' && !isNaN(v)) { sum += v; any = true; }
    });
    return any ? sum : null;
  });
}

// 指定拠点の前年実績人数（雇用区分トグル連動）を月ごとに合算する
function computePastYearCountBar(site, months) {
  return computePastYearCountBarWithBuckets(site, months, activeCountBuckets());
}

// 拠点サマリモード用：選択中拠点（拠点トグル連動）の前年実績人数（雇用区分トグル連動）
function computePastYearCountSummaryBar(months) {
  const buckets = activeCountBuckets();
  return months.map(label => {
    const ym = monthLabelToYm(label);
    if (ym === null) return null;
    const prevYm = ym - 100;
    let sum = 0, any = false;
    SITES.forEach(site => {
      if (!siteFilter.has(site)) return;
      const bySite = pastYearCountData && pastYearCountData[site];
      if (!bySite) return;
      buckets.forEach(b => {
        const byYm = bySite[b];
        const v = byYm ? byYm[prevYm] : undefined;
        if (typeof v === 'number' && !isNaN(v)) { sum += v; any = true; }
      });
    });
    return any ? sum : null;
  });
}

// 当年実績（人数）＋前年実績（人数）。当年は「業務区分別（表）」タブの計/人数と同じ
// countActiveEmployees()をそのまま流用する
const STD_COUNT_BAR_SERIES = [
  {
    key: 'current',
    label: '当年実績',
    color: '#60a5fa',
    compute: (emps, months) => months.map((_, mi) => countActiveEmployees(emps, mi) || null),
  },
  {
    key: 'previous',
    label: '前年実績',
    color: '#94a3b8',
    // ctx: { site, workType }（拠点別モードでのみ渡される。workTypeは前年実績の
    // 値そのものには使わない＝同一拠点内の全業務区分セクションで同じ値になる）
    compute: (emps, months, ctx) => (ctx ? computePastYearCountBar(ctx.site, months) : months.map(() => null)),
  },
];

// 棒2本（前年実績・当年実績）のみを描画する共通ヘルパー（時間画面のbuildStdHoursChart()
// と異なり折れ線は持たない）。legendOrder（省略可）は拠点サマリモードで拠点名の
// 凡例表示順を固定するために使う
function buildStdCountChart(canvasId, months, barDatasets, yMax, opts) {
  const legendOrder = opts && opts.legendOrder;
  const ctx = document.getElementById(canvasId)?.getContext('2d');
  if (!ctx) return;
  summaryChartInstances[canvasId] = new Chart(ctx, {
    data: { labels: months, datasets: barDatasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: {
            color: '#8892a4', font: { size: 11 }, boxWidth: 12, padding: 8,
            generateLabels: legendOrder ? chart => {
              const items = Chart.defaults.plugins.legend.labels.generateLabels(chart);
              const siteItems = items.filter(item => legendOrder.includes(item.text));
              const otherItems = items.filter(item => !legendOrder.includes(item.text));
              siteItems.sort((a, b) => legendOrder.indexOf(a.text) - legendOrder.indexOf(b.text));
              return [...siteItems, ...otherItems];
            } : undefined,
          },
        },
        tooltip: {
          backgroundColor: '#1e2235', borderColor: '#3a3f5c', borderWidth: 1,
          titleColor: '#e2e8f0', bodyColor: '#a0aec0', footerColor: '#e2e8f0',
          callbacks: {
            label: ctx => (ctx.parsed.y == null ? null : `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('ja-JP')} 名`),
            footer: items => {
              const total = items
                .filter(i => !i.dataset.excludeFromFooterTotal && i.parsed.y != null)
                .reduce((s, i) => s + i.parsed.y, 0);
              if (!total) return '';
              return `実績合計: ${total.toLocaleString('ja-JP')} 名`;
            },
          },
        },
      },
      scales: {
        x: { stacked: true, ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e2235' } },
        y: {
          stacked: true, position: 'left',
          ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} 名`, stepSize: 1 },
          grid: { color: '#1e2235' }, suggestedMin: 0, max: yMax,
          title: { display: true, text: '人数 (名)', color: '#8892a4', font: { size: 10 } },
        },
      },
    },
  });
}

// 拠点別：拠点ごとに1セクション（3セクション＝いなべ／群馬／南丹）。前年実績には
// 業務区分の内訳が無いため、時間画面と同じ拠点×業務区分12セクション構成にはせず、
// 1セクション内で「前年実績（拠点合計・単色1本）」と「当年実績（業務区分別に色分け
// した積み上げ棒）」の2本組グループ棒グラフとして表示する。上部グローバル業務区分
// トグルは、これまでのようなセクションの表示/非表示ではなく、当年実績棒の積み上げ
// セグメントの絞り込みとして働く（OFFにした業務区分のセグメントが積み上げから
// 除かれ、合計人数もその分減る）
function renderStdCountSiteView() {
  const { months, employees } = getExtendedActiveData();
  const content = document.getElementById('stdhours-content');
  const allSites = SITES.filter(s => employees.some(e => e.base === s));
  const activeSites = allSites.filter(s => siteFilter.has(s));

  if (!activeSites.length) {
    content.innerHTML = '<div class="loading">表示できるデータがありません（拠点トグルの選択状況をご確認ください）</div>';
    return;
  }

  let html = '<div class="schart-shell">';
  activeSites.forEach((site, si) => {
    const cid = `stdc_site_${si}`;
    html += `
      <div class="schart-section">
        <div class="schart-header" style="color:${SITE_COLORS[site]}">${site}</div>
        ${chartWrapHtml(cid, months.length, { heightPx: 320, inlineHeight: true, forceResponsive: true })}
      </div>`;
  });
  html += '</div>';
  content.innerHTML = html;

  const previousSeries = STD_COUNT_BAR_SERIES.find(s => s.key === 'previous');
  const visibleRoleTypes = ROLE_TYPES.filter(wt => roleTypeFilter.has(wt));

  // Y軸MAXは、拠点・業務区分・雇用形態区分いずれのトグル操作にも左右されないよう
  // 「全トグルON」を基準に算出する（PR #161のY軸MAX変動バグの教訓を踏まえた対応）。
  // さらに、3拠点セクション間でも見た目上の高さを比較しやすいよう、拠点ごとに
  // 個別算出（PR #175）ではなく3拠点の中の最大値を共通のMAXとして全セクションに
  // 適用する。拠点トグルでいずれかの拠点をOFFにしても、常にallSites（拠点トグルの
  // 選択状態を無視した全拠点）を基準に算出するため、残るセクションのMAXは変動しない。
  // 業務区分トグルはemployees自体を絞り込まないためROLE_TYPESをそのまま使えばよいが、
  // 雇用形態区分トグルはgetExtendedActiveData()の時点でemployeesに反映済みのため、
  // 軸算出専用に無視した（全員含む）データを別途取得する
  const { employees: allEmpTypeEmployees } = getExtendedActiveDataAllEmpTypes();
  const ALL_EMP_BUCKETS = new Set(['社員', 'パート', '技能実習生']);

  const siteStacksForMax = allSites.map(site => {
    const siteEmpsAll = allEmpTypeEmployees.filter(e => e.base === site);
    const currentTotalAll = months.map((_, mi) =>
      ROLE_TYPES.reduce((s, wt) => s + (countActiveEmployees(siteEmpsAll.filter(e => e.workType === wt), mi) || 0), 0));
    const previousTotalAll = computePastYearCountBarWithBuckets(site, months, ALL_EMP_BUCKETS);
    return [currentTotalAll, previousTotalAll];
  });
  const sharedSiteMax = computeSharedAxisMax(siteStacksForMax.flat(), 5, 1.1);

  activeSites.forEach((site, si) => {
    const cid = `stdc_site_${si}`;
    const siteEmps = employees.filter(e => e.base === site);

    const previousDataset = {
      type: 'bar', label: previousSeries.label,
      data: previousSeries.compute(siteEmps, months, { site }),
      backgroundColor: previousSeries.color + 'cc', borderColor: previousSeries.color, borderWidth: 0,
      stack: 'previous', excludeFromFooterTotal: true,
    };
    const currentDatasets = ROLE_TYPES.map(wt => {
      const wtEmps = siteEmps.filter(e => e.workType === wt);
      const color = ROLE_TYPE_COLORS[wt];
      return {
        type: 'bar', label: wt,
        data: months.map((_, mi) => (visibleRoleTypes.includes(wt) ? (countActiveEmployees(wtEmps, mi) || null) : null)),
        backgroundColor: color + 'cc', borderColor: color, borderWidth: 0,
        stack: 'current',
      };
    });

    buildStdCountChart(cid, months, [previousDataset, ...currentDatasets], sharedSiteMax);
  });
}

// 拠点サマリ：前年棒（拠点トグル・雇用形態区分トグル連動の1本棒）＋拠点別に色分けした
// 当年積み上げ棒（拠点トグル連動）を表示する
function renderStdCountSummaryView() {
  const { months, employees } = getExtendedActiveData();
  const content = document.getElementById('stdhours-content');
  // 前年棒・当年棒とも拠点トグルに連動させる（PR #193の時間画面拠点サマリと同じ考え方）
  const activeSites = SITES.filter(s => employees.some(e => e.base === s) && siteFilter.has(s));
  const cid = 'stdc_summary';

  content.innerHTML = `<div class="schart-shell">
    <div class="schart-section">
      <div class="schart-header">3拠点サマリ</div>
      ${chartWrapHtml(cid, months.length, { heightPx: 360, inlineHeight: true, forceResponsive: true })}
    </div>
  </div>`;

  const currentSeries = STD_COUNT_BAR_SERIES.find(s => s.key === 'current');
  const siteBarDatasets = [];
  [...activeSites].reverse().forEach(site => {
    const emps = employees.filter(e => e.base === site && e.workType && stdHoursRoleVisible(e));
    const data = currentSeries.compute(emps, months);
    siteBarDatasets.push({
      type: 'bar', label: site, data,
      backgroundColor: (SITE_COLORS[site] || '#fff') + 'cc', borderColor: SITE_COLORS[site] || '#fff',
      borderWidth: 0, stack: 'current',
    });
  });

  const previousSeries = STD_COUNT_BAR_SERIES.find(s => s.key === 'previous');
  const previousData = computePastYearCountSummaryBar(months);
  const previousDataset = {
    type: 'bar', label: previousSeries.label, data: previousData,
    backgroundColor: previousSeries.color + 'cc', borderColor: previousSeries.color, borderWidth: 0,
    stack: 'previous', excludeFromFooterTotal: true,
  };

  const barDatasets = [previousDataset, ...siteBarDatasets];
  const currentStackTotals = stackedMonthlyTotals(months, siteBarDatasets);
  const sharedMax = computeSharedAxisMax([currentStackTotals, previousData], 5, 1.1);

  buildStdCountChart(cid, months, barDatasets, sharedMax, { legendOrder: activeSites });
}

function renderStdHoursContent() {
  destroySummaryCharts();
  if (stdHoursMetric === 'count') {
    if (stdHoursSubtab === 'summary') renderStdCountSummaryView();
    else renderStdCountSiteView();
    return;
  }
  if (stdHoursSubtab === 'summary') renderStdHoursSummaryView();
  else renderStdHoursSiteView();
}

// 拠点別：「業務区分別／雇用形態別（グラフ）」タブと同じ粒度で、拠点×業務区分
// （3拠点×4業務区分＝最大12組）ごとにセクションを分けて表示する。上部グローバル
// トグルのうち、拠点・業務区分トグルはセクションの表示/非表示に反映し、雇用形態
// 区分トグルはgetExtendedActiveData()経由で各セクションの集計値自体に反映される
function renderStdHoursSiteView() {
  const { months, employees } = getExtendedActiveData();
  const content = document.getElementById('stdhours-content');
  const allSites = SITES.filter(s => employees.some(e => e.base === s));
  const activeSites = allSites.filter(s => siteFilter.has(s));
  const visibleRoleTypes = ROLE_TYPES.filter(wt => roleTypeFilter.has(wt));

  if (!activeSites.length || !visibleRoleTypes.length) {
    content.innerHTML = '<div class="loading">表示できるデータがありません（拠点・業務区分トグルの選択状況をご確認ください）</div>';
    return;
  }

  let html = '<div class="schart-shell">';
  activeSites.forEach((site, si) => {
    visibleRoleTypes.forEach((wt, wi) => {
      const cid = `stdh_site_${si}_${wi}`;
      html += `
        <div class="schart-section">
          <div class="schart-header" style="color:${SITE_COLORS[site]}">${site}　${wt}</div>
          ${chartWrapHtml(cid, months.length, { heightPx: 320, inlineHeight: true, forceResponsive: true })}
        </div>`;
    });
  });
  html += '</div>';
  content.innerHTML = html;

  // 業務区分（セクション）ごとに、拠点トグルの選択状態に関わらず全拠点(allSites)を
  // 基準にY軸MAXを算出する。拠点トグルをON/OFFしてもセクションの表示/非表示が
  // 変わるだけで、残っているセクションのデータ自体は変化しないため、軸スケールも
  // 変動させない（=全拠点ON相当のMAXに固定する）
  // 前年実績棒を当年稼働実績棒より左（先）に表示するための並び順。STD_HOURS_BAR_SERIES
  // 自体の並び順（拠点サマリモードがSTD_HOURS_BAR_SERIES[0]を直接参照しているため
  // 変更できない）とは独立に、ここで表示用の順序を決める
  const SITE_VIEW_BAR_ORDER = ['previous', 'current'];

  const roleMax = {};
  const dataBySiteRole = {};
  visibleRoleTypes.forEach(wt => {
    const stacksForRole = [];
    allSites.forEach(site => {
      const emps = employees.filter(e => e.base === site && e.workType === wt);
      const barDatasets = SITE_VIEW_BAR_ORDER.map(key => {
        const s = STD_HOURS_BAR_SERIES.find(ss => ss.key === key);
        return {
          type: 'bar', label: s.label, data: s.compute(emps, months, { site, workType: wt }),
          backgroundColor: s.color + 'cc', borderColor: s.color, borderWidth: 0,
          // 前年実績・当年稼働実績は積み上げず横並び表示にするため、系列ごとに別のstackにする
          stack: s.key,
          // 前年実績はツールチップ footer の「実績合計」（当年分の合計）には含めない
          excludeFromFooterTotal: s.key !== 'current',
        };
      });
      const lineData = computeStdHoursLine(emps, months);
      stacksForRole.push(maxMonthlyAcross(months, barDatasets), lineData);
      dataBySiteRole[`${site}|${wt}`] = { barDatasets, lineData };
    });
    roleMax[wt] = computeSharedAxisMax(stacksForRole, 100, 1.1);
  });

  activeSites.forEach((site, si) => {
    visibleRoleTypes.forEach((wt, wi) => {
      const cid = `stdh_site_${si}_${wi}`;
      const { barDatasets, lineData } = dataBySiteRole[`${site}|${wt}`];
      buildStdHoursChart(cid, months, barDatasets, lineData, roleMax[wt]);
    });
  });
}

// 拠点サマリ：3拠点合算。拠点ごとに色分けした棒を積み上げ表示するのが目的のため、
// 上部グローバル拠点トグルでは絞り込まない（業務区分・雇用形態区分トグルは
// 各拠点内の従業員選定に引き続き適用する）
function renderStdHoursSummaryView() {
  const { months, employees } = getExtendedActiveData();
  const content = document.getElementById('stdhours-content');
  // 前年実績棒を追加するにあたり、当年実績の積み上げ棒・前年実績棒のいずれも
  // 拠点トグルに連動させる（拠点トグルでOFFにした拠点は両方の集計から除外する）
  const activeSites = SITES.filter(s => employees.some(e => e.base === s) && siteFilter.has(s));
  const cid = 'stdh_summary';

  content.innerHTML = `<div class="schart-shell">
    <div class="schart-section">
      <div class="schart-header">3拠点サマリ<span style="font-weight:400;font-size:0.75rem;color:var(--muted);margin-left:10px">※ 前年実績時間は栽培および出荷の合算時間で配送時間は含みません。</span></div>
      ${chartWrapHtml(cid, months.length, { heightPx: 360, inlineHeight: true, forceResponsive: true })}
    </div>
  </div>`;

  // 積み上げの視覚的な上下順序を「いなべ最上部→南丹最下部」にするため、
  // 予実＞比較＞拠点サマリと同様にデータセットの追加順を逆にする
  // （凡例の表示順は別途buildStdHoursChart側でactiveSitesの順に固定する）
  const siteBarDatasets = [];
  [...activeSites].reverse().forEach(site => {
    const emps = employees.filter(e => e.base === site && e.workType && stdHoursRoleVisible(e));
    const data = STD_HOURS_BAR_SERIES[0].compute(emps, months); // 現時点では「当年稼働実績」のみ
    siteBarDatasets.push({
      type: 'bar', label: site, data,
      backgroundColor: (SITE_COLORS[site] || '#fff') + 'cc', borderColor: SITE_COLORS[site] || '#fff',
      borderWidth: 0, stack: 'actual',
    });
  });

  const previousSeries = STD_HOURS_BAR_SERIES.find(s => s.key === 'previous');
  const previousData = computePastYearHoursSummaryBar(months);
  const previousDataset = {
    type: 'bar', label: previousSeries.label, data: previousData,
    backgroundColor: previousSeries.color + 'cc', borderColor: previousSeries.color, borderWidth: 0,
    stack: 'previous', excludeFromFooterTotal: true,
  };
  const barDatasets = [previousDataset, ...siteBarDatasets];

  const allEmps = employees.filter(e => e.workType && stdHoursRoleVisible(e));
  const lineData = computeStdHoursLine(allEmps, months);

  const sharedMax = computeSharedAxisMax([stackedMonthlyTotals(months, siteBarDatasets), lineData, previousData], 100, 1.1);

  buildStdHoursChart(cid, months, barDatasets, lineData, sharedMax, { legendOrder: activeSites });
}

// 棒（積み上げ）＋標準労働時間の折れ線を同一軸(h)で重ねて描画する共通ヘルパー。
// legendOrder（省略可）を渡すと、凡例の表示順だけをその順序に固定する
// （積み上げの視覚的な上下順序とは独立に制御できる）
function buildStdHoursChart(canvasId, months, barDatasets, lineData, yMax, opts) {
  const legendOrder = opts && opts.legendOrder;
  const lineDataset = {
    type: 'line', label: '標準労働時間', data: lineData,
    borderColor: '#facc15', backgroundColor: '#facc15',
    borderWidth: 2, pointRadius: 3, tension: 0.3, spanGaps: true,
    order: -1, // 積み上げ棒より手前に描画されるようにする
  };
  const ctx = document.getElementById(canvasId)?.getContext('2d');
  if (!ctx) return;
  summaryChartInstances[canvasId] = new Chart(ctx, {
    data: { labels: months, datasets: [...barDatasets, lineDataset] },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: {
            color: '#8892a4', font: { size: 11 }, boxWidth: 12, padding: 8,
            generateLabels: legendOrder ? chart => {
              const items = Chart.defaults.plugins.legend.labels.generateLabels(chart);
              const siteItems = items.filter(item => legendOrder.includes(item.text));
              const otherItems = items.filter(item => !legendOrder.includes(item.text));
              siteItems.sort((a, b) => legendOrder.indexOf(a.text) - legendOrder.indexOf(b.text));
              return [...siteItems, ...otherItems];
            } : undefined,
          },
        },
        tooltip: {
          backgroundColor: '#1e2235', borderColor: '#3a3f5c', borderWidth: 1,
          titleColor: '#e2e8f0', bodyColor: '#a0aec0', footerColor: '#e2e8f0',
          callbacks: {
            label: ctx => {
              if (ctx.parsed.y == null) return null;
              return `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('ja-JP')} h`;
            },
            footer: items => {
              const barTotal = items
                .filter(i => i.dataset.type !== 'line' && !i.dataset.excludeFromFooterTotal && i.parsed.y != null)
                .reduce((s, i) => s + i.parsed.y, 0);
              if (!barTotal) return '';
              return `実績合計: ${barTotal.toLocaleString('ja-JP')} h`;
            },
          },
        },
      },
      scales: {
        x: { stacked: true, ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e2235' } },
        y: {
          stacked: true, position: 'left',
          ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} h` },
          grid: { color: '#1e2235' }, suggestedMin: 0, max: yMax,
          title: { display: true, text: 'h', color: '#8892a4', font: { size: 10 } },
        },
      },
    },
  });
}

function renderSummaryByEmpType() {
  // 表示月数が少ないときの間延び対策：開始月から常にMONTH_COLUMN_TARGET本に揃える
  // （実データはそのまま、延長分は見出しのみ・空欄。シート最新月を超えた分は見出しも空欄）
  const { months, employees, originalCount } = getExtendedActiveData();
  const content = document.getElementById('summary-content');

  // 延長分（inRange:false）は表では完全な空欄にする（在範囲内の0/データなしは既存通り「—」のまま）
  function cellText(v, mi, isCount) {
    if (mi >= originalCount) return '';
    return isCount ? (v !== null ? v + ' 名' : '—') : fmtH(v);
  }

  function detailEmp(emp) {
    if (!emp) return 'パート';
    if (emp.includes('技能実習')) return '技能実習生';
    if (emp.includes('社員'))    return '社員';
    return 'パート';
  }

  const EMP_TYPES = ['社員', '技能実習生', 'パート'];
  const EMP_COLORS_MAP = { '社員': '#60a5fa', '技能実習生': '#c084fc', 'パート': '#fb923c' };
  const SITE_ROW_SPAN = EMP_TYPES.length * 2 + 2;

  let html = `<div class="summary-panel"><table class="summary-table">
    <thead><tr>
      <th class="col-site">拠点</th>
      <th class="col-work">雇用形態</th>
      <th class="col-emp">区分</th>
      ${months.map(m => `<th>${m}</th>`).join('')}
    </tr></thead><tbody>`;

  SITES.forEach(site => {
    const siteEmps = employees.filter(e => e.base === site && e.workType);
    if (!siteEmps.length) return;

    let firstRow = true;

    EMP_TYPES.forEach((et, etIdx) => {
      const etEmps = siteEmps.filter(e => detailEmp(e.employment) === et);
      const color = EMP_COLORS_MAP[et];
      const isSep = etIdx > 0;

      const hourVals = months.map((_, mi) => {
        const vals = etEmps.map(e => e.hours[mi]).filter(h => h !== null);
        return vals.length ? vals.reduce((a, b) => a + b, 0) : null;
      });
      html += `<tr${isSep ? ' class="section-sep"' : ''}>`;
      if (firstRow) {
        html += `<td class="col-site" rowspan="${SITE_ROW_SPAN}" style="color:${SITE_COLORS[site]||'#fff'}">${site}</td>`;
        firstRow = false;
      }
      html += `<td class="col-work" rowspan="2" style="color:${color}">${et}</td>`;
      html += `<td class="col-emp">時間</td>`;
      hourVals.forEach((v, mi) => { html += `<td class="num">${cellText(v, mi, false)}</td>`; });
      html += '</tr>';

      const countVals = months.map((_, mi) => {
        const n = etEmps.filter(e => e.hours[mi] !== null).length;
        return n || null;
      });
      html += '<tr>';
      html += `<td class="col-emp">人数</td>`;
      countVals.forEach((v, mi) => { html += `<td class="num">${cellText(v, mi, true)}</td>`; });
      html += '</tr>';
    });

    const totalHours = months.map((_, mi) => {
      const vals = siteEmps.map(e => e.hours[mi]).filter(h => h !== null);
      return vals.length ? vals.reduce((a, b) => a + b, 0) : null;
    });
    html += '<tr class="site-total-last"><td class="col-emp" colspan="2" style="font-weight:800">合計／時間</td>';
    totalHours.forEach((v, mi) => { html += `<td class="num">${cellText(v, mi, false)}</td>`; });
    html += '</tr>';

    const totalCount = months.map((_, mi) => siteEmps.filter(e => e.hours[mi] !== null).length || null);
    html += '<tr class="site-total-last"><td class="col-emp" colspan="2" style="font-weight:800">合計／人数</td>';
    totalCount.forEach((v, mi) => { html += `<td class="num">${cellText(v, mi, true)}</td>`; });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  content.innerHTML = html;
}

/* ── Summary: 名簿タブ ─────────────────────────────────────────── */
let rosterSortCol = 'site';
let rosterSortAsc = true;

function renderSummaryRoster() {
  // 表示月数が少ないときの間延び対策：開始月から常にMONTH_COLUMN_TARGET本に揃える
  // （実データはそのまま、延長分は見出しのみ・空欄。シート最新月を超えた分は見出しも空欄）
  const { months, employees, originalCount, nameLabel } = getExtendedActiveData();
  const content = document.getElementById('summary-content');

  const SITE_ORDER = { 'いなべ': 0, '群馬': 1, '南丹': 2 };
  const orderedWorkTypes = getOrderedWorkTypes(employees);

  function filteredEmployees() {
    return employees.filter(e =>
      e.workType &&
      // 上部グローバル拠点トグル（名簿タブにのみ適用）
      siteFilter.has(e.base) &&
      // 上部グローバル業務区分トグル（名簿タブにのみ適用）。ROLE_TYPESに
      // 含まれない業務区分（例:「拠点業務」）はトグルの対象外のため、常に表示する
      (!ROLE_TYPES.includes(e.workType) || roleTypeFilter.has(e.workType))
    );
  }

  function rosterSorted(col) {
    const copy = [...filteredEmployees()];
    copy.sort((a, b) => {
      let va, vb;
      if (col === 'site') {
        va = (SITE_ORDER[a.base] ?? 99) * 1000 + orderedWorkTypes.indexOf(a.workType) * 10;
        vb = (SITE_ORDER[b.base] ?? 99) * 1000 + orderedWorkTypes.indexOf(b.workType) * 10;
      } else if (col === 'work') { va = a.workType; vb = b.workType; }
      else if (col === 'emp')    { va = a.employment; vb = b.employment; }
      else if (col === 'name')   { va = a.name; vb = b.name; }
      if (typeof va === 'string') return rosterSortAsc ? va.localeCompare(vb,'ja') : vb.localeCompare(va,'ja');
      return rosterSortAsc ? va - vb : vb - va;
    });
    return copy;
  }

  function buildContent() {
    const sorted = rosterSorted(rosterSortCol);

    const tableCols = [
      { key: 'site', label: '拠点' },
      { key: 'work', label: '業務区分' },
      { key: 'emp',  label: '雇用区分' },
      { key: 'name', label: nameLabel || '氏名' },
    ];

    let tableHtml = `<div class="roster-panel"><table class="roster-table"><thead><tr>`;
    tableCols.forEach(c => {
      const cls = c.key === 'site' ? ' col-site' : '';
      const sortCls = rosterSortCol === c.key ? (rosterSortAsc ? ' sort-asc' : ' sort-desc') : '';
      tableHtml += `<th class="${cls}${sortCls}" onclick="rosterSort('${c.key}')">${c.label}</th>`;
    });
    months.forEach(m => { tableHtml += `<th>${m}</th>`; });
    tableHtml += '</tr></thead><tbody>';

    if (sorted.length === 0) {
      tableHtml += `<tr><td colspan="${tableCols.length + months.length}" style="text-align:center;color:var(--muted);padding:24px">該当する従業員がいません</td></tr>`;
    } else {
      sorted.forEach(e => {
        tableHtml += `<tr>
          <td class="col-site" style="color:${SITE_COLORS[e.base]||'#fff'}">${e.base}</td>
          <td>${e.workType || '—'}</td>
          <td>${e.employment || '—'}</td>
          <td>${e.name}</td>`;
        months.forEach((_, mi) => {
          // 延長分（表示月数の範囲外）は空欄、範囲内はデータなしを「—」で表示
          if (mi >= originalCount) { tableHtml += '<td class="num"></td>'; return; }
          const h = e.hours[mi];
          tableHtml += `<td class="num">${h !== null ? h.toFixed(1) + ' h' : '—'}</td>`;
        });
        tableHtml += '</tr>';
      });
    }
    tableHtml += `</tbody></table></div>`;

    return tableHtml;
  }

  content.innerHTML = buildContent();

  window.rosterSort = function(col) {
    if (rosterSortCol === col) rosterSortAsc = !rosterSortAsc;
    else { rosterSortCol = col; rosterSortAsc = true; }
    content.innerHTML = buildContent();
  };
}

/* ── 3拠点マージ（予実＞比較（繁忙期見込み）タブ専用、未来月の標準/最大労働時間
   補完用） ─────────────────────────────────────────────────────────────────
   R1セルの文字列「標準労働時間」で列を検出し、S列以降は1行目に年月（例:"2026/12"）
   がある列だけを対象とする（PROD_GID/PLAN_GIDのparseProductionData()と同じく、
   headers=1でR1/S1等の見出し文字列をcols[].labelとして取得することで、型推論による
   null化を避ける）。D列＝拠点名・F列＝業務区分・H列＝名前・I列＝開始月（B=2新規要員の
   み使用）は列位置固定。2・3行目（見出し行）は無視し、4行目以降を実データとして扱う ─ */
function colLetterToIndex(letter) {
  return letter.toUpperCase().charCodeAt(0) - 'A'.charCodeAt(0);
}
const THREE_SITE_MERGE_ACTIVE_FLAG_COL = colLetterToIndex('B');
const THREE_SITE_MERGE_EMP_COL = colLetterToIndex('C');
const THREE_SITE_MERGE_SITE_COL = colLetterToIndex('D');
const THREE_SITE_MERGE_PRJ_COL = colLetterToIndex('E');
const THREE_SITE_MERGE_DIV_COL = colLetterToIndex('F');
const THREE_SITE_MERGE_NAME_COL = colLetterToIndex('H');
const THREE_SITE_MERGE_START_MONTH_COL = colLetterToIndex('I');
// 「比較（3拠点）＞標準労働時間」タブのアルバイト内訳（フルタイム／パートタイム）用
const THREE_SITE_MERGE_FULLTIME_COL = colLetterToIndex('M');
const THREE_SITE_MERGE_PARTTIME_COL = colLetterToIndex('Q');
// 群馬拠点が「安中」表記になる既知の表記ゆれ（人数_過去実績のCOUNT_ROW_SITE_ALIASと
// 同様の対応）。該当しない場合はそのままの拠点名として扱われるだけで実害はない
const THREE_SITE_MERGE_SITE_ALIAS = { 'いなべ': 'いなべ', '安中': '群馬', '群馬': '群馬', '南丹': '南丹' };

async function fetchThreeSiteMergeSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${THREE_SITE_MERGE_GID}&headers=1`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.replace(/^[^{]+/, '').replace(/[^}]+$/, ''));
  return parseThreeSiteMergeSheet(json);
}

// 戻り値: { rows: [{site, div, name, stdHours, startYm, maxByYm:{ym:数値}}], monthYms: [数値...] }
// 「標準労働時間」列が見つからない場合はnullを返す（呼び出し側は未来月補完を
// 表示しないだけで、他の集計・表示には影響させない設計）
function parseThreeSiteMergeSheet(json) {
  const cols = json.table.cols || [];
  const rows = json.table.rows || [];

  const stdColIdx = cols.findIndex(c => (c?.label || '').trim() === '標準労働時間');
  if (stdColIdx === -1) {
    console.warn('[3拠点マージ] 「標準労働時間」列(R1)が見つかりませんでした。比較（繁忙期見込み）タブの未来月補完は表示されません。');
    return null;
  }

  const monthCols = [];
  cols.forEach((c, idx) => {
    const label = (c?.label || '').trim();
    if (/^\d{4}\/\d{1,2}$/.test(label)) {
      const [y, m] = label.split('/').map(Number);
      monthCols.push({ idx, ym: y * 100 + m });
    }
  });

  const cellRaw = (row, idx) => { const c = row && row.c && row.c[idx]; return c ? (c.v ?? c.f ?? null) : null; };
  const cellText = (row, idx) => { const raw = cellRaw(row, idx); return raw === null || raw === undefined ? '' : String(raw).trim(); };
  const cellNumber = (row, idx) => {
    const raw = cellRaw(row, idx);
    if (raw === null || raw === undefined || raw === '') return null;
    const n = Number(raw);
    return isNaN(n) ? null : n;
  };

  // headers=1適用によりjson.table.rows[0]は元シートの2行目に相当するため、
  // 2行分（2・3行目の見出し行）をスキップする
  const dataRows = rows.slice(2);

  // R列（標準労働時間）が空の行を診断用に記録する。以前はR列が空の行はここで
  // 除外されていたが（if (stdHours === null) return;）、R列は空でもよく0として
  // 扱う仕様に変更したため、今後は新たに集計対象へ含まれるようになる。本番シートで
  // 実際にB=1（稼働フラグ）の行がこれに該当するかはこの実行環境からは確認できない
  // （docs.google.comへのネットワークアクセスがブロックされているため）ので、
  // 実データを読み込む本番のブラウザコンソールで確認できるよう警告を出力する
  const emptyStdHoursRows = [];

  const parsedRows = [];
  dataRows.forEach(row => {
    const siteLabel = cellText(row, THREE_SITE_MERGE_SITE_COL);
    const site = THREE_SITE_MERGE_SITE_ALIAS[siteLabel];
    if (!site) return;
    const divRaw = cellText(row, THREE_SITE_MERGE_DIV_COL);
    const name = cellText(row, THREE_SITE_MERGE_NAME_COL);
    // 配送・栽培／配送・出荷は「配送」として正規化
    const div = (divRaw === '配送・栽培' || divRaw === '配送・出荷') ? '配送' : divRaw;
    if (div !== '栽培' && div !== '出荷' && div !== '配送') return;
    if (!name) return;
    const activeFlag = cellNumber(row, THREE_SITE_MERGE_ACTIVE_FLAG_COL);
    if (activeFlag !== 1 && activeFlag !== 2) return; // B列が1・2以外は集計対象外
    const employment = cellText(row, THREE_SITE_MERGE_EMP_COL); // C列（雇用区分）
    const stdHoursRaw = cellNumber(row, stdColIdx);
    const stdHours = stdHoursRaw ?? 0; // R列が空の行も0として成立させる
    // stdHoursOriginallyEmpty：R列が元々空だったかどうかのフラグ。比較（繁忙期見込み）
    // タブのB=2新規要員機能（threeSiteMergeAgg）と、26/12計画タブのstdHoursFromMerge/
    // overtimeH/overtimeNの両方から参照されている。変更する際は両方への影響を確認すること
    const stdHoursOriginallyEmpty = stdHoursRaw === null;
    if (stdHoursOriginallyEmpty) emptyStdHoursRows.push({ site, div, name, activeFlag });
    const prj = cellText(row, THREE_SITE_MERGE_PRJ_COL);
    // startYm：I列（開始月、B=2新規要員候補が対象。gvizの日付セルからYYYYMM数値を
    // 取り出す）。I列が空の行はnull（threeSiteMergeAgg()側で「常に対象」として扱う）
    const startYm = parseGvizDateYm(row.c && row.c[THREE_SITE_MERGE_START_MONTH_COL]);
    const maxByYm = {};
    monthCols.forEach(({ idx, ym }) => {
      const v = cellNumber(row, idx);
      if (v !== null) maxByYm[ym] = v;
    });
    // fulltimeHours/parttimeHours：M列/Q列（アルバイトのフルタイム/パートタイム内訳、
    // 「比較（3拠点）＞標準労働時間」タブ専用）。他の既存フィールドとは異なり
    // 0デフォルト化はせず、cellNumber()の生の戻り値（数値またはnull）のまま保持する
    const fulltimeHours = cellNumber(row, THREE_SITE_MERGE_FULLTIME_COL);
    const parttimeHours = cellNumber(row, THREE_SITE_MERGE_PARTTIME_COL);
    parsedRows.push({ site, div, name, stdHours, stdHoursOriginallyEmpty, startYm, maxByYm, activeFlag, prj, employment, fulltimeHours, parttimeHours });
  });

  if (emptyStdHoursRows.length) {
    console.warn(
      `[3拠点マージ] R列（標準労働時間）が空の行が${emptyStdHoursRows.length}件あります。` +
      'これらは0として集計対象に含まれます（B列＝1の行が含まれる場合、以前は集計から' +
      '除外されていたため、標準労働時間・最大労働時間の集計値に影響する可能性があります）:',
      emptyStdHoursRows
    );
  }

  return { rows: parsedRows, monthYms: monthCols.map(m => m.ym) };
}

function parseProductionData(json) {
  const cols = json.table.cols;
  const rows = json.table.rows;

  // Detect month columns: index 3+ that have date-like labels (e.g. "2025/10")
  const monthCols = [];
  for (let i = 3; i < cols.length; i++) {
    const label = (cols[i]?.label || '').trim();
    if (/^\d{4}\/\d{1,2}$/.test(label)) monthCols.push({ idx: i, label });
  }

  const records = [];
  let currentSite = '';
  let currentCat = '';

  rows.forEach(row => {
    if (!row || !row.c) return;
    const cells = row.c;
    const raw = v => {
      const c = cells[v];
      return c ? (c.f || c.v || '') : '';
    };
    const siteVal = String(raw(0)).trim();
    const catVal  = String(raw(1)).trim();
    const metric  = String(raw(2)).trim();

    if (siteVal) currentSite = siteVal;
    if (catVal)  currentCat  = catVal;
    if (!metric || metric === 'null') return;

    const values = monthCols.map(m => {
      const c = cells[m.idx];
      if (!c || c.v === null || c.v === undefined || c.v === '') return null;
      if (typeof c.v === 'number') return c.v;
      const parsed = parseFloat(String(c.v).replace(/,/g, ''));
      return isNaN(parsed) ? null : parsed;
    });

    records.push({ site: currentSite, cat: currentCat, metric, values });
  });

  return { months: monthCols.map(m => m.label), records };
}

// 出荷関連（パック数・袋数・バラ数・合計(点数)）の4指標。実シート上はこの4指標が
// 複数の生カテゴリ文言（例:「出荷内訳」→パック数のみ、次いで別文言→残り3指標）に
// またがって記録されているため、生カテゴリ文言の一致では正しくグルーピングできない
const SHIPPING_METRICS = new Set(['パック数', '袋数', 'バラ数', '合計(点数)']);

// 栽培内訳（コンテナ数）関連の指標。シート上は「栽培内訳」と「(コンテナ数)」（表記が
// 全角/半角括弧などで揺れる可能性がある）が別カテゴリ値として隣接しており、生カテゴリ
// 文言の完全一致に頼ると表記差異で統合に失敗するため、出荷関連と同様に指標の内容で判定する
const CULTIVATION_METRICS = new Set(['菌床入れ', '芽かき', '収穫', '注水', '散水', '廃棄', '稼働コンテナ数']);

// 拠点内のレコード列を、カテゴリ列に表示する「ブロック」（1ブロック＝1つの結合セル）に
// グルーピングする。出荷系（SHIPPING_METRICS）・栽培内訳系（CULTIVATION_METRICS）は、
// シート上の生カテゴリ文言に依存せず指標の内容で連続する行をまとめてブロック化する。
// 出荷系は「4指標が揃った時点」でブロックを閉じる方式で判定し、閉じたブロックごとに
// labelForOccurrence(1始まりの出現回数)でラベルを割り当てる（同一概念グループが複数の
// 生カテゴリ文言に分割されているケースに対応）。栽培内訳系は1拠点内に1グループのみの
// 前提で、該当指標が連続する間はそのまま1ブロックにまとめ「栽培内訳（コンテナ数）」を
// 割り当てる。それ以外の行は元の生カテゴリ文言をそのまま使う
function groupIntoLabeledBlocks(siteRecs, labelForOccurrence) {
  const raw = [];
  let shippingRun = null;
  let shippingCount = 0;
  let cultivationRun = null;

  function closeShippingRun() {
    if (!shippingRun) return;
    shippingCount += 1;
    raw.push({ label: labelForOccurrence(shippingCount), records: shippingRun.records });
    shippingRun = null;
  }
  function closeCultivationRun() {
    if (!cultivationRun) return;
    raw.push({ label: '栽培内訳（コンテナ数）', records: cultivationRun });
    cultivationRun = null;
  }

  siteRecs.forEach(r => {
    if (SHIPPING_METRICS.has(r.metric)) {
      closeCultivationRun();
      if (!shippingRun) shippingRun = { records: [], seen: new Set() };
      shippingRun.records.push(r);
      shippingRun.seen.add(r.metric);
      if (shippingRun.seen.size >= SHIPPING_METRICS.size) closeShippingRun();
      return;
    }
    if (CULTIVATION_METRICS.has(r.metric)) {
      closeShippingRun();
      if (!cultivationRun) cultivationRun = [];
      cultivationRun.push(r);
      return;
    }
    closeShippingRun();
    closeCultivationRun();
    raw.push({ label: r.cat, records: [r] });
  });
  closeShippingRun();
  closeCultivationRun();

  // 隣接ブロックが同一ラベルになった場合（勤務実績側で全出荷ブロックを1つの
  // 「出荷内訳（実績）」にまとめる場合など）は1つの結合セルにまとめる
  const merged = [];
  raw.forEach(b => {
    const last = merged[merged.length - 1];
    if (last && last.label === b.label) last.records = last.records.concat(b.records);
    else merged.push({ label: b.label, records: b.records.slice() });
  });
  return merged;
}

function renderPlanTable({ months: planMonths, records }) {

  function rowClass(r, cat) {
    const classes = [];

  }

  let html = `<div class="prod-panel prod-panel-compact">

    // 出荷関連の2グループ（構成比データ側・実数計画データ側）は、シート上の生カテゴリ文言に
    // 依存せず指標の内容と出現順で「出荷内訳（構成比）」「出荷内訳（計画）」を割り当てる
    const blocks = groupIntoLabeledBlocks(

    let rowIdx = 0;
    blocks.forEach(block => {
      block.records.forEach((r, bi) => {
        const isFirstRow = rowIdx === 0;
        const isFirstOfBlock = bi === 0;

        const siteCell = isFirstRow
          ? `<td rowspan="${siteRecs.length}" style="color:${siteColor};font-weight:600;vertical-align:top;padding-top:10px">${site}</td>`

        // 四捨五入するが、r.values（集計・計算に使う元の数値）自体は変更しない

  availSites.forEach(site => {

      <div class="prod-table-wrap"><table class="prod-table">

          ${planMonths.map(m => `<th>${m}</th>`).join('')}
          <th class="th-left" style="min-width:130px">計算方法</th>
        </tr></thead><tbody>`;

    let lastDiv = '';
    rows.forEach(r => {
      const divCell = r.div !== lastDiv
        ? `<td class="col-site" style="color:${r.div === '栽培' ? 'var(--accent-gunma)' : 'var(--accent-inabe)'};font-weight:600" rowspan="${divCount[r.div]}">${r.div}</td>`
        : '';
      if (r.div !== lastDiv) lastDiv = r.div;

      const monthData = planMonths.map((_, mi) => calcRow(site, r, mi));
      const hasData = monthData.some(d => d.h !== null);
      const sampleD = [...monthData].reverse().find(d => d.containers !== null);
      const sampleContainers = sampleD ? sampleD.containers : null;
      const mkey = r.metricKey || '';

      const statusIcon = r.val === null
        ? '<span style="color:var(--muted)">未設定</span>'
        : hasData
          ? '<span style="color:#34d399">●</span>'
          : '<span style="color:#f59e0b">○</span>';

      let basisDesc = '—';
      if (r.val !== null) {
        if (r.col === 'fixedH') {
          basisDesc = `固定 ${r.val} h/月`;
        } else if (r.col === 'kgPerH') {
          basisDesc = sampleContainers !== null ? `${sampleContainers.toLocaleString('ja-JP')} kg ÷ ${r.val} kg/h` : `${mkey}: データなし`;
        } else if (r.col === 'perContainer') {
          basisDesc = sampleContainers !== null ? `${mkey}: ${sampleContainers.toLocaleString('ja-JP')} コンテナ × ${r.val} ${r.unit}` : `${mkey}: データなし`;
        } else if (r.col === 'perPiece') {
          basisDesc = sampleContainers !== null ? `${sampleContainers.toLocaleString('ja-JP')} 点 × ${r.val} 秒` : `${mkey}: データなし`;
        } else if (r.col === 'perCs') {
          basisDesc = sampleContainers !== null ? `${sampleContainers.toLocaleString('ja-JP')} cs × ${r.val} 秒` : `${mkey}: データなし`;
        }
      }

      html += `<tr>${divCell}

      monthData.forEach(d => {
        if (d.h !== null) {
          const disp = d.h < 10 ? d.h.toFixed(1) : Math.round(d.h).toLocaleString('ja-JP');
          html += `<td class="col-num">${disp}<span style="font-size:0.68rem;color:var(--muted)"> h</span></td>`;
        } else {
          html += `<td class="col-num empty" style="color:#444">—</td>`;
        }
      });

      html += `<td class="col-metric" style="font-size:0.72rem;color:var(--muted)">${r.note}</td></tr>`;
    });

    // Subtotals per div
    ['栽培', '出荷'].forEach(div => {
      const divRows = rows.filter(r => r.div === div);
      const totals = planMonths.map((_, mi) => {
        const vals = divRows.map(r => calcRow(site, r, mi).h).filter(v => v !== null);
        return vals.length ? vals.reduce((a, b) => a + b, 0) : null;
      });
      const color = div === '栽培' ? 'var(--accent-gunma)' : 'var(--accent-inabe)';

      // 同じ3列構成にする。以前はcolspan="3"で1セルに結合していたが、col-siteクラスが
      // position:sticky;left:0を持つため、通常行の1列分しかstickyにならない業務区分列と
      // 幅がズレ、横スクロール時に位置がズレて見える不具合があった。col-site/col-work/
      // col-basisクラスは、通常行と同じ列に同じクラスを付与することでsticky位置を揃え、
      // 3列とも同じ背景色・境界線なしスタイルにして見た目上は結合セルのまま見えるようにする
      html += `<tr style="font-weight:600;background:#1a1f35">
        <td class="col-site" style="border-right:none"></td>
        <td class="col-work" style="background:var(--surface);border-left:none;border-right:none"></td>
        <td class="col-basis" style="background:var(--surface);border-left:none;text-align:right;padding-right:10px;color:var(--muted)">${div} 小計</td>`;
      totals.forEach(t => {
        html += t !== null
          ? `<td class="col-num" style="color:${color}">${t < 10 ? t.toFixed(1) : Math.round(t).toLocaleString('ja-JP')}<span style="font-size:0.68rem;opacity:0.7"> h</span></td>`
          : `<td class="col-num empty">—</td>`;
      });
      html += `<td></td></tr>`;
    });

    // Grand total
    const grandTotals = planMonths.map((_, mi) => {
      const vals = rows.map(r => calcRow(site, r, mi).h).filter(v => v !== null);
      return vals.length ? vals.reduce((a, b) => a + b, 0) : null;
    });
    html += `<tr style="font-weight:700;background:#141827;border-top:2px solid #3a3f5c">
      <td class="col-site" style="border-right:none"></td>
      <td class="col-work" style="background:var(--surface);border-left:none;border-right:none"></td>
      <td class="col-basis" style="background:var(--surface);border-left:none;text-align:right;padding-right:10px;color:#e2e8f0">総合計</td>`;
    grandTotals.forEach(t => {
      html += t !== null
        ? `<td class="col-num" style="color:#e2e8f0">${t < 10 ? t.toFixed(1) : Math.round(t).toLocaleString('ja-JP')}<span style="font-size:0.68rem;opacity:0.7"> h</span></td>`
        : `<td class="col-num empty">—</td>`;
    });
    html += `<td></td></tr>`;

    html += `</tbody></table></div></div>`;
  });

  html += `</div>`;
  main.innerHTML = html;
}

// 期間フィルター（開始月・表示月数）を整理済み_分析側の月にも適用する。
// 整理済み_M側・整理済み_分析側とも実質月（暦月）基準のため、オフセットなしの単純一致で
// 期間フィルター後の勤怠側の月に対応する生産実績側の月だけに絞り込む
function filterProductionByPeriod({ months, records }) {
  if (!allData || !periodStartMonth) return { months, records };
  const normWorkMonths = getActiveData().months.map(normalizeMonth);
  const commonMonths = months.filter(m => normWorkMonths.includes(m));
  if (!commonMonths.length) return { months: [], records: records.map(r => ({ ...r, values: [] })) };
  const idxs = commonMonths.map(m => months.indexOf(m));
  return {
    months: commonMonths,
    records: records.map(r => ({ ...r, values: idxs.map(i => r.values[i]) })),
  };
}

    const siteColor = SITE_COLORS[site] || '#e2e8f0';

    // カテゴリ列は「行ごと」ではなく「カテゴリのまとまりごと」に1つの結合セル(rowspan)で表示する。
    // 出荷関連カテゴリは、シート上の生カテゴリ文言に依存せず指標の内容で判定し
    // 「出荷内訳（実績）」に統一する
    const blocks = groupIntoLabeledBlocks(siteRecs, () => '出荷内訳（実績）');

    let rowIdx = 0;
    blocks.forEach(block => {
      block.records.forEach((r, bi) => {
        const isFirstRow = rowIdx === 0;
        const isFirstOfBlock = bi === 0;
        const sepClass = (si > 0 && isFirstRow) ? 'site-start' : '';

        const rc = rowClass(r, block.label);
        html += `<tr class="${[rc, sepClass].filter(Boolean).join(' ')}">`;

        // Site cell: only on first row of site
        if (isFirstRow) {
          html += `<td class="col-site" rowspan="${siteRecs.length}" style="color:${siteColor}">${site}</td>`;
        }

        // Category cell: only on first row of category group
        if (isFirstOfBlock) {
          html += `<td class="col-cat" rowspan="${block.records.length}">${block.label}</td>`;
        }

        // Metric
        html += `<td class="col-metric">${r.metric}</td>`;

        // Values（延長列・超過列は空欄、選択範囲内はデータなしを「ー」で表示）
        prodIdx.forEach((pi, mi) => {
          if (mi >= originalCount) { html += '<td class="col-num"></td>'; return; }
          const v = pi >= 0 ? r.values[pi] : null;
          html += v !== null
            ? `<td class="col-num">${v.toLocaleString('ja-JP')}</td>`
            : `<td class="col-num empty">—</td>`;
        });

        html += '</tr>';
        rowIdx++;
      });
    });
  });

  html += `</tbody></table>
    </div></div>`;

  main.innerHTML = html;
}

/* ── 標準工数設定 ───────────────────────────────────────────────────── */

// pcsPerCs: パック・袋ともに30P/cs。バラ(バラ数メトリック)は1個=1cs
// （「標準工数設定」シートの取得に失敗した場合のフォールバック値としてのみ使用）
const STD_CS_DEFAULT = { pcsPerCs: 30, baraMetric: 'バラ数' };

// 生産実績シートの対応メトリック名（作業区分名をキーに突き合わせる）。
// 「標準工数設定」シート側にはmetricKey専用の列が無いため、この対応表はコード側に残す
const TASK_METRIC_KEYS = {
  '菌床入れ': '菌床入れ',
  '芽かき': '芽かき',
  '収穫': '収穫量(kg)',
  '注水': '注水',
  '散水': '散水',
  '廃棄': '廃棄',
  '計量時間': '収穫',
  'コンテナ移動時間': '稼働コンテナ数',
  'コンテナ点検時間': '稼働コンテナ数',
  'その他間接業': null,
  'パック並べる': 'パック数',
  '袋入れ・閉じ': '袋数',
  '段ボール詰める': '合計(点数)',
  '段ボール作成': '合計(点数)',
  '計量': '合計(点数)',
  '納品書・伝票作成': null,
  '椎茸運搬(生在庫)': '合計(点数)',
  '椎茸運搬(製品)': '合計(点数)',
  '付帯作業': '付帯作業',
};

// 特定の作業区分を適用する拠点を制限する（null = 全拠点）
const TASK_SITE_FILTER = {
  '付帯作業': ['南丹'],
};

// cs数 = (合計点数 - バラ数) / pcsPerCs + バラ数
function calcCs(pcs, bara, conv) {
  const nonBara = Math.max(0, pcs - bara);
  return nonBara / conv.pcsPerCs + bara;
}

// 標準工数(h)の計算エンジン（標準工数(h)タブ・比較タブ・要員計画タブで共通）。
// 「標準工数設定」の係数行(r: {col,val,unit,metricKey})を、生産量の実データ(records)と
// 突き合わせて工数(h)に変換する。records/prodMonthsを実績側（整理済み_分析）にすれば
// 従来通りの実績ベースの計算、予定側（要員計画で組み立てたrecords）にすれば計画ベースの
// 計算になり、ロジック自体は完全に共通。
//
// records: [{ site, metric, values: number[] }]（実データ本体。metricは'収穫量(kg)'
//   '稼働コンテナ数'等、TASK_METRIC_KEYSのmetricKeyと同じ語彙で揃えること）
// prodMonths: recordsのvaluesと対応する月ラベル配列（生産実績表記、例:"2025/10"）
// displayMonths: 表示列（work-hours表記、固定12本ルール適用後。延長列は実在月ラベル、
//   超過列は空文字）
// originalCount: displayMonthsのうち選択範囲内（実データを載せてよい）の本数
// conv: { pcsPerCs, baraMetric }（出荷cs換算設定）
// metricAliases: { [primaryKey]: fallbackKey } — 計画シート等で別名メトリックを使う場合に指定
//   例: { 'パック数': '出荷計画実数', '袋数': '出荷計画実数', '合計(点数)': '出荷計画実数' }
// preferredCat: 同名メトリックが複数カテゴリに存在する場合（計画シートの出荷内訳 vs 実数計画など）
// このカテゴリのレコードを優先して返す。該当なければ通常の先頭一致にフォールバック。
// また preferredCat 指定時は 'パック数' を 合計(点数)−袋数−バラ数 で導出する
// （計画シートの実数計画には パック数 行が存在しないため）。
function createStdHoursEngine(records, prodMonths, displayMonths, originalCount, conv, metricAliases, preferredCat) {
  const aliases = metricAliases || {};

  function getRawVal(site, metricKey, pi) {
    const lookup = (key, cat) => {
      if (cat) {
        const r = records.find(rr => rr.site === site && rr.metric === key && rr.cat === cat);
        if (r) return r;
      }
      return records.find(rr => rr.site === site && rr.metric === key);
    };
    let r = lookup(metricKey, preferredCat);
    if (!r && aliases[metricKey]) r = lookup(aliases[metricKey], preferredCat);
    if (!r) return null;
    return r.values[pi] ?? null;
  }

  function getProdVal(site, metricKey, mi) {
    if (mi >= originalCount) return null;
    const m = displayMonths[mi];
    if (!m) return null;
    const pi = prodMonths.indexOf(normalizeMonth(m));
    if (pi < 0) return null;

    // 計画シートで パック数 は実数計画カテゴリにないため合計−袋−バラで導出
    if (preferredCat && metricKey === 'パック数') {
      const total = getRawVal(site, '合計(点数)', pi);
      const bags  = getRawVal(site, '袋数', pi);
      const bara  = getRawVal(site, 'バラ数', pi);
      if (total !== null && bags !== null && bara !== null) return total - bags - bara;
      if (total !== null) return total; // 袋・バラが取れなければ合計で代替
    }

    return getRawVal(site, metricKey, pi);
  }

  function calcRow(site, r, mi) {
    if (r.sites && !r.sites.includes(site)) return { h: null, containers: null };
    const v = r.val;
    if (v === null || v === undefined) return { h: null, containers: null };
    const mkey = r.metricKey || null;

    if (r.col === 'kgPerH' && v > 0) {
      const kg = getProdVal(site, mkey || '収穫量(kg)', mi);
      return { h: kg !== null ? kg / v : null, containers: kg };
    }
    // 毎月固定時間の項目は実データを参照しないため、他の項目のように「実データなし=null」が
    // 自然には効かない。延長列・超過列（mi >= originalCount）では明示的に空欄にする
    if (r.col === 'fixedH') return { h: mi < originalCount ? v : null, containers: null };
    if (r.col === 'perContainer') {
      const containers = getProdVal(site, mkey || '稼働コンテナ数', mi);
      if (containers !== null) {
        const hPer = r.unit === 'h' ? v : v / 60;
        return { h: containers * hPer, containers };
      }
      return { h: null, containers: null };
    }
    if (r.col === 'perPiece') {
      const pcs = getProdVal(site, mkey || '合計(点数)', mi);
      if (pcs !== null) {
        const secPer = r.unit === '秒' ? v : v * 60;
        return { h: pcs * secPer / 3600, containers: pcs };
      }
      return { h: null, containers: null };
    }
    if (r.col === 'perCs') {
      const pcs  = getProdVal(site, mkey || '合計(点数)', mi);
      const bara = getProdVal(site, conv.baraMetric || 'バラ数', mi) || 0;
      if (pcs !== null) {
        const cs = calcCs(pcs, bara, conv);
        const secPer = r.unit === '秒' ? v : v * 60;
        return { h: cs * secPer / 3600, containers: Math.round(cs) };
      }
      return { h: null, containers: null };
    }
    return { h: null, containers: null };
  }

  return { getProdVal, calcRow };
}

// stdSettingsSheetData: 「標準工数設定」シートから読み取った値そのもの（リセット時の復元元）。
// currentStdRows/currentStdConv: 画面編集を反映する実行時の状態（保存はせず、リセットで
// stdSettingsSheetDataの値に戻す）。ページ読み込み時に一度だけ取得し、以降は
// 「更新」ボタンを押しても再取得しない（loadAll()とは独立したPromiseで管理する）
let stdSettingsSheetData = null;
let currentStdRows = null;
let currentStdConv = null;
let stdSettingsPromise = null;

// 予実グループ用の独立した標準工数設定（勤務実績タブとは別管理）
let yojitsuStdRows = null;
let yojitsuStdConv = null;

function loadStdSettingsSheetOnce() {
  if (!stdSettingsPromise) {
    stdSettingsPromise = fetchStdSettingsSheet().then(data => {
      stdSettingsSheetData = data;
      currentStdRows = JSON.parse(JSON.stringify(data.rows));
      currentStdConv = { ...data.conv };
      // 予実タブ用（初回読み込み時のみ初期化。以降は独立して編集可能）
      if (!yojitsuStdRows) {
        yojitsuStdRows = JSON.parse(JSON.stringify(data.rows));
        yojitsuStdConv = { ...data.conv };
      }
      return data;
    }).catch(e => {
      console.error('[標準工数設定] シート取得エラー:', e);
      stdSettingsSheetData = { conv: { ...STD_CS_DEFAULT }, rows: [], error: e.message };
      currentStdRows = [];
      currentStdConv = { ...STD_CS_DEFAULT };
      if (!yojitsuStdRows) { yojitsuStdRows = []; yojitsuStdConv = { ...STD_CS_DEFAULT }; }
      throw e;
    });
  }
  return stdSettingsPromise;
}

async function fetchStdSettingsSheet() {
  // headers=0：見出し行の結合をgvizに任せず、1行目から全行を生データのまま受け取る
  // （1〜3行目のcs換算設定はセル単位の値を個別に読む必要があるため）
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(STD_SETTINGS_SHEET_NAME)}&headers=0`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.replace(/^[^{]+/, '').replace(/[^}]+$/, ''));
  return parseStdSettingsSheet(json);
}

function parseStdSettingsSheet(json) {
  const rows = json.table.rows || [];
  const cellAt = (rIdx, cIdx) => {
    const row = rows[rIdx];
    const c = row && row.c && row.c[cIdx];
    return c ? (c.v !== undefined ? c.v : null) : null;
  };

  // 出荷cs換算設定（1〜3行目）：ラベル文字列を含むセルを探し、同じ列の直下のセルを値として読む。
  // 実際の列位置に依存しない作りにすることで、シート側の細かいレイアウト差異を吸収する。
  // 1行目はタイトル行（例:「cs数=(合計点数-バラ数)÷P/cs+バラ数」）で"P/cs"のような
  // 短い文字列を含むことがあるため、検索は2行目以降に限定し、かつラベルは見出しに
  // 実際に入っている文言そのもの（十分に長い・特定的な文字列）で照合する
  function findLabelValue(labelSubstr, startRow = 1, endRow = 4) {
    for (let r = startRow; r < Math.min(endRow, rows.length); r++) {
      const row = rows[r];
      if (!row || !row.c) continue;
      for (let c = 0; c < row.c.length; c++) {
        const cell = row.c[c];
        const text = cell ? String(cell.v ?? cell.f ?? '') : '';
        if (text.includes(labelSubstr)) {
          return cellAt(r + 1, c);
        }
      }
    }
    return null;
  }
  const pcsPerCsRaw = findLabelValue('パック・袋P/cs') ?? findLabelValue('パック・袋');
  const baraMetricRaw = findLabelValue('バラのメトリック名') ?? findLabelValue('メトリック名');
  // gvizはセルの書式設定によって、数値であっても文字列型("10"等)でレスポンスを返すことが
  // あるため、typeofによる厳格な型チェックではなくNumber()で解釈できるかどうかで判定する
  const pcsPerCsNum = Number(pcsPerCsRaw);
  const conv = {
    pcsPerCs: (pcsPerCsRaw !== null && pcsPerCsRaw !== '' && !isNaN(pcsPerCsNum) && pcsPerCsNum > 0) ? pcsPerCsNum : STD_CS_DEFAULT.pcsPerCs,
    baraMetric: (typeof baraMetricRaw === 'string' && baraMetricRaw.trim()) ? baraMetricRaw.trim() : STD_CS_DEFAULT.baraMetric,
  };
  console.log('[標準工数設定] cs換算設定 パース結果:', JSON.stringify(conv), 'raw:', JSON.stringify({ pcsPerCsRaw, baraMetricRaw }), 'types:', typeof pcsPerCsRaw, typeof baraMetricRaw);

  // 4行目：列見出し（固定で分かっているためスキップ）。5行目以降が各作業のデータ行
  // A=業務区分, B=作業区分, C=1コンテナ当たり, D=時間当たり(kg/h), E=1cs当たり,
  // F=1個当たり, G=固定時間(h), H=単位, I=考え方
  const COL = { div: 0, task: 1, perContainer: 2, kgPerH: 3, perCs: 4, perPiece: 5, fixedH: 6, unit: 7, note: 8 };
  const COEF_COLS = ['perContainer', 'kgPerH', 'perCs', 'perPiece', 'fixedH'];
  const stdRows = [];
  let currentDiv = '';
  for (let r = 4; r < rows.length; r++) {
    const divVal = cellAt(r, COL.div);
    if (divVal) currentDiv = String(divVal).trim();
    const taskVal = cellAt(r, COL.task);
    if (!taskVal) continue; // 業務区分(A列結合)の見出し行・空行はスキップ
    const task = String(taskVal).trim();

    let col = null, val = null;
    for (const c of COEF_COLS) {
      const v = cellAt(r, COL[c]);
      if (v !== null && v !== '') { col = c; val = typeof v === 'number' ? v : parseFloat(v); break; }
    }
    if (val !== null && isNaN(val)) val = null;

    const unitVal = cellAt(r, COL.unit);
    const noteVal = cellAt(r, COL.note);

    stdRows.push({
      div: currentDiv,
      task,
      col,
      val,
      unit: unitVal ? String(unitVal).trim() : '',
      metricKey: Object.prototype.hasOwnProperty.call(TASK_METRIC_KEYS, task) ? TASK_METRIC_KEYS[task] : null,
      note: noteVal ? String(noteVal).trim() : '',
      sites: TASK_SITE_FILTER[task] || null,
    });
  }

  return { conv, rows: stdRows };
}

function loadStdSettings() {
  return currentStdRows || [];
}
function loadCsConv() {
  return currentStdConv || { ...STD_CS_DEFAULT };
}

    <div style="margin:0 0 16px;padding:10px 16px;background:#1a1f35;border:1px solid #3a3f5c;border-radius:6px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap">

        <span style="font-size:0.7rem;color:var(--muted)"> 個/cs</span></div>
      </label>
      <label style="font-size:0.78rem;color:var(--muted)">バラのメトリック名
        <div><input type="text" id="cs-bara" value="${conv.baraMetric || 'バラ数'}"
          style="width:90px;background:#0d1017;border:1px solid #3a3f5c;color:#e2e8f0;padding:3px 6px;border-radius:4px;font-size:0.82rem">

      </label>
      <div style="font-size:0.72rem;color:var(--muted)">バラ→1cs、パック・袋→${conv.pcsPerCs || 30}P/cs</div>
    </div>

      : '';

window.resetStdSettings = function() {
  if (!confirm('シート読み込み時の値にリセットしますか？（編集内容は破棄されます）')) return;

  currentStdConv = { ...stdSettingsSheetData.conv };
  window._stdRows = currentStdRows;
  window._stdConv = currentStdConv;
  renderStdSetTab();
};

function loadYojitsuStdSettings() {

}
function loadYojitsuCsConv() {

}

function renderYojitsuStdSetTab() {
  const main = document.getElementById('main');

  if (!stdSettingsSheetData) {
    main.innerHTML = '<div class="loading">標準工数設定を読み込み中...</div>';

      main.innerHTML = `<div class="error-msg">「${STD_SETTINGS_SHEET_NAME}」シートの取得エラー: ${e.message}</div>`;

    <div style="margin:0 0 16px;padding:10px 16px;background:#1a1f35;border:1px solid #3a3f5c;border-radius:6px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap">
      <div style="font-size:0.78rem;color:var(--muted);font-weight:600;margin-bottom:4px;width:100%">

      </div>
      <label style="font-size:0.78rem;color:var(--muted)">パック・袋 P/cs
        <div><input type="number" id="yj-cs-pcs" value="${conv.pcsPerCs || 30}" min="1"
          style="width:70px;background:#0d1017;border:1px solid #3a3f5c;color:#e2e8f0;padding:3px 6px;border-radius:4px;font-size:0.82rem">
        <span style="font-size:0.7rem;color:var(--muted)"> 個/cs</span></div>
      </label>
      <label style="font-size:0.78rem;color:var(--muted)">バラのメトリック名
        <div><input type="text" id="yj-cs-bara" value="${conv.baraMetric || 'バラ数'}"
          style="width:90px;background:#0d1017;border:1px solid #3a3f5c;color:#e2e8f0;padding:3px 6px;border-radius:4px;font-size:0.82rem">
        <span style="font-size:0.7rem;color:var(--muted)"> (計画シートのメトリック名)</span></div>
      </label>
      <div style="font-size:0.72rem;color:var(--muted)">バラ→1cs、パック・袋→${conv.pcsPerCs || 30}P/cs</div>
