    // 現在選択中のまま（拠点を変えればMAXも変わる）
    const ALL_DIVS = ['栽培', '出荷', '配送'];
    function actualHoursForPlanMonthsAllEmpTypes(site, typeFilter) {
      const { employees, months: activeMonths } = getActiveData();
      const emps = employees.filter(e => e.base === site && e.workType && typeFilter(e.workType));
      return planMonths.map(planMonth => {
        const ami = activeMonths.findIndex(m => normalizeMonth(m) === planMonth);
        if (ami < 0) return null;
        const total = emps.reduce((s, e) => s + (e.hours[ami] ?? 0), 0);
        return total > 0 ? Math.round(total * 10) / 10 : null;
      });
    }
    const actualByDivAllOn = {};
    ALL_DIVS.forEach(div => {
      const typeFilter = div === '栽培'
        ? wt => workTypeClass(wt) === 'wt-栽培'
        : div === '配送'
          ? wt => workTypeClass(wt) === 'wt-配送'
          : wt => workTypeClass(wt) === 'wt-出荷';
      const actualBySite = sitesToShow.map(site => actualHoursForPlanMonthsAllEmpTypes(site, typeFilter));
      actualByDivAllOn[div] = sl(planMonths.map((_, mi) => actualBySite.reduce((s, arr) => s + (arr[mi] || 0), 0)));
    });
    const actualMonthlyTotalsAllOn = vm.map((_, mi) => ALL_DIVS.reduce((s, div) => s + (actualByDivAllOn[div][mi] || 0), 0));

    const allDivRowsAllOn = rows.filter(r => ALL_DIVS.includes(r.div));
    const stdByTaskAllOn = allDivRowsAllOn.map(r => sl(planMonths.map((_, mi) => {
      const total = sitesToShow.reduce((s, site) => {
        const res = calcRow(site, r, mi);
        return s + (res.h !== null ? res.h : 0);
      }, 0);
      return total > 0 ? Math.round(total * 10) / 10 : null;
    })));
    const stdMonthlyTotalsAllOn = vm.map((_, mi) => stdByTaskAllOn.reduce((s, data) => s + (data[mi] || 0), 0));

    const mergedAggAllOn = mergeThreeSiteMergeAggAcrossDivs(ALL_DIVS.map(div => threeSiteMergeAgg(div, siteForAgg)));
    const stdHoursTotalsAllOn = sl(planMonths.map((_, mi) => threeSiteMergeStdHoursTotal(mergedAggAllOn, ALL_DIVS, siteForAgg, mi)));

    const sharedMax = computeSharedAxisMax([actualMonthlyTotalsAllOn, stdMonthlyTotalsAllOn, stdHoursTotalsAllOn], 100);

    // 折れ線（収穫量・出荷量）：既存div別チャートと同じplanVolume()を使用し、栽培・出荷
    // それぞれ右軸(y2)の折れ線として追加する（選択中拠点分。全拠点合計はこのモードでは
    // 選択不可のため単一拠点分の集計で足りる）。配送は生産量指標を持たないため、
    // 動的なdivsではなく栽培・出荷に固定する（配送のみ選択時にvolDataByDiv['栽培']・
    // ['出荷']が未定義になり、下のline datasetsがエラーになるのを防ぐ）
    const volDataByDiv = {};
    ['栽培', '出荷'].forEach(div => {
      volDataByDiv[div] = sl(planMonths.map((_, mi) =>
        sitesToShow.reduce((s, site) => {
          const v = planVolume(site, div, mi);
          return s + (v !== null ? v : 0);
        }, 0) || null
      ));
    });
    const volMax = computeSharedAxisMax([volDataByDiv['栽培'], volDataByDiv['出荷']], 1000) || undefined;

    const ctx = document.getElementById('plansitesum2-combined')?.getContext('2d');
    if (!ctx) return;
    const datasets = [];
    // 実績工数：業務区分チェックボックスで選択されているdivだけ棒を生成する。
    // 栽培＝赤、出荷＝オレンジ（既存の実績棒と同じ暖色系）、配送＝シアンで、
    // 既存のROLE_TYPE_COLORS（栽培緑/出荷黄）とは衝突しない配色にしている
    const ACTUAL_BAR_COLORS = { '栽培': '#f87171', '出荷': '#fb923c', '配送': '#22d3ee' };
    divs.forEach(div => {
      const color = ACTUAL_BAR_COLORS[div];
      datasets.push({
        type: 'bar', label: `${div}（実績）`, data: actualByDiv[div],
        backgroundColor: color + '99', borderColor: color, borderWidth: 1,
        stack: 'actual', order: 1, _actualGroup: true,
      });
    });
    stdHoursDs.forEach(ds => datasets.push({ ...ds, data: sl(ds.data) }));
    allDivRows.forEach((r, ri) => {
      datasets.push({
        type: 'bar', label: r.task, data: stdByTask[ri],
        backgroundColor: TASK_COLORS[ri % TASK_COLORS.length] + 'cc',
        borderColor: TASK_COLORS[ri % TASK_COLORS.length],
        borderWidth: 0, stack: 'std', order: 2, _stdGroup: true,
      });
    });
    datasets.push({
      type: 'line', label: DIV_METRIC['栽培'], data: volDataByDiv['栽培'],
      borderColor: '#94a3b8', backgroundColor: 'transparent',
      borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#94a3b8',
      tension: 0.3, yAxisID: 'y2', order: 0,
      _volumeLine: true, _unit: DIV_UNIT['栽培'],
    });
    datasets.push({
      type: 'line', label: DIV_METRIC['出荷'], data: volDataByDiv['出荷'],
      borderColor: '#c084fc', backgroundColor: 'transparent',
      borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#c084fc',
      tension: 0.3, yAxisID: 'y2', order: 0,
      _volumeLine: true, _unit: DIV_UNIT['出荷'],
    });
    planCmpChartInstances['sitesum-combined'] = new Chart(ctx, {
      data: { labels: vm, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: '#8892a4', font: { size: 10 }, boxWidth: 10, padding: 6 } },
          tooltip: tooltipOpts(true, true),
        },
        scales: {
          x: { stacked: true, ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e2235' } },
          y: {
            stacked: true, position: 'left',
            ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} h` },
            grid: { color: '#1e2235' }, suggestedMin: 0, max: sharedMax,
            title: { display: true, text: 'h', color: '#8892a4', font: { size: 10 } },
          },
          y2: {
            position: 'right',
            ticks: { color: '#64748b', font: { size: 10 }, callback: v => v.toLocaleString('ja-JP') },
            grid: { drawOnChartArea: false },
            suggestedMin: 0, max: volMax,
            title: { display: true, text: 'kg', color: '#64748b', font: { size: 10 } },
          },
        },
      },
    });

    // 2段目：削除した「拠点・業務別」モードの3段目（標準工数合計 vs 勤務時間合計）を
    // そのまま移設。computeSiteTotalData()・renderTotalChart()自体の中身は無変更で、
    // 呼び出し先のcanvas IDと見出し文言のみ変更している。「予定標準工数合計」バーは
    // 1段目で計算済みのallDivRows/stdByTaskをそのまま再利用し、工程別内訳
    // （TASK_COLORS）の積み上げバーとして表示する（二重計算を避けるため、ここでの
    // calcRow()再計算は行わない）
    {
      const site = planCmpSiteTab;
      const allSitesTotalData = availSites.map(s => computeSiteTotalData(s, divs));
      const siteTotalIdx = availSites.indexOf(site);
      const { stdTotalRaw, actualData, forecastData, actualCountData, forecastCountData } = allSitesTotalData[siteTotalIdx];
      const taskBreakdown = allDivRows.map((r, ri) => ({
        label: r.task, data: stdByTask[ri], color: TASK_COLORS[ri % TASK_COLORS.length],
      }));
      const totalYMax = computeSharedAxisMax(
        allSitesTotalData.map(d => totalChartStackedValues(d.stdTotalRaw, d.actualData, d.forecastData)),
        100
      ) || undefined;
      const siteCountMax = computeSharedAxisMax(
        allSitesTotalData.map(d => EMP_SERIES.flatMap(et => [
          ...sl(d.actualCountData[et.label]).filter(v => v !== null),
          ...sl(d.forecastCountData[et.label]).filter(v => v !== null),
        ])),
        1
      ) || undefined;
      const siteCountDatasets = EMP_SERIES.flatMap(et => [
        {
          type: 'line', label: `${et.label}人数（実績）`, data: sl(actualCountData[et.label]),
          borderColor: et.color, backgroundColor: 'transparent',
          borderWidth: 2, pointRadius: 3, pointBackgroundColor: et.color,
          tension: 0.3, yAxisID: 'y2', order: 0, _countLine: true, spanGaps: true,
        },
        {
          type: 'line', label: `${et.label}人数（予想）`, data: sl(forecastCountData[et.label]),
          borderColor: et.color, backgroundColor: 'transparent',
          borderWidth: 2, borderDash: [5, 4],
          pointRadius: 3, pointBackgroundColor: et.color, pointBorderColor: et.color,
          tension: 0.3, yAxisID: 'y2', order: 0, _countLine: true, spanGaps: true,
        },
      ]);
      const siteCountScale = {
        y2: {
          position: 'right',
          ticks: { color: '#64748b', font: { size: 10 }, callback: v => `${v} 人` },
          grid: { drawOnChartArea: false },
          suggestedMin: 0, max: siteCountMax,
          title: { display: true, text: '人', color: '#64748b', font: { size: 10 } },
        },
      };
      renderTotalChart(`plansitesum2-${site}-emp`, stdTotalRaw, actualData, forecastData,
        { extraDatasets: siteCountDatasets, extraScales: siteCountScale, yMaxOverride: totalYMax, taskBreakdown });
    }
  }
  // planCmpSubtabはグローバル変数（restoreSessionStateBeforeFirstLoad()で復元される）。
  // ここでlet宣言してしまうとローカルにシャドーイングされ、復元された値が反映されなく
  // なるため、宣言はトップレベルのみとし、ここでは代入しない（有効な4値のいずれか
  // であることだけ保証する。restoreSessionStateBeforeFirstLoad()経由以外で不正な値が
  // 入ることは想定しないが、念のため無効値の場合のみ既定値'site'にフォールバックする）
  if (!['site', 'sitesummary', 'summary', 'table'].includes(planCmpSubtab)) planCmpSubtab = 'site';
  function renderContent() {
    destroyCharts();
    renderSiteTabBarFixed();
    if (planCmpSubtab === 'sitesummary') renderSiteSummaryView();
    else if (planCmpSubtab === 'summary') renderSummaryView();
    else if (planCmpSubtab === 'table') renderTableView();
    else renderSiteView();
  }

  const dropdownOptionsHtml = planMonths.map((m, i) =>
    `<label style="display:flex;align-items:center;gap:6px;padding:4px 8px;cursor:pointer;border-radius:4px;white-space:nowrap" class="plancmp2-opt" data-idx="${i}">
      <input type="checkbox" data-idx="${i}" checked style="accent-color:#38bdf8;cursor:pointer"> <span>${m}</span>
    </label>`
  ).join('');

  main.innerHTML = `
    <div class="compare-shell">
      <div class="compare-header-row" style="flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50;background:var(--surface2);padding:8px 0;margin:-8px 0 0">
        <div class="chart-section-label" style="flex-shrink:0">📊比較（繁忙期見込み）／ ファーム勤務時間 &gt; 標準労働時間
          <span style="font-size:0.72rem;font-weight:400;color:var(--muted);margin-left:8px">実績工数(左棒) VS 標準労働時間 VS 標準工数(右棒)</span>
        </div>
        <div style="flex-basis:100%;font-size:0.7rem;color:var(--muted);line-height:1.2;margin-top:1px">①実績工数(左棒)＞整理済み_M / 整理済み_増減　②標準労働時間＞標準労働時間　③標準工数(右棒)＞標準工数設定</div>
        <div style="flex:1;min-width:0;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:0.78rem;color:var(--muted);flex-shrink:0">表示月</span>
          <div style="position:relative;display:inline-block">
            <button id="plancmp2-dd-btn" style="display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;border:1px solid #3a3f5c;background:#1a1f35;color:#e2e8f0;font-size:0.8rem;cursor:pointer;min-width:160px;justify-content:space-between">
              <span id="plancmp2-dd-label">全月選択中</span>
              <span style="font-size:0.6rem">▼</span>
            </button>
            <div id="plancmp2-dd-panel" style="display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:200;background:#1a1f35;border:1px solid #3a3f5c;border-radius:6px;padding:6px 4px;min-width:160px;max-height:min(80vh, calc(100vh - 160px));overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,0.5)">
              <div style="display:flex;gap:6px;padding:0 4px 6px;border-bottom:1px solid #2a2f4a;margin-bottom:4px">
                <button id="plancmp2-all" style="flex:1;padding:3px 0;font-size:0.73rem;border-radius:4px;border:1px solid #3a3f5c;background:transparent;color:#8892a4;cursor:pointer">全選択</button>
                <button id="plancmp2-clear" style="flex:1;padding:3px 0;font-size:0.73rem;border-radius:4px;border:1px solid #3a3f5c;background:transparent;color:#8892a4;cursor:pointer">クリア</button>
              </div>
              <div id="plancmp2-opts">${dropdownOptionsHtml}</div>
            </div>
          </div>
          <div id="plancmp2-site-tabbar-fixed" style="display:none;gap:6px;flex-wrap:wrap"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
          <div class="transfer-toggle" id="plancmp2-subtabs">
            <button class="transfer-toggle-btn${planCmpSubtab === 'site' ? ' active' : ''}" data-tab="site">拠点・業務別</button>
            <button class="transfer-toggle-btn${planCmpSubtab === 'sitesummary' ? ' active' : ''}" data-tab="sitesummary">拠点サマリ</button>
            <button class="transfer-toggle-btn${planCmpSubtab === 'summary' ? ' active' : ''}" data-tab="summary">3拠点サマリ</button>
            <button class="transfer-toggle-btn${planCmpSubtab === 'table' ? ' active' : ''}" data-tab="table">表</button>
          </div>
        </div>
      </div>
      <div id="compare2-content"></div>
    </div>`;

  function syncDropdownLabel() {
    const lbl = document.getElementById('plancmp2-dd-label');
    if (!lbl) return;
    if (planCmpSelected.size === planMonths.length) lbl.textContent = '全月選択中';
    else if (planCmpSelected.size === 0) lbl.textContent = '未選択';
    else {
      const sorted = [...planCmpSelected].sort((a, b) => a - b);
      const names = sorted.map(i => planMonths[i]);
      lbl.textContent = names.length <= 3 ? names.join(', ') : `${names[0]}〜 他${names.length - 1}件`;
    }
  }

  function syncCheckboxes() {
    document.querySelectorAll('#plancmp2-opts input[type=checkbox]').forEach(cb => {
      cb.checked = planCmpSelected.has(parseInt(cb.dataset.idx));
    });
    syncDropdownLabel();
  }

  // ドロップダウン開閉
  document.getElementById('plancmp2-dd-btn').addEventListener('click', e => {
    e.stopPropagation();
    const panel = document.getElementById('plancmp2-dd-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  });
  document.addEventListener('click', e => {
    const panel = document.getElementById('plancmp2-dd-panel');
    if (panel && !panel.contains(e.target) && e.target.id !== 'plancmp2-dd-btn') {
      panel.style.display = 'none';
    }
  }, true);

  // チェックボックス変更
  document.getElementById('plancmp2-opts').addEventListener('change', e => {
    const cb = e.target;
    if (cb.type !== 'checkbox') return;
    const i = parseInt(cb.dataset.idx);
    if (cb.checked) {
      planCmpSelected.add(i);
    } else {
      planCmpSelected.delete(i);
    }
    syncDropdownLabel();
    renderContent();
  });

  document.getElementById('plancmp2-all').onclick = () => {
    planMonths.forEach((_, i) => planCmpSelected.add(i));
    syncCheckboxes();
    renderContent();
  };
  document.getElementById('plancmp2-clear').onclick = () => {
    planCmpSelected = new Set();
    syncCheckboxes();
    renderContent();
  };

  document.querySelectorAll('#plancmp2-subtabs .transfer-toggle-btn').forEach(btn => {
    btn.onclick = () => {
      planCmpSubtab = btn.dataset.tab;
      document.querySelectorAll('#plancmp2-subtabs .transfer-toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderContent();
      saveSessionState();
    };
  });

  renderContent();
}

/* ── 比較タブ: 標準工数 vs 実績工数 ────────────────────────────── */
function renderCompareTab() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">比較データを計算中...</div>';
  if (!allData) { main.innerHTML = '<div class="error-msg">勤務データが未ロードです</div>'; return; }
  Promise.all([fetchProductionSheet(), loadStdSettingsSheetOnce()]).then(([prodData]) => {
    renderCompareCharts(prodData);
  }).catch(e => {
    main.innerHTML = `<div class="error-msg">データ取得エラー: ${e.message}</div>`;
  });
}

function renderCompareCharts(prodData) {
  const main = document.getElementById('main');
  const { employees } = getActiveData();
  const { months: prodMonths, records } = prodData;
  const rows = loadStdSettings();
  const conv = loadCsConv();

  // 表示列は「開始月から固定12本（シート実在最新月を超える分は見出しも空欄）」。
  // 生産実績側の実データは、選択範囲内(mi < originalCount)の月だけをnormalizeMonth()で
  // 突き合わせる。延長列・超過列には勤怠・生産実績いずれのデータも一切載せない
  const { months: commonMonths, originalCount } = getExtendedDisplayMonths();
  const { calcRow } = createStdHoursEngine(records, prodMonths, commonMonths, originalCount, conv);

  const availSites = [...new Set(records.map(r => r.site))].filter(s => SITE_COLORS[s]);

  function workHours(site, typeFilter) {
    const emps = employees.filter(e => e.base === site && e.workType && typeFilter(e.workType));
    return commonMonths.map((_, mi) => {
      if (mi >= originalCount) return null;
      const total = emps.reduce((s, e) => s + (e.hours[mi] ?? 0), 0);
      return total > 0 ? Math.round(total * 10) / 10 : null;
    });
  }

  // Task colors for stacked bar（拠点色 SITE_COLORS: 青/紫/緑、および①拠点別
  // サブタブの実績工数バー固定色 #f87171 と被らないよう、赤・橙・黄系のみで構成。
  // validate_palette.jsで拠点色・実績色との衝突・CVD分離を確認済み
  const TASK_COLORS = [
    '#ef4444','#f97316','#eab308','#fb7185','#fb923c',
    '#fde047','#fdba74','#dc2626','#fef08a','#e11d48',
  ];

  const divs = ['栽培', '出荷'];

  // 拠点別（①）・拠点サマリ（②）の両サブタブから共通で使うデータを先に組み立てておく
  window._cmpChartData = {};
  availSites.forEach(site => {
    divs.forEach(div => {
      const divRows = rows.filter(r => r.div === div);
      const typeFilter = div === '栽培'
        ? wt => workTypeClass(wt) === 'wt-栽培'
        : wt => workTypeClass(wt) === 'wt-出荷';
      window._cmpChartData[`${site}-${div}`] = { divRows, actualH: workHours(site, typeFilter), div };
    });
  });

  let compareChartInstances = {};
  function destroyCompareCharts() {
    Object.values(compareChartInstances).forEach(c => c.destroy());
    compareChartInstances = {};
  }

  function tooltipOpts(showStdFooter, showActualTotal) {
    return {
      backgroundColor: '#1e2235', borderColor: '#3a3f5c', borderWidth: 1,
      titleColor: '#e2e8f0', bodyColor: '#e2e8f0',
      footerColor: '#e2e8f0', footerFont: { weight: 'normal' },
      callbacks: {
        label: ctx => {
          const v = ctx.parsed.y;
          if (v === null || v === undefined) return null;
          return `${ctx.dataset.label}: ${v.toLocaleString('ja-JP')} h`;
        },
        // 拠点別内訳（実績側）の直下に実績合計を差し込む。footerは常にbody全体の後に
        // 表示されるため、統合グラフ（実績＋標準）では使えず、実績側の最後の行に付与する
        // _actualGroup/_stdGroupはツールチップ集計専用の目印（Chart.jsのstack機能とは無関係）。
        // 実績工数（拠点別）グラフはグループ化バー表示のため、実際のstackプロパティは付与しない
        afterLabel: showActualTotal ? function (ctx) {
          const actualItems = (this.dataPoints || []).filter(i => i.dataset._actualGroup && i.parsed.y != null);
          if (!actualItems.length) return;
          const last = actualItems[actualItems.length - 1];
          if (ctx.datasetIndex !== last.datasetIndex || ctx.dataIndex !== last.dataIndex) return;
          const actualTotal = actualItems.reduce((s, i) => s + i.parsed.y, 0);
          if (actualTotal === 0) return;
          return `実績合計: ${Math.round(actualTotal).toLocaleString('ja-JP')} h`;
        } : undefined,
        footer: showStdFooter ? items => {
          const stdTotal = items
            .filter(i => i.dataset._stdGroup && i.parsed.y != null)
            .reduce((s, i) => s + i.parsed.y, 0);
          if (stdTotal === 0) return;
          // 実績合計（body側）と左端の見た目を揃えるための全角スペース。
          // 実績合計が表示されないチャートでは不要なため付けない
          const indent = showActualTotal ? '　' : '';
          return `${indent}標準合計: ${Math.round(stdTotal).toLocaleString('ja-JP')} h`;
        } : undefined,
      },
    };
  }

  // ① 拠点別：拠点ごとに、業務区分ごとの「標準工数(積み上げ) vs 実績工数」を1チャートで表示（従来通り）
  function renderCompareSiteView() {
    const content = document.getElementById('compare-content');
    let html = '';
    availSites.forEach(site => {
      const siteColor = SITE_COLORS[site] || '#fff';
      html += `<div>
        <div class="schart-header" style="color:${siteColor}">${site}</div>`;
      divs.forEach(div => {
        html += `<div class="schart-section">
          <div class="schart-header">${div}
            <span style="font-weight:400;font-size:0.8rem;color:var(--muted)"> 標準 vs 実績（h）</span>
          </div>
          ${chartWrapHtml(`cmp-${site}-${div}`, commonMonths.length, { heightPx: 320, inlineHeight: true })}
        </div>`;
      });
      html += `</div>`;
    });
    content.innerHTML = html;

    // フィルター適用後のデータをもとに、ページ内の全拠点グラフでdivごとに共通の軸上限を算出
    const divYMax = {};
    divs.forEach(div => {
      const valueArrays = availSites.map(site => {
        const d = window._cmpChartData[`${site}-${div}`];
        if (!d) return [];
        return commonMonths.flatMap((m, mi) => {
          const stdTotal = d.divRows.reduce((s, r) => {
            const res = calcRow(site, r, mi);
            return s + (res.h !== null ? res.h : 0);
          }, 0);
          return [stdTotal, d.actualH[mi]];
        });
      });
      divYMax[div] = computeSharedAxisMax(valueArrays, 100);
    });

    availSites.forEach(site => {
      divs.forEach(div => {
        const key = `${site}-${div}`;
        const d = window._cmpChartData[key];
        const ctx = document.getElementById(`cmp-${key}`)?.getContext('2d');
        if (!d || !ctx) return;

        const { divRows, actualH } = d;
        const datasets = [];

        // 実績工数バー（左）
        datasets.push({
          type: 'bar',
          label: '実績工数',
          data: actualH,
          backgroundColor: '#f8717199',
          borderColor: '#f87171',
          borderWidth: 1,
          stack: 'actual',
          yAxisID: 'y',
          order: 1,
        });

        // 標準工数の積み上げバー（右・タスク別）
        divRows.forEach((r, ri) => {
          const data = commonMonths.map((m, mi) => {
            const res = calcRow(site, r, mi);
            return res.h !== null ? Math.round(res.h * 10) / 10 : null;
          });
          datasets.push({
            type: 'bar',
            label: r.task,
            data,
            backgroundColor: TASK_COLORS[ri % TASK_COLORS.length] + 'cc',
            borderColor: TASK_COLORS[ri % TASK_COLORS.length],
            borderWidth: 0,
            stack: 'std',
            yAxisID: 'y',
            order: 2,
            _stdGroup: true,
          });
        });

        const opts = {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { labels: { color: '#8892a4', font: { size: 10 }, boxWidth: 10, padding: 6 } },
            tooltip: tooltipOpts(true),
          },
          scales: {
            x: { stacked: true, ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e2235' } },
            y: {
              stacked: true,
              position: 'left',
              ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} h` },
              grid: { color: '#1e2235' }, suggestedMin: 0,
              max: divYMax[div],
              title: { display: true, text: 'h', color: '#8892a4', font: { size: 10 } },
            },
          },
        };

        compareChartInstances[key] = new Chart(ctx, { data: { labels: commonMonths, datasets }, options: opts });
      });
    });
  }

  // ② 拠点サマリ：業務区分ごとに「実績工数（拠点別）」と「標準工数（工程別・3拠点合計）」を並べて表示
  function renderCompareSummaryView() {
    const content = document.getElementById('compare-content');
    let html = `<div class="schart-header">3拠点サマリ</div>`;
    divs.forEach(div => {
      html += `<div class="schart-section">
        <div class="schart-header">${div} <span style="font-weight:400;font-size:0.8rem;color:var(--muted)"> 実績工数（拠点別） / 標準工数（工程別・3拠点合計）</span></div>
        <div class="chart-section-label" style="padding-top:0;margin-bottom:6px">標準 vs 実績（統合・拠点別×工程別）</div>
        ${chartWrapHtml(`cmpsum-${div}-combined`, commonMonths.length, { heightPx: 320, inlineHeight: true })}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div><div class="chart-section-label" style="padding-top:0;margin-bottom:6px">実績工数（拠点別）</div>${chartWrapHtml(`cmpsum-${div}-actual`, commonMonths.length, { heightPx: 320, inlineHeight: true })}</div>
          <div><div class="chart-section-label" style="padding-top:0;margin-bottom:6px">標準工数（工程別・3拠点合計）</div>${chartWrapHtml(`cmpsum-${div}-std`, commonMonths.length, { heightPx: 320, inlineHeight: true })}</div>
        </div>
      </div>`;
    });
    content.innerHTML = html;

    divs.forEach(div => {
      const divRows = rows.filter(r => r.div === div);

      // 実績工数：拠点ごとの値
      const actualBySite = availSites.map(site => window._cmpChartData[`${site}-${div}`]?.actualH || commonMonths.map(() => null));
      // 標準工数：工程ごとの3拠点合計
      const stdByTask = divRows.map(r => commonMonths.map((m, mi) => {
        const total = availSites.reduce((s, site) => {
          const res = calcRow(site, r, mi);
          return s + (res.h !== null ? res.h : 0);
        }, 0);
        return total > 0 ? Math.round(total * 10) / 10 : null;
      }));

      // 実績（拠点別）・標準（工程別・積み上げ合計）を、同じdiv内で比較しやすいよう軸を統一。
      // 統合チャートでは実績工数も3拠点分が積み上げ表示されるため、拠点ごとの個別値ではなく
      // 月ごとに拠点を跨いで合計した値（実際にグラフ上で到達する高さ）で軸MAXを判定する
      const actualMonthlyTotals = commonMonths.map((_, mi) => actualBySite.reduce((s, arr) => s + (arr[mi] || 0), 0));
      const stdMonthlyTotals = commonMonths.map((_, mi) => stdByTask.reduce((s, data) => s + (data[mi] || 0), 0));
      const sharedMax = computeSharedAxisMax([actualMonthlyTotals, stdMonthlyTotals], 100);

      const actualCtx = document.getElementById(`cmpsum-${div}-actual`)?.getContext('2d');
      if (actualCtx) {
        compareChartInstances[`${div}-actual`] = new Chart(actualCtx, {
          type: 'bar',
          data: {
            labels: commonMonths,
            datasets: availSites.map((site, si) => ({
              label: site,
              data: actualBySite[si],
              backgroundColor: (SITE_COLORS[site] || '#fff') + '99',
              borderColor: SITE_COLORS[site] || '#fff',
              borderWidth: 1,
              _actualGroup: true,
            })),
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { labels: { color: '#8892a4', font: { size: 10 }, boxWidth: 10, padding: 6 } },
              tooltip: tooltipOpts(false, true),
            },
            scales: {
              x: { ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e2235' } },
              y: {
                position: 'left',
                ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} h` },
                grid: { color: '#1e2235' }, suggestedMin: 0, max: sharedMax,
                title: { display: true, text: 'h', color: '#8892a4', font: { size: 10 } },
              },
            },
          },
        });
      }

      const stdCtx = document.getElementById(`cmpsum-${div}-std`)?.getContext('2d');
      if (stdCtx) {
        compareChartInstances[`${div}-std`] = new Chart(stdCtx, {
          type: 'bar',
          data: {
            labels: commonMonths,
            datasets: divRows.map((r, ri) => ({
              label: r.task,
              data: stdByTask[ri],
              backgroundColor: TASK_COLORS[ri % TASK_COLORS.length] + 'cc',
              borderColor: TASK_COLORS[ri % TASK_COLORS.length],
              borderWidth: 0,
              stack: 'std',
              _stdGroup: true,
            })),
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { labels: { color: '#8892a4', font: { size: 10 }, boxWidth: 10, padding: 6 } },
              tooltip: tooltipOpts(true, false),
            },
            scales: {
              x: { stacked: true, ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e2235' } },
              y: {
                stacked: true, position: 'left',
                ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} h` },
                grid: { color: '#1e2235' }, suggestedMin: 0, max: sharedMax,
                title: { display: true, text: 'h', color: '#8892a4', font: { size: 10 } },
              },
            },
          },
        });
      }

      // 統合グラフ：①拠点別サブタブと同じ形式（左＝実績工数を拠点別に積み上げ、右＝標準工数を工程別に積み上げ）
      const combinedCtx = document.getElementById(`cmpsum-${div}-combined`)?.getContext('2d');
      if (combinedCtx) {
        const datasets = [];
        availSites.forEach((site, si) => {
          datasets.push({
            type: 'bar',
            label: site,
            data: actualBySite[si],
            backgroundColor: (SITE_COLORS[site] || '#fff') + 'cc',
            borderColor: SITE_COLORS[site] || '#fff',
            borderWidth: 0,
            stack: 'actual',
            order: 1,
            _actualGroup: true,
          });
        });
        divRows.forEach((r, ri) => {
          datasets.push({
            type: 'bar',
            label: r.task,
            data: stdByTask[ri],
            backgroundColor: TASK_COLORS[ri % TASK_COLORS.length] + 'cc',
            borderColor: TASK_COLORS[ri % TASK_COLORS.length],
            borderWidth: 0,
            stack: 'std',
            order: 2,
            _stdGroup: true,
          });
        });

        compareChartInstances[`${div}-combined`] = new Chart(combinedCtx, {
          data: { labels: commonMonths, datasets },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { labels: { color: '#8892a4', font: { size: 10 }, boxWidth: 10, padding: 6 } },
              tooltip: tooltipOpts(true, true),
            },
            scales: {
              x: { stacked: true, ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e2235' } },
              y: {
                stacked: true, position: 'left',
                ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} h` },
                grid: { color: '#1e2235' }, suggestedMin: 0, max: sharedMax,
                title: { display: true, text: 'h', color: '#8892a4', font: { size: 10 } },
              },
            },
          },
        });
      }
    });
  }

  function renderCompareContent() {
    destroyCompareCharts();
    if (compareSubtab === 'summary') renderCompareSummaryView();
    else renderCompareSiteView();
  }

  main.innerHTML = `
    <div class="compare-shell">
      <div class="compare-header-row">
        <div class="chart-section-label">📊 標準工数 vs 実績工数 比較　<span style="font-size:0.72rem;font-weight:400;color:var(--muted)">※ 左棒(赤) = 実績工数　右棒(積み上げ) = 標準工数（タスク別）</span></div>
        <div class="transfer-toggle" id="compare-subtabs">
          <button class="transfer-toggle-btn${compareSubtab === 'site' ? ' active' : ''}" data-tab="site">拠点別</button>
          <button class="transfer-toggle-btn${compareSubtab === 'summary' ? ' active' : ''}" data-tab="summary">拠点サマリ</button>
        </div>
      </div>
      <div id="compare-content"></div>
    </div>`;

  document.querySelectorAll('#compare-subtabs .transfer-toggle-btn').forEach(btn => {
    btn.onclick = () => {
      compareSubtab = btn.dataset.tab;
      document.querySelectorAll('#compare-subtabs .transfer-toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCompareContent();
      saveSessionState();
    };
  });

  renderCompareContent();
}

/* ── 比較（3拠点）タブ ──────────────────────────────────────────
   Stage 0：タブの枠組みと「実績工数（拠点別、時間）」の棒グラフ単体のみを実装
   する。トグル切り替え・折れ線オーバーレイは後続のStageで実装する予定 */
let compareSiteChartInstance = null;
let compareSiteCountChartInstance = null;
let compareSiteStdHoursChartInstance = null;

function renderCompareSiteTab() {
  const main = document.getElementById('main');
  if (!allData) { main.innerHTML = '<div class="error-msg">勤務データが未ロードです</div>'; return; }
  // ●マーカー（標準工数・標準労働時間）用にcalcRow()が必要な生産実績データを取得する。
  // 取得に失敗しても実績工数・人数チャート自体は表示できるよう、失敗時はprodData=nullで
  // 続行し、●マーカーのみ非表示にする
  Promise.all([fetchProductionSheet().catch(e => { console.error('[比較（3拠点）] 生産実績データ取得エラー:', e); return null; }), loadStdSettingsSheetOnce().catch(() => null)])
    .then(([prodData]) => { renderCompareSiteCharts(prodData); });
}

function renderCompareSiteCharts(prodData) {
  const main = document.getElementById('main');
  const { employees } = getActiveData();
  const { months: commonMonths, originalCount } = getExtendedDisplayMonths();
  const availSites = Object.keys(SITE_COLORS);

  // 画面上部の業務区分チェックボックス（roleTypeFilter）に応じて対象divを動的に
  // 決定する（比較（繁忙期見込み）タブの拠点サマリ等と同じロジック）
  const divs = [];
  if (roleTypeFilter.has('栽培')) divs.push('栽培');
  if (roleTypeFilter.has('出荷')) divs.push('出荷');
  if (roleTypeFilter.has('配送・栽培') || roleTypeFilter.has('配送・出荷')) divs.push('配送');

  // 雇用形態（empTypeFilter）はgetActiveData()内で既に反映済み。
  // empFilterで社員＋技能実習生（下段）／アルバイト（上段）をさらに絞り込む
  function workHours(site, typeFilter, empFilter) {
    const emps = employees.filter(e => e.base === site && e.workType && typeFilter(e.workType) && empFilter(e));
    return commonMonths.map((_, mi) => {
      if (mi >= originalCount) return null;
      const total = emps.reduce((s, e) => s + (e.hours[mi] ?? 0), 0);
      return total > 0 ? Math.round(total * 10) / 10 : null;
    });
  }

  const isPartTime = e => (e.employment || '').includes('アルバイト');

  // 拠点ごとに、選択中のdivsに対応する実績工数を合算する
  // （雇用形態で下段＝社員＋技能実習生／上段＝アルバイトに分割する）
  function actualBySiteFor(empFilter) {
    return availSites.map(site => {
      const perDiv = divs.map(div => {
        const typeFilter = div === '栽培'
          ? wt => workTypeClass(wt) === 'wt-栽培'
          : div === '配送'
            ? wt => workTypeClass(wt) === 'wt-配送'
            : wt => workTypeClass(wt) === 'wt-出荷';
        return workHours(site, typeFilter, empFilter);
      });
      return commonMonths.map((_, mi) => {
        const total = perDiv.reduce((s, arr) => s + (arr[mi] || 0), 0);
        return total > 0 ? Math.round(total * 10) / 10 : null;
      });
    });
  }
  const lowerBySite = actualBySiteFor(e => !isPartTime(e));
  const upperBySite = actualBySiteFor(e => isPartTime(e));

  // 拠点ごとに、選択中のdivsのいずれかに該当し、対象月に工数実績がある人数をカウントする
  // （雇用形態で下段＝社員＋技能実習生／上段＝アルバイトに分割する）
  function countBySiteFor(empFilter) {
    return availSites.map(site => {
      return commonMonths.map((_, mi) => {
        if (mi >= originalCount) return null;
        const n = employees.filter(e =>
          e.base === site &&
          e.workType &&
          empFilter(e) &&
          divs.some(div => {
            const cls = div === '栽培' ? 'wt-栽培' : div === '配送' ? 'wt-配送' : 'wt-出荷';
            return workTypeClass(e.workType) === cls;
          }) &&
          e.hours[mi] !== null
        ).length;
        return n > 0 ? n : null;
      });
    });
  }
  const lowerCountBySite = countBySiteFor(e => !isPartTime(e));
  const upperCountBySite = countBySiteFor(e => isPartTime(e));

  // ●マーカー①：標準工数（拠点別）。既存の予定標準工数と同じロジック
  // （loadYojitsuStdSettings()/createStdHoursEngine()のcalcRow()）を使う。
  // 雇用形態フィルタは適用しない（既存の予定標準工数と同じ理由）
  let stdTaskBySite = null;
  // ●マーカー②：標準労働時間（拠点別、過去分のみ）。既存の
  // computeStdHoursLineForDivSite()と同じロジックで、雇用形態フィルタは
  // getActiveData()経由で自動的に反映される。未来月はcomputeStdHoursLineForDivSite()
  // が自然にnullを返すため、空欄のままになる。
  // computeStdHoursLineForDivSite()内部は、渡されたmonths配列の各要素をそのまま
  // 「正規化済み（"2026/4"形式）」の値として扱い、activeMonths側だけをnormalizeMonth()
  // で正規化して比較する。commonMonths（"2026年4月"形式の表示用ラベル）をそのまま渡すと
  // 一致しないため、事前にnormalizeMonth()を適用してから渡す
  const normalizedCommonMonths = commonMonths.map(normalizeMonth);
  const stdHoursBySite = availSites.map(site => {
    const perDiv = divs.map(div => computeStdHoursLineForDivSite(div, site, normalizedCommonMonths));
    return commonMonths.map((_, mi) => {
      const total = perDiv.reduce((s, arr) => s + (arr[mi] || 0), 0);
      return total > 0 ? Math.round(total * 10) / 10 : null;
    });
  });
  if (prodData) {
    const { months: prodMonths, records } = prodData;
    const stdSettingRows = loadYojitsuStdSettings();
    const stdConv = loadYojitsuCsConv();
    const { calcRow } = createStdHoursEngine(records, prodMonths, commonMonths, originalCount, stdConv);
    const stdRowsFiltered = stdSettingRows.filter(r => divs.includes(r.div));
    stdTaskBySite = availSites.map(site => commonMonths.map((_, mi) => {
      const total = stdRowsFiltered.reduce((s, r) => {
        const res = calcRow(site, r, mi);
        return s + (res.h !== null ? res.h : 0);
      }, 0);
      return total > 0 ? Math.round(total * 10) / 10 : null;
    }));
  }

  // 「人数」ビュー用：標準工数・標準労働時間（時間）を「実績の1人当たり時間
  // （実績工数÷実績人数）」を基準に人数換算する。「◯h相当をこなすには何人相当
  // 必要か」という値になる
  function toCount(hoursVal, si, mi) {
    const actualH = (lowerBySite[si][mi] || 0) + (upperBySite[si][mi] || 0);
    const actualN = (lowerCountBySite[si][mi] || 0) + (upperCountBySite[si][mi] || 0);
    if (hoursVal == null || actualH <= 0 || actualN <= 0) return null;
    const avgPerPerson = actualH / actualN;
    if (avgPerPerson <= 0) return null;
    const result = hoursVal * actualN / actualH;
    return Math.round(result * 10) / 10;
  }
  const stdTaskCountBySite = availSites.map((_, si) => commonMonths.map((_, mi) =>
    stdTaskBySite ? toCount(stdTaskBySite[si][mi], si, mi) : null));
  const stdHoursCountBySite = availSites.map((_, si) => commonMonths.map((_, mi) =>
    toCount(stdHoursBySite[si][mi], si, mi)));

  // 「標準労働時間」ビュー用：雇用形態別（社員+実習生／アルバイト）の標準労働時間。
  // computeStdHoursLineForDivSite()自体は変更せず、同じロジック（3拠点マージのR列を
  // 氏名突き合わせで合計）にempFilterを追加したローカル版を使う
  function computeStdHoursLineForDivSiteEmpFilter(div, site, months, empFilter) {
    const { employees: activeEmployees, months: activeMonths } = getActiveData();
    const typeFilter = div === '栽培'
      ? wt => workTypeClass(wt) === 'wt-栽培'
      : div === '配送'
        ? wt => workTypeClass(wt) === 'wt-配送'
        : wt => workTypeClass(wt) === 'wt-出荷';
    const emps = activeEmployees
      .filter(e => typeFilter(e.workType) && (site == null || e.base === site) && empFilter(e))
      .map(e => ({
        ...e,
        hours: months.map(planMonth => {
          const ami = activeMonths.findIndex(m => normalizeMonth(m) === planMonth);
          return ami >= 0 ? e.hours[ami] : null;
        }),
      }));
    return computeStdHoursLine(emps, months);
  }
  function stdHoursBySiteFor(empFilter) {
    return availSites.map(site => {
      const perDiv = divs.map(div => computeStdHoursLineForDivSiteEmpFilter(div, site, normalizedCommonMonths, empFilter));
      return commonMonths.map((_, mi) => {
        const total = perDiv.reduce((s, arr) => s + (arr[mi] || 0), 0);
        return total > 0 ? Math.round(total * 10) / 10 : null;
      });
    });
  }
  const lowerStdHoursBySite = stdHoursBySiteFor(e => !isPartTime(e));
  const upperStdHoursBySite = stdHoursBySiteFor(e => isPartTime(e));

  // 「標準労働時間」タブの棒：アルバイト段をフルタイム／パートタイムに細分化する。
  // 3拠点マージのM列（フルタイム）・Q列（パートタイム）を対象に、B=1（稼働中）または
  // B=2＋I列（開始月）以降を対象にする。既存のthreeSiteMergeStdHoursByName()（R列版、
  // B=1のみ）は今回のスコープ外のため変更しない。月ごとの判定が必要なため、氏名→値の
  // フラットなMapではなく、氏名→行配列のMapと、月（ym）を渡して値を計算する関数に分ける
  function buildFulltimePartTimeRowsByName() {
    const map = new Map();
    if (!stdHoursMergeData) return map;
    stdHoursMergeData.rows.forEach(r => {
      if (r.activeFlag !== 1 && r.activeFlag !== 2) return;
      const key = normalizeName(r.name);
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(r);
    });
    return map;
  }
  function valueForNameAndMonth(rowsByName, name, ym, field) {
    const rows = rowsByName.get(normalizeName(name));
    if (!rows) return 0;
    return rows.reduce((sum, r) => {
      if (r.activeFlag === 1) return sum + (r[field] || 0);
      if (r.activeFlag === 2 && r.startYm != null && ym >= r.startYm) return sum + (r[field] || 0);
      return sum;
    }, 0);
  }
  function monthToYm(month) {
    const [y, m] = month.split('/').map(Number);
    return y * 100 + m;
  }
  // computeStdHoursLine()と同じ集計ロジックだが、参照するマップ（氏名→行配列）と
  // 月ごとのB=2判定に対応させた汎用版（既存のcomputeStdHoursLine()自体は変更しない）
  function computeStdHoursLineByMap(emps, months, rowsByName, field) {
    return months.map((month, mi) => {
      const ym = monthToYm(month);
      const vals = emps
        .filter(e => e.hours[mi] !== null && !e.isTransferVirtual)
        .map(e => valueForNameAndMonth(rowsByName, e.name, ym, field));
      if (!vals.length) return null;
      return Math.round(vals.reduce((s, v) => s + v, 0) * 10) / 10;
    });
  }
  // 同じ対象従業員のうち、該当月に実際に値（0より大きい）を持つ人数だけを数える
  function computeStdHoursCountByMap(emps, months, rowsByName, field) {
    return months.map((month, mi) => {
      const ym = monthToYm(month);
      const n = emps
        .filter(e => e.hours[mi] !== null && !e.isTransferVirtual)
        .filter(e => valueForNameAndMonth(rowsByName, e.name, ym, field) > 0)
        .length;
      return n > 0 ? n : null;
    });
  }
  // computeStdHoursLineForDivSiteEmpFilter()と同じ従業員絞り込みロジックを、
  // 値集計（computeStdHoursLineByMap）・人数集計（computeStdHoursCountByMap）の
  // どちらにも使えるようにしたもの
  function stdHoursEmpsForDivSite(div, site, months, empFilter) {
    const { employees: activeEmployees, months: activeMonths } = getActiveData();
    const typeFilter = div === '栽培'
      ? wt => workTypeClass(wt) === 'wt-栽培'
      : div === '配送'
        ? wt => workTypeClass(wt) === 'wt-配送'
        : wt => workTypeClass(wt) === 'wt-出荷';
    return activeEmployees
      .filter(e => typeFilter(e.workType) && (site == null || e.base === site) && empFilter(e))
      .map(e => ({
        ...e,
        hours: months.map(planMonth => {
          const ami = activeMonths.findIndex(m => normalizeMonth(m) === planMonth);
          return ami >= 0 ? e.hours[ami] : null;
        }),
      }));
  }
  function stdHoursBySiteForMap(rowsByName, field) {
    return availSites.map(site => {
      const perDiv = divs.map(div => computeStdHoursLineByMap(stdHoursEmpsForDivSite(div, site, normalizedCommonMonths, e => isPartTime(e)), normalizedCommonMonths, rowsByName, field));
      return commonMonths.map((_, mi) => {
        const total = perDiv.reduce((s, arr) => s + (arr[mi] || 0), 0);
        return total > 0 ? Math.round(total * 10) / 10 : null;
      });
    });
  }
  function stdHoursCountBySiteForMap(rowsByName, field) {
    return availSites.map(site => {
      const perDiv = divs.map(div => computeStdHoursCountByMap(stdHoursEmpsForDivSite(div, site, normalizedCommonMonths, e => isPartTime(e)), normalizedCommonMonths, rowsByName, field));
      return commonMonths.map((_, mi) => {
        const total = perDiv.reduce((s, arr) => s + (arr[mi] || 0), 0);
        return total > 0 ? total : null;
      });
    });
  }
  const fulltimePartTimeRowsByName = buildFulltimePartTimeRowsByName();
  const fulltimeStdHoursBySite = stdHoursBySiteForMap(fulltimePartTimeRowsByName, 'fulltimeHours');
  const parttimeStdHoursBySite = stdHoursBySiteForMap(fulltimePartTimeRowsByName, 'parttimeHours');
  const fulltimeCountBySite = stdHoursCountBySiteForMap(fulltimePartTimeRowsByName, 'fulltimeHours');
  const parttimeCountBySite = stdHoursCountBySiteForMap(fulltimePartTimeRowsByName, 'parttimeHours');

  // 「標準労働時間」ビュー用の折れ線：標準労働時間（下段+上段合計）を実績人数
  // （下段+上段合計）で割った「一人当たりの時間」
  function toPerPerson(hoursTotal, si, mi) {
    const actualN = (lowerCountBySite[si][mi] || 0) + (upperCountBySite[si][mi] || 0);
    if (hoursTotal == null || actualN <= 0) return null;
    return Math.round((hoursTotal / actualN) * 10) / 10;
  }
  const perPersonStdHoursBySite = availSites.map((_, si) => commonMonths.map((_, mi) => {
    const total = (lowerStdHoursBySite[si][mi] || 0) + (upperStdHoursBySite[si][mi] || 0);
    return toPerPerson(total > 0 ? total : null, si, mi);
  }));

  main.innerHTML = `
    <div class="compare-shell">
      <div class="compare-header-row">
        <div class="chart-section-label">📊 比較（3拠点）</div>
        <div class="transfer-toggle" id="comparesite-view-toggle">
          <button class="transfer-toggle-btn${compareSiteViewMode === 'time' ? ' active' : ''}" data-tab="time">時間</button>
          <button class="transfer-toggle-btn${compareSiteViewMode === 'count' ? ' active' : ''}" data-tab="count">人数</button>
          <button class="transfer-toggle-btn${compareSiteViewMode === 'stdhours' ? ' active' : ''}" data-tab="stdhours">標準労働時間</button>
        </div>
      </div>
      ${compareSiteViewMode === 'time' ? `
      <div class="schart-section">
        <div class="schart-header">実績工数（拠点別、時間）</div>
        ${chartWrapHtml('comparesite-actual', commonMonths.length, { heightPx: 400, inlineHeight: true })}
      </div>` : compareSiteViewMode === 'count' ? `
      <div class="schart-section">
        <div class="schart-header">実績工数（拠点別、人数）</div>
        ${chartWrapHtml('comparesite-count', commonMonths.length, { heightPx: 400, inlineHeight: true })}
      </div>` : `
      <div class="schart-section">
        <div class="schart-header">標準労働時間（拠点別、雇用形態別・一人当たり）</div>

            backgroundColor: '#1e2235', borderColor: '#3a3f5c', borderWidth: 1,
            titleColor: '#e2e8f0', bodyColor: '#e2e8f0',
            filter: item => !isStdHoursBarHidden(item.dataset),
            callbacks: {
              label: ctx => {
                const v = ctx.parsed.y;
                if (v === null || v === undefined) return null;
                const ds = ctx.dataset;
                const countSuffix = ds._countBySite ? ` / ${(ds._countBySite[ctx.dataIndex] || 0).toLocaleString('ja-JP')}人` : '';
                if (ds._empSegment === 'lower') return `${ds._site}(社員+実習生): ${v.toLocaleString('ja-JP')} h${countSuffix}`;
                if (ds._empSegment === 'fulltime') return `${ds._site}(アルバイト・フルタイム): ${v.toLocaleString('ja-JP')} h${countSuffix}`;
                if (ds._empSegment === 'parttime') return `${ds._site}(アルバイト・パートタイム): ${v.toLocaleString('ja-JP')} h${countSuffix}`;
                if (ds._perPerson) return `${ds.label}: ${v.toLocaleString('ja-JP')} h/人`;
                return `${ds.label}: ${v.toLocaleString('ja-JP')}`;
              },
            },
          },
        },
        scales: {
          x: { ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e2235' } },
          y: {
            position: 'left',
            ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} h` },
            grid: { color: '#1e2235' }, suggestedMin: 0,
            title: { display: true, text: 'h', color: '#8892a4', font: { size: 10 } },
          },
          y1: {
            position: 'right',
            ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} h/人` },
            grid: { display: false }, suggestedMin: 0,
            title: { display: true, text: 'h/人', color: '#8892a4', font: { size: 10 } },
          },
        },
      },
      // 各バーセグメント（下段/中段/上段）の中央に、既存の_countBySite（ツールチップに
      // 既に表示済みの人数）を描画する。chartjs-plugin-datalabelsは読み込まれていない
      // ため、このプロジェクトで既存のsiteStdMarkerAlign等と同じ「独自プラグインで
      // 手動描画」方式（afterDatasetsDraw）で実装する
      plugins: [{
        id: 'stdHoursSegmentCounts',
        afterDatasetsDraw(chart) {
          const ctx = chart.ctx;
          chart.data.datasets.forEach((ds, dsIndex) => {
            if (!ds._countBySite) return;
            if (isStdHoursBarHidden(ds)) return;
            const meta = chart.getDatasetMeta(dsIndex);
            meta.data.forEach((bar, mi) => {
              const count = ds._countBySite[mi];
              if (!count) return;
              const val = ds.data[mi];
              if (val == null) return;
              // セグメントが小さすぎる場合は文字を描画しない（読みづらい重なりを避ける）
              if (bar.height < 15) return;
              ctx.save();
              ctx.font = '10px sans-serif';
              ctx.fillStyle = '#ffffff';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(`${count}`, bar.x, bar.y + bar.height / 2);
              ctx.restore();
            });
          });
        },
      }],
    });
  }
}

/* ── 要員計画タブ ──────────────────────────────────────────── */
// Stage 0：表示レイアウトのみ。GAS側で60日サイクルモデル＋菌床数重み付けにより
// コンテナ数を算出し、ファーム勤務時間ファイル内「整理済み_計画_更新」シートに
// 書き込む新方式に移行することになったため、旧・ダッシュボード側でgvizから
// 「26/生産計画」を直接読み込んで計算する実装は廃止した。
// 実データ取得（「整理済み_計画_更新」シートの読み込み）は後続のStageで実装する

let staffplanGranularity = 'monthly'; // 'monthly' | 'daily'（Stage 7で実装予定。Stage 0時点では見た目のみ）

/* ── 26/12向け計画タブ ────────────────────────────────────────────
   表1（勤務時間）・表2（人数）を拠点×指標で表示する。
   「新加入見込み」「残業込み時間」はユーザーが編集可能なセルとして実装。 */

// 26/12向け計画タブの編集可能値（セッション中メモリに保持）
let decPlanInputs = {};

function renderDecPlanTab() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">データを計算中...</div>';
  Promise.all([fetchPlanSheet(), loadStdSettingsSheetOnce(), fetchThreeSiteMergeSheet()])
    .then(([planData, , mergeData]) => { renderDecPlanContent(planData, mergeData); })
    .catch(e => {
      main.innerHTML = `<div class="error-msg">データ取得エラー: ${e.message}</div>`;
    });
}

function renderDecPlanContent(planData, mergeData) {
  const main = document.getElementById('main');
  const { employees, months: activeMonths } = getActiveData();
  const { months: planMonths, records: planRecords } = planData;
  const stdRows = loadYojitsuStdSettings();
  const conv = loadYojitsuCsConv();
  const originalCount = planMonths.length;
  const engine = createStdHoursEngine(planRecords, planMonths, planMonths, originalCount, conv, null, '実数計画');

  const SITES_ORD = ['いなべ', '群馬', '南丹'];
  const JUN = '2026/6';
  const DEC = '2026/12';
  const junIdx = planMonths.indexOf(JUN);
  const decIdx = planMonths.indexOf(DEC);
  // 3拠点マージのmaxByYm（年月ラベルを動的に検索して構築された月別列）用のキー。
  // DECの数値表現（YYYYMM）を1箇所だけで算出し、overtimeH/overtimeNから参照する
  const [decY, decM] = DEC.split('/').map(Number);
  const DECPLAN_TARGET_YM = decY * 100 + decM;

  // 画面上部の業務区分チェックボックス（roleTypeFilter）から動的に決定した対象div配列
  const divs = [];
  if (roleTypeFilter.has('栽培')) divs.push('栽培');
  if (roleTypeFilter.has('出荷')) divs.push('出荷');
  if (roleTypeFilter.has('配送・栽培') || roleTypeFilter.has('配送・出荷')) divs.push('配送');

  // ①6月実績：栽培・出荷・配送
  function junActualH(site) {
    const ami = activeMonths.findIndex(m => normalizeMonth(m) === JUN);
    if (ami < 0) return null;
    const wc = workTypeClass;
    const total = employees
      .filter(e => e.base === site && ((divs.includes('栽培') && wc(e.workType) === 'wt-栽培') || (divs.includes('出荷') && wc(e.workType) === 'wt-出荷') || (divs.includes('配送') && wc(e.workType) === 'wt-配送')))
      .reduce((s, e) => s + (e.hours[ami] ?? 0), 0);
    return total > 0 ? Math.round(total * 10) / 10 : null;
  }

  // ①6月人数：栽培・出荷・配送
  function junActualN(site) {
    const ami = activeMonths.findIndex(m => normalizeMonth(m) === JUN);
    if (ami < 0) return null;
    const wc = workTypeClass;
    return employees.filter(e => e.base === site &&
      ((divs.includes('栽培') && wc(e.workType) === 'wt-栽培') || (divs.includes('出荷') && wc(e.workType) === 'wt-出荷') || (divs.includes('配送') && wc(e.workType) === 'wt-配送')) &&
      (e.hours[ami] ?? 0) > 0).length || null;
  }

  // 人数表①：3拠点マージシートB=1のみの件数
  function mergeN(site) {
    if (!mergeData) return null;
    return applyEmpTypeFilter(mergeData.rows.filter(r => r.site === site && r.activeFlag === 1 && divs.includes(r.div))).length || null;
  }

  // 人数表③新加入見込み：B=2の件数
  function b2N(site) {
    if (!mergeData) return null;
    return applyEmpTypeFilter(mergeData.rows.filter(r => r.site === site && r.activeFlag === 2 && divs.includes(r.div))).length || null;
  }

  // ②標準工数合計：3拠点マージR列(栽培・出荷divのみ) per site。B列=1（稼働フラグ）の
  // 行のみを対象とし、B列=2（新規要員）の行は③新加入見込みで別途集計するため除外する
  // R列が空の行は、以前と同様この集計から除外する（②③④確認事項と同じ理由）
  function stdHoursFromMerge(site) {
    if (!mergeData) return null;
    const siteRows = applyEmpTypeFilter(mergeData.rows.filter(r => r.site === site && r.activeFlag === 1 && !r.stdHoursOriginallyEmpty && divs.includes(r.div)));
    if (!siteRows.length) return null;
    return Math.round(siteRows.reduce((s, r) => s + (r.stdHours || 0), 0) * 10) / 10;
  }

  // ③新加入見込み工数：3拠点マージシートのB列=2（新規要員）行のR列（標準労働時間）
  // 合計から動的に算出する（固定人数計画は撤廃）
  function newHireH(site) {
    if (!mergeData) return null;
    const rows = applyEmpTypeFilter(mergeData.rows.filter(r => r.site === site && r.activeFlag === 2 && divs.includes(r.div)));
    if (!rows.length) return null;
    return Math.round(rows.reduce((s, r) => s + (r.stdHours || 0), 0) * 10) / 10;
  }

  // ③新加入見込み人数：3拠点マージシートのB列=2（新規要員）行の件数から動的に算出する
  function newHireN(site) {
    if (!mergeData) return null;
    return applyEmpTypeFilter(mergeData.rows.filter(r => r.site === site && r.activeFlag === 2 && divs.includes(r.div))).length || null;
  }

  // ④残業見込み工数：3拠点マージ DECPLAN_TARGET_YM列（maxByYm）の合計 per site
  // （栽培・出荷div）。以前はX列という固定列位置を参照していたが、シート構成の変更
  // （開始月列の追加等）で実際の「2026/12」列とズレる不具合があったため、比較
  // （繁忙期見込み）タブのthreeSiteMergeAgg()と同じ「年月ラベルで動的に列を検索する」
  // maxByYmを使う方式に統一した。R列（標準労働時間）が空の行は、以前と同様この集計
  // から除外する（R列が空でも集計対象に含める仕様変更は、比較（繁忙期見込み）タブ側
  // の上乗せ分計算のみが対象）。
  // なお、3拠点マージシートのT列以降（maxByYm）は「R列＋増減」から「増減のみ」に
  // 意味が変わったため（比較（繁忙期見込み）タブの3段積み上げ化に伴う変更）、v自体が
  // 既に増減そのものを表す。R列を引く処理・0クリップは不要（減員等でvが負の場合も
  // そのまま反映する）
  function overtimeH(site) {
    if (!mergeData) return null;
    const siteRows = applyEmpTypeFilter(mergeData.rows.filter(r => r.site === site && !r.stdHoursOriginallyEmpty && divs.includes(r.div)));
    if (!siteRows.length) return null;
    let total = 0;
    siteRows.forEach(r => {
      const v = r.maxByYm[DECPLAN_TARGET_YM];
      if (typeof v === 'number') total += v;
    });
    return Math.round(total * 10) / 10;
  }

  // ④残業見込み人数：DECPLAN_TARGET_YM列 > R列 の人数 per site
  function overtimeN(site) {
    if (!mergeData) return null;
    return mergeData.rows.filter(r =>
      r.site === site && !r.stdHoursOriginallyEmpty && typeof r.maxByYm[DECPLAN_TARGET_YM] === 'number' && r.maxByYm[DECPLAN_TARGET_YM] > r.stdHours
    ).length || null;
  }

  // ⑥12月標準工数時間：生産計画エンジンから算出
  function stdHoursForMonth(site, mi) {
    if (mi < 0) return null;
    const divRows = stdRows.filter(r => divs.includes(r.div));
    if (!divRows.length) return null;
    let total = 0, hasVal = false;
    divRows.forEach(r => {
      const res = engine.calcRow(site, r, mi);
      if (res.h !== null) { total += res.h; hasVal = true; }
    });
    return hasVal ? Math.round(total * 10) / 10 : null;
  }

  function fmtH(v) { return v === null || v === undefined ? '—' : v.toLocaleString('ja-JP', { maximumFractionDigits: 1 }) + ' h'; }
  function fmtN(v) { return v === null || v === undefined ? '—' : v + ' 名'; }
  function fmtDiff(v) {
    if (v === null || v === undefined) return '<span style="color:var(--muted)">—</span>';
    const color = v >= 0 ? '#4ade80' : '#f87171';
    const sign = v >= 0 ? '+' : '';
    return `<span style="color:${color};font-weight:600">${sign}${v.toLocaleString('ja-JP', { maximumFractionDigits: 1 })} h</span>`;
  }
  function fmtDiffN(v) {
    if (v === null || v === undefined) return '<span style="color:var(--muted)">—</span>';
    const color = v >= 0 ? '#4ade80' : '#f87171';
    const sign = v >= 0 ? '+' : '';
    return `<span style="color:${color};font-weight:600">${sign}${v} 名</span>`;
  }

  // 列ヘッダー：①〜⑦
  const COLS_H = [
    '①<br>6月勤務実績<br>(栽培・出荷・配送) h',
    '②<br>標準時間<br>(6月) h',
    '③<br>新加入見込み<br>h',
    '④<br>残業見込み<br>h',
    '⑤<br>②+③+④<br>h',
    '⑥<br>12月標準工数時間<br>h',
    '⑦<br>差分<br>⑤−⑥ h',
  ];
  const COLS_N = [
    '①<br>標準人数<br>(B=1/2) 名',
    '②<br>標準人数<br>(6月)',
    '③<br>新加入見込み<br>名',
    '④<br>残業見込み<br>名',
    '⑤<br>①+③<br>名',
    '⑥<br>12月標準人数<br>(÷173.8h)',
    '⑦<br>差分<br>⑤−⑥ 名',
  ];

  function buildTable(type) {
    const isH = type === 'h';
    const cols = isH ? COLS_H : COLS_N;
    const title = isH ? '表1　勤務時間' : '表2　人数';

    let rows = '';

    SITES_ORD.forEach(site => {
      const jun   = isH ? junActualH(site) : mergeN(site);
      const std6  = isH ? stdHoursFromMerge(site) : null; // 人数表②は空欄
      const dec   = stdHoursForMonth(site, decIdx);
      const newV  = isH ? newHireH(site) : b2N(site);
      const ovV   = isH ? overtimeH(site) : null; // 人数表④は空欄
      // 時間表⑤=②+③+④、人数表⑤=①+③
      const sum5  = isH
        ? (std6 !== null ? Math.round(((std6 || 0) + (newV || 0) + (ovV || 0)) * 10) / 10 : null)
        : (jun !== null ? Math.round(((jun || 0) + (newV || 0)) * 10) / 10 : null);
      // ⑥人数表：標準工数時間÷173.8h
      const dec6N = (dec !== null) ? Math.round(dec / 173.8) : null;
      const decVal = isH ? dec : dec6N;
      // 表1⑦（時間差分）を共通で算出し、表2⑦は表1⑦÷173.8
      const hStd6 = stdHoursFromMerge(site);
      const hNewV = newHireH(site);
      const hOvV  = overtimeH(site);
      const hSum5 = hStd6 !== null ? Math.round(((hStd6||0)+(hNewV||0)+(hOvV||0))*10)/10 : null;
      const hDiff7 = (hSum5 !== null && dec !== null) ? hSum5 - dec : null;
      const diff7 = isH
        ? (hDiff7 !== null ? Math.round(hDiff7 * 10) / 10 : null)
        : (hDiff7 !== null ? Math.round(hDiff7 / 173.8 * 10) / 10 : null);

      rows += `<tr>
        <td style="font-weight:600;color:${SITE_COLORS[site]}">${site}</td>
        <td style="text-align:right">${isH ? fmtH(jun) : fmtN(jun)}</td>
        <td style="text-align:right">${isH ? fmtH(std6) : '—'}</td>
        <td style="text-align:right">${isH
          ? (newV !== null ? newHireN(site) + '名 (' + fmtH(newV) + ')' : '—')
          : (newV !== null ? newV + ' 名' : '—')}</td>
        <td style="text-align:right;color:#facc15;font-weight:600">${isH ? fmtH(ovV) : '—'}</td>
        <td style="text-align:right;font-weight:600">${isH ? fmtH(sum5) : (sum5 !== null ? Math.round(sum5) + ' 名' : '—')}</td>
        <td style="text-align:right">${isH ? fmtH(dec) : (dec6N !== null ? dec6N + ' 名' : '—')}</td>
        <td style="text-align:center">${isH ? fmtDiff(diff7) : fmtDiffN(diff7 !== null ? Math.round(diff7) : null)}</td>
      </tr>`;
    });

    // 合計行
    const totJun  = SITES_ORD.reduce((s, site) => s + ((isH ? junActualH(site) : mergeN(site)) || 0), 0);
    const totStd6 = isH ? SITES_ORD.reduce((s, site) => s + (stdHoursFromMerge(site) || 0), 0) : 0;
    const totNew  = SITES_ORD.reduce((s, site) => s + ((isH ? newHireH(site) : b2N(site)) || 0), 0);
    const totOv   = isH ? SITES_ORD.reduce((s, site) => s + (overtimeH(site) || 0), 0) : 0;
    const totSum5 = isH
      ? Math.round((totStd6 + totNew + totOv) * 10) / 10
      : Math.round((totJun + totNew) * 10) / 10;
    const totDec  = SITES_ORD.reduce((s, site) => s + (stdHoursForMonth(site, decIdx) || 0), 0);
    const totDec6N = Math.round(totDec / 173.8);
    const totDecVal = isH ? totDec : totDec6N;
    // 表1⑦（時間差分）を基に合計行の表2⑦を計算
    const totHStd6 = SITES_ORD.reduce((s, site) => s + (stdHoursFromMerge(site) || 0), 0);
    const totHNew  = SITES_ORD.reduce((s, site) => s + (newHireH(site) || 0), 0);
    const totHOv   = SITES_ORD.reduce((s, site) => s + (overtimeH(site) || 0), 0);
    const totHSum5 = Math.round((totHStd6 + totHNew + totHOv) * 10) / 10;
    const totHDiff7 = Math.round((totHSum5 - totDec) * 10) / 10;
    const totDiff = isH
      ? Math.round((totSum5 - totDec) * 10) / 10
      : Math.round(totHDiff7 / 173.8 * 10) / 10;

    rows += `<tr style="background:var(--surface2);font-weight:600;border-top:2px solid #3a3f5c">
      <td>合計</td>
      <td style="text-align:right">${isH ? fmtH(totJun) : fmtN(totJun)}</td>
      <td style="text-align:right">${isH ? fmtH(totStd6) : '—'}</td>
      <td style="text-align:right">${isH ? fmtH(totNew) : totNew + ' 名'}</td>
      <td style="text-align:right;color:#facc15">${isH ? fmtH(Math.round(totOv * 10) / 10) : '—'}</td>
      <td style="text-align:right">${isH ? fmtH(totSum5) : Math.round(totSum5) + ' 名'}</td>
      <td style="text-align:right">${isH ? fmtH(Math.round(totDec * 10) / 10) : totDec6N + ' 名'}</td>
      <td style="text-align:center">${isH ? fmtDiff(Math.round(totDiff * 10) / 10) : fmtDiffN(totDiff !== null ? Math.round(totDiff) : null)}</td>
    </tr>`;

    return `
      <div style="margin-bottom:28px">
        <div class="chart-section-label" style="margin-bottom:8px">${title}</div>
        <div style="overflow-x:auto">
          <table class="prod-table" style="min-width:860px;border-collapse:collapse">
            <thead><tr>
              <th class="th-left" style="min-width:70px">拠点</th>
              ${cols.map(c => `<th style="min-width:120px;text-align:right;line-height:1.4">${c}</th>`).join('')}
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }

  function renderDecPlanCharts() {
    const SITES = ['いなべ', '群馬', '南丹'];
    const gridColor = 'rgba(255,255,255,0.08)';
    const tickColor = '#9399b2';
    const legendColor = '#cdd6f4';

    const baseOpts = (yLabel) => ({
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: legendColor, boxWidth: 14, font: { size: 11 } } },
        tooltip: { mode: 'index' },
      },
      scales: {
        x: { ticks: { color: tickColor }, grid: { color: gridColor } },
        y: { ticks: { color: tickColor }, grid: { color: gridColor },
             title: { display: true, text: yLabel, color: tickColor, font: { size: 10 } } },
      },
    });

    // 勤務時間グラフ
    const ctx1 = document.getElementById('dec-plan-chart-h');
    if (ctx1) {
      if (ctx1._chartInst) ctx1._chartInst.destroy();
      ctx1._chartInst = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: SITES,
          datasets: [
            { label: '②標準時間(6月)', data: SITES.map(s => stdHoursFromMerge(s) || 0), backgroundColor: '#60a5fa', stack: 'current' },
            { label: '③新加入見込み', data: SITES.map(s => newHireH(s) || 0), backgroundColor: '#4ade80', stack: 'current' },
            { label: '④残業見込み',   data: SITES.map(s => overtimeH(s) || 0),  backgroundColor: '#facc15', stack: 'current' },
            { label: '⑥12月標準工数時間', data: SITES.map(s => stdHoursForMonth(s, decIdx) || 0), backgroundColor: '#a78bfa', stack: 'dec' },
          ],
        },
        options: baseOpts('時間 (h)'),
      });
    }

    // 人数グラフ
    const ctx2 = document.getElementById('dec-plan-chart-n');
    if (ctx2) {
      if (ctx2._chartInst) ctx2._chartInst.destroy();
      ctx2._chartInst = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: SITES,
          datasets: [
            { label: '①人数(B=1/2)',   data: SITES.map(s => mergeN(s) || 0),      backgroundColor: '#60a5fa', stack: 'current' },
            { label: '③新加入見込み', data: SITES.map(s => newHireN(s) || 0),    backgroundColor: '#4ade80', stack: 'current' },
            { label: '⑥12月標準人数', data: SITES.map(s => { const d = stdHoursForMonth(s, decIdx); return d !== null ? Math.round(d / 173.8) : 0; }), backgroundColor: '#a78bfa', stack: 'dec' },
          ],
        },
        options: baseOpts('人数 (名)'),
      });
    }
  }

  const note = `<div style="font-size:0.8rem;color:var(--muted);margin-bottom:16px">
    ※ ①6月実績は栽培・出荷のみ集計。　※ ②標準時間は3拠点マージシートB列=1（栽培・出荷div）のR列合計。<br>
    ※ ③新加入見込み：3拠点マージシートB列=2（栽培・出荷div）のR列合計・件数。<br>
    ※ ④残業見込み：3拠点マージシートX列−R列の合計（栽培・出荷div）。内訳：社員・技能実習生 +30h、パート社保加入者は本人希望調査。<br>
    ※ ⑤=②+③+④。　※ ⑥12月標準工数時間は生産計画×標準工数設定から算出。
  </div>`;

  main.innerHTML = `<div class="prod-panel" style="padding:20px">
    <div class="chart-section-label" style="font-size:1rem;margin-bottom:4px">📅 26/12向け計画</div>
    ${note}
    <div style="display:flex;gap:24px;margin-bottom:28px;flex-wrap:wrap">
      <div style="flex:1;min-width:300px;height:260px;position:relative">
        <div class="chart-section-label" style="font-size:0.88rem;margin-bottom:6px">勤務時間</div>
        <div style="height:230px;position:relative">
          <canvas id="dec-plan-chart-h"></canvas>
        </div>
      </div>
      <div style="flex:1;min-width:300px;height:260px;position:relative">
        <div class="chart-section-label" style="font-size:0.88rem;margin-bottom:6px">人数</div>
        <div style="height:230px;position:relative">
          <canvas id="dec-plan-chart-n"></canvas>
        </div>
      </div>
    </div>
    <div id="dec-plan-tables">
      ${buildTable('h')}
      ${buildTable('n')}
    </div>
  </div>`;

  renderDecPlanCharts();
}

// Stage 1：GAS Webアプリ（疎通確認用）のURL。「26/生産計画」「ファーム勤務時間」どちらの
// スプレッドシートにも紐づかない、新規のスタンドアロンGASプロジェクトとしてデプロイ済み。
// デプロイ手順はgas/staffing-plan-webapp.gs冒頭のコメントを参照。
// コードを更新した場合は「デプロイを管理」から再デプロイしないと反映されない点に注意
const STAFFING_PLAN_GAS_URL = "https://script.google.com/macros/s/AKfycbwnzGGW6DI8Z7rZ5VRRle7bNwESm5XctpM3Ufkpqvoomlf8oHbYBUYTIWyLIxBekC-4pQ/exec";

// Stage 1：GAS Webアプリとの疎通確認のみ。コンテナ数の計算・シートへの書き込み・
// 実データ表示は行わない（後続のStageで実装）。ボタン押下→ローディング表示→
// GASからの応答待ち（同期的）→結果表示、という一連の流れが動くことを確認する
async function runStaffingPlanGasPing() {
  const content = document.getElementById('staffplan-content');
  const btn = document.getElementById('staffplan-refresh-btn');
  btn.disabled = true;
  content.innerHTML = '<div class="loading">GAS Webアプリと通信中...</div>';

  try {
    // Content-Type: application/jsonを指定するとブラウザがプリフライト(OPTIONS)を送るが、
    // GAS Webアプリはそれに応答できずCORSエラーになる。text/plain;charset=utf-8を指定すると
    // 「シンプルリクエスト」扱いになりプリフライトが発生しないため、これを使う
    // （ボディの中身自体はこれまで通りJSON文字列。GAS側でJSON.parse()して受け取る）。
    // Stage 1時点ではボディの中身はまだ使わないが、今後のStageで実データを送る前提を整えておく
    const res = await fetch(STAFFING_PLAN_GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({}),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    content.innerHTML = `<div class="loading">${data.message ?? '(messageフィールドがありません)'}</div>`;
    console.log('[要員計画] GAS疎通確認レスポンス:', data);
  } catch (e) {
    content.innerHTML = `<div class="error-msg">GAS Webアプリとの通信に失敗しました: ${e.message}</div>`;
    console.error('[要員計画] GAS疎通確認エラー:', e);
  } finally {
    btn.disabled = false;
  }
}

// ページ読み込み時（F5・Ctrl+Shift+R含む）に一度だけ、sessionStorageから直前の表示状態を
// グローバル変数へ反映する。以降の実際のタブ復元処理は、既存のloadAll()内の
// 「更新ボタン押下時の状態保持」ロジック（prevActiveBase等）にそのまま乗せる。
// summarySubtabだけは対応するグローバル変数が無く、loadAll()側もDOM（.summary-subtab.active）
// から読むため、まだ何も描画されていない初回だけ使うフォールバック値として保持しておく
let restoredSummarySubtab = null;
(function restoreSessionStateBeforeFirstLoad() {
  const s = loadSessionState();
  if (!s) return;
  if (s.activeBase) activeBase = s.activeBase;
  // 「要員計画」「比較」（オリジナル）タブ削除前のsessionStorageが残っている
  // ブラウザ（デプロイ直後に開きっぱなしのタブ等）から復元すると、もう存在しない
  // activeModeのままactiveGroupの判定（YOJITSU_MODES.includes）に失敗し、
  // タブが1つも選択されない空白画面になってしまうため、削除済みモードは
  // 予実グループの先頭タブ（生産計画）へ読み替える
  const REMOVED_MODE_FALLBACK = { staffplan: 'plan', plancompare: 'plan' };
  if (s.activeMode) activeMode = REMOVED_MODE_FALLBACK[s.activeMode] || s.activeMode;
  if (s.compareSubtab) compareSubtab = s.compareSubtab;
  if (s.compareSiteViewMode) compareSiteViewMode = s.compareSiteViewMode;
  if (s.empChartSubtab) empChartSubtab = s.empChartSubtab;
  if (s.stdHoursSubtab) stdHoursSubtab = s.stdHoursSubtab;
  if (s.stdHoursMetric) stdHoursMetric = s.stdHoursMetric;
  if (s.planCmpSubtab) planCmpSubtab = s.planCmpSubtab;
  if (s.planCmpSiteTab) planCmpSiteTab = s.planCmpSiteTab;
  if (s.summarySubtab) restoredSummarySubtab = s.summarySubtab;
  if (s.periodStartMonth) periodStartMonth = s.periodStartMonth;
  if (typeof s.periodMonthCount === 'number') periodMonthCount = s.periodMonthCount;
  if (Array.isArray(s.empTypeFilter)) empTypeFilter = new Set(s.empTypeFilter);
  // renderEmpTypeFilterUI()が初回loadAll()実行時に「保存時点で存在した雇用区分」を
  // 正しく認識できるよう、empTypeColorMapのキーだけ先に復元しておく（値はダミーでよく、
  // renderEmpTypeFilterUI()自身が実データをもとに正しい色へ上書きする）
  if (Array.isArray(s.empTypeAllKnown)) {
    s.empTypeAllKnown.forEach(t => { empTypeColorMap[t] = null; });
  }
  if (typeof s.transferMode === 'boolean') {
    transferMode = s.transferMode;
    document.querySelectorAll('.transfer-toggle-btn').forEach(b => {
      b.classList.toggle('active', (b.dataset.mode === 'on') === transferMode);
    });
  }
})();

loadAll();
// 「標準工数設定」シートはページ読み込み時に一度だけ取得する（更新ボタンでは再取得しない）
loadStdSettingsSheetOnce().catch(e => console.error('[標準工数設定] 初回取得エラー:', e));
</script>
