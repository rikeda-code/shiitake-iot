/* ── 標準工数(h) ────────────────────────────────────────────────────── */

function renderStdHoursTab() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">標準工数を計算中...</div>';
  if (!allData) { main.innerHTML = '<div class="error-msg">勤務データが未ロードです</div>'; return; }
  Promise.all([fetchProductionSheet(), loadStdSettingsSheetOnce()]).then(([prodData]) => {
    renderStdHoursTable(filterProductionByPeriod(prodData));
  }).catch(e => {
    main.innerHTML = `<div class="error-msg">データ取得エラー: ${e.message}</div>`;
  });
}

function renderStdHoursTable(prodData) {
  const main = document.getElementById('main');
  const rows = loadStdSettings();
  const { months: filteredMonths, records } = prodData;

  // 表示列は「開始月から固定12本（シート実在最新月を超える分は見出しも空欄）」。
  // filterProductionByPeriod()が返す実データ（filteredMonths/records、選択範囲内のみ）は
  // ここで表示列と月をキーに紐付ける。延長列・超過列（mi >= originalCount）には
  // 生産実績データを一切載せない
  const { months, originalCount } = getExtendedDisplayMonths();
  const conv = loadCsConv();
  const { calcRow } = createStdHoursEngine(records, filteredMonths, months, originalCount, conv);

  const availSites = [...new Set(records.map(r => r.site))].filter(s => SITE_COLORS[s]);
  const divCount = {};
  rows.forEach(r => { divCount[r.div] = (divCount[r.div] || 0) + 1; });

  let html = `<div class="prod-panel">
    <div class="chart-section-label">📋 標準工数(h) ／ 生産実績 × 標準工数設定
      <span style="font-size:0.72rem;font-weight:400;color:var(--muted);margin-left:12px">※ 稼働コンテナ数・合計点数は生産実績シートから取得　cs換算設定は⚙️タブで変更可</span>
    </div>`;

  availSites.forEach(site => {
    const siteColor = SITE_COLORS[site] || '#fff';
    html += `<div style="margin-bottom:28px">
      <div class="schart-header" style="color:${siteColor};margin-bottom:6px">📍 ${site}</div>
      <div class="prod-table-wrap"><table class="prod-table">
        <thead><tr>
          <th class="th-left col-site" style="min-width:60px">業務区分</th>
          <th class="th-left col-work" style="min-width:130px">作業区分</th>
          <th class="th-left col-basis" style="min-width:140px">計算根拠</th>
          ${months.map(m => `<th>${m}</th>`).join('')}
          <th class="th-left" style="min-width:130px">計算方法</th>
        </tr></thead><tbody>`;

    let lastDiv = '';
    rows.forEach(r => {
      const divCell = r.div !== lastDiv
        ? `<td class="col-site" style="color:${r.div === '栽培' ? 'var(--accent-gunma)' : 'var(--accent-inabe)'};font-weight:600" rowspan="${divCount[r.div]}">${r.div}</td>`
        : '';
      if (r.div !== lastDiv) lastDiv = r.div;

      const monthData = months.map((_, mi) => calcRow(site, r, mi));
      const hasData = monthData.some(d => d.h !== null);
      // Pick latest month's containers value as sample
      const sampleD = [...monthData].reverse().find(d => d.containers !== null);
      const sampleContainers = sampleD ? sampleD.containers : null;

      const mkey = r.metricKey || '';

      // Status icon
      const statusIcon = r.val === null
        ? '<span style="color:var(--muted)">未設定</span>'
        : hasData
          ? '<span style="color:#34d399">●</span>'
          : '<span style="color:#f59e0b">○</span>';

      // Basis description (skip if val not set)
      let basisDesc = '—';
      if (r.val !== null) {
        if (r.col === 'fixedH') {
          basisDesc = `固定 ${r.val} h/月`;
        } else if (r.col === 'kgPerH') {
          basisDesc = sampleContainers !== null
            ? `${sampleContainers.toLocaleString('ja-JP')} kg ÷ ${r.val} kg/h`
            : `${mkey}: データなし`;
        } else if (r.col === 'perContainer') {
          basisDesc = sampleContainers !== null
            ? `${mkey}: ${sampleContainers.toLocaleString('ja-JP')} コンテナ × ${r.val} ${r.unit}`
            : `${mkey}: データなし`;
        } else if (r.col === 'perPiece') {
          basisDesc = sampleContainers !== null
            ? `${sampleContainers.toLocaleString('ja-JP')} 点 × ${r.val} 秒`
            : `${mkey}: データなし`;
        } else if (r.col === 'perCs') {
          basisDesc = sampleContainers !== null
            ? `${sampleContainers.toLocaleString('ja-JP')} cs × ${r.val} 秒`
            : `${mkey}: データなし`;
        }
      }

      html += `<tr>${divCell}
        <td class="col-metric col-work" style="font-size:0.82rem">${r.task}</td>
        <td class="col-metric col-basis" style="font-size:0.75rem">
          ${statusIcon} <span style="color:var(--muted)">${basisDesc}</span>
        </td>`;

      // 延長列・超過列（mi >= originalCount）は空欄、選択範囲内はデータなしを「ー」で表示
      monthData.forEach((d, mi) => {
        if (mi >= originalCount) { html += '<td class="col-num"></td>'; return; }
        if (d.h !== null) {
          const disp = d.h < 10 ? d.h.toFixed(1) : Math.round(d.h).toLocaleString('ja-JP');
          html += `<td class="col-num">${disp}<span style="font-size:0.68rem;color:var(--muted)"> h</span></td>`;
        } else {
          html += `<td class="col-num empty" style="color:#444">—</td>`;
        }
      });

      html += `<td class="col-metric" style="font-size:0.72rem;color:var(--muted)">${r.note}</td></tr>`;
    });

    // Subtotals per div
    ['栽培', '出荷'].forEach(div => {
      const divRows = rows.filter(r => r.div === div);
      const totals = months.map((_, mi) => {
        const vals = divRows.map(r => calcRow(site, r, mi).h).filter(v => v !== null);
        return vals.length ? vals.reduce((a, b) => a + b, 0) : null;
      });
      const color = div === '栽培' ? 'var(--accent-gunma)' : 'var(--accent-inabe)';
      // 小計・総合計行は、通常行（業務区分＝col-site＋作業区分＋計算根拠の3つの個別<td>）と
      // 同じ3列構成にする。以前はcolspan="3"で1セルに結合していたが、col-siteクラスが
      // position:sticky;left:0を持つため、通常行の1列分しかstickyにならない業務区分列と
      // 幅がズレ、横スクロール時に位置がズレて見える不具合があった。col-site/col-work/
      // col-basisクラスは、通常行と同じ列に同じクラスを付与することでsticky位置を揃え、
      // 3列とも同じ背景色・境界線なしスタイルにして見た目上は結合セルのまま見えるようにする
      html += `<tr style="font-weight:600;background:#1a1f35">
        <td class="col-site" style="border-right:none"></td>
        <td class="col-work" style="background:var(--surface);border-left:none;border-right:none"></td>
        <td class="col-basis" style="background:var(--surface);border-left:none;text-align:right;padding-right:10px;color:var(--muted)">${div} 小計</td>`;
      totals.forEach((t, mi) => {
        if (mi >= originalCount) { html += '<td class="col-num"></td>'; return; }
        html += t !== null
          ? `<td class="col-num" style="color:${color}">${t < 10 ? t.toFixed(1) : Math.round(t).toLocaleString('ja-JP')}<span style="font-size:0.68rem;opacity:0.7"> h</span></td>`
          : `<td class="col-num empty">—</td>`;
      });
      html += `<td></td></tr>`;
    });

    // Grand total
    const grandTotals = months.map((_, mi) => {
      const vals = rows.map(r => calcRow(site, r, mi).h).filter(v => v !== null);
      return vals.length ? vals.reduce((a, b) => a + b, 0) : null;
    });
    html += `<tr style="font-weight:700;background:#141827;border-top:2px solid #3a3f5c">
      <td class="col-site" style="border-right:none"></td>
      <td class="col-work" style="background:var(--surface);border-left:none;border-right:none"></td>
      <td class="col-basis" style="background:var(--surface);border-left:none;text-align:right;padding-right:10px;color:#e2e8f0">総合計</td>`;
    grandTotals.forEach((t, mi) => {
      if (mi >= originalCount) { html += '<td class="col-num"></td>'; return; }
      html += t !== null
        ? `<td class="col-num" style="color:#e2e8f0">${t < 10 ? t.toFixed(1) : Math.round(t).toLocaleString('ja-JP')}<span style="font-size:0.68rem;opacity:0.7"> h</span></td>`
        : `<td class="col-num empty">—</td>`;
    });
    html += `<td></td></tr>`;

    html += `</tbody></table></div></div>`;
  });

  html += `</div>`;
  main.innerHTML = html;
}

/* ── Productivity ─────────────────────────────────────────────────── */

// "2025年10月" → "2025/10"
function normalizeMonth(m) {
  return String(m).replace(/(\d+)年(\d+)月/, (_, y, mo) => `${y}/${parseInt(mo)}`);
}

// 整理済み_Mの月キー（monthYms/months）は実質月（シート2行目を直接読み取ったもの）。
// 整理済み_分析（生産実績）の月もカレンダー通りの暦月のため、オフセットなしの単純一致で突き合わせられる。

const productivityChartInstances = {};

function renderProductivityTab() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">生産性データを計算中...</div>';

  Object.values(productivityChartInstances).forEach(c => c.destroy());
  Object.keys(productivityChartInstances).forEach(k => delete productivityChartInstances[k]);

  if (!allData) { main.innerHTML = '<div class="error-msg">勤務データが未ロードです</div>'; return; }

  fetchProductionSheet().then(prodData => {
    renderProductivityCharts(getActiveData(), prodData);
  }).catch(e => {
    main.innerHTML = `<div class="error-msg">エラー: ${e.message}</div>`;
    console.error(e);
  });
}

function renderProductivityCharts(workData, prodData) {
  const main = document.getElementById('main');
  const { employees } = workData;
  const { months: prodMonths, records } = prodData;

  // 表示列は「開始月から固定12本（シート実在最新月を超える分は見出しも空欄）」。
  // 生産実績側の実データは、選択範囲内(mi < originalCount)の月だけをnormalizeMonth()で
  // 突き合わせる。延長列・超過列には勤怠・生産実績いずれのデータも一切載せない
  const { months, originalCount } = getExtendedDisplayMonths();

  // 選択範囲内に生産実績側と共通する月が1つもなければ、以降の処理を打ち切る
  const hasOverlap = months.slice(0, originalCount).some(m => prodMonths.includes(normalizeMonth(m)));
  if (!hasOverlap) {
    main.innerHTML = '<div class="loading">共通月が見つかりません（月ラベル形式を確認してください）</div>';
    return;
  }

  // Collect all sites that appear in production data
  const prodSites = [...new Set(records.map(r => r.site))];
  // Use sites that appear in both work data and production data
  const sites = SITES.filter(s => prodSites.includes(s) && employees.some(e => e.base === s));
  if (!sites.length) {
    main.innerHTML = '<div class="loading">拠点データの突合ができませんでした</div>';
    return;
  }

  // Helper: sum hours by workType filter for a site, indexed by表示列(mi)
  function workHours(site, typeFilter) {
    const emps = employees.filter(e => e.base === site && e.workType && typeFilter(e.workType));
    return months.map((_, mi) => {
      if (mi >= originalCount) return null;
      const total = emps.reduce((s, e) => s + (e.hours[mi] ?? 0), 0);
      return total > 0 ? Math.round(total * 10) / 10 : null;
    });
  }

  // Helper: get production metric values aligned to 表示列(mi)
  function prodVals(site, metric) {
    const r = records.find(x => x.site === site && x.metric === metric);
    if (!r) return months.map(() => null);
    return months.map((m, mi) => {
      if (mi >= originalCount || !m) return null;
      const pi = prodMonths.indexOf(normalizeMonth(m));
      return (pi >= 0 && r.values[pi] !== null) ? r.values[pi] : null;
    });
  }

  // Calculate productivity per site
  const data = {};
  sites.forEach(site => {
    // Match summary table classification (配送・栽培 → 配送, not 栽培)
    const cultivationH = workHours(site, wt => workTypeClass(wt) === 'wt-栽培');
    const shippingH    = workHours(site, wt => workTypeClass(wt) === 'wt-出荷');
    const harvest      = prodVals(site, '収穫量(kg)');
    const shipKg       = prodVals(site, '出荷量(kg)');
    const shipPcs      = prodVals(site, '合計(点数)');

    const ratio = (a, b) => a.map((v, i) =>
      (v !== null && b[i] !== null && b[i] > 0) ? Math.round(v / b[i] * 10) / 10 : null
    );

    data[site] = {
      cultivationH,
      shippingH,
      harvestPerH:  ratio(harvest, cultivationH),
      shipKgPerH:   ratio(shipKg,  shippingH),
      shipPcsPerH:  ratio(shipPcs, shippingH),
      harvest,
      shipKg,
      shipPcs,
    };
  });

  // Build latest-month KPI values（延長・超過列は対象外。選択範囲内の最新月を基準にする）
  const lastIdx   = originalCount - 1;
  const lastMonth = months[lastIdx];

  function kpiHtml(label, site, key, unit, decimals = 1) {
    const v = data[site]?.[key]?.[lastIdx];
    const color = SITE_COLORS[site] || '#e2e8f0';
    return `<div class="kpi">
      <div class="kpi-label" style="color:${color}">${site}</div>
      <div class="kpi-value">${v !== null && v !== undefined ? v.toFixed(decimals) : '—'} <span style="font-size:0.7em;color:var(--muted)">${unit}</span></div>
    </div>`;
  }

  // Chart definitions: productivity line (left Y) + volume/time bars (right Y)
  const barMode = window._prodBarMode || 'volume';
  const metrics = [
    { key: 'harvestPerH', title: '① 栽培生産性', sub: '栽培時間あたり収穫量', unit: 'kg/h', decimals: 1,
      volKey: 'harvest',    volUnit: 'kg', volLabel: '収穫量',
      hKey:   'cultivationH', hUnit: 'h', hLabel: '栽培時間' },
    { key: 'shipKgPerH',  title: '② 出荷生産性（重量）', sub: '出荷時間あたり出荷量', unit: 'kg/h', decimals: 1,
      volKey: 'shipKg',     volUnit: 'kg', volLabel: '出荷量',
      hKey:   'shippingH',  hUnit: 'h', hLabel: '出荷時間' },
    { key: 'shipPcsPerH', title: '③ 出荷生産性（点数）', sub: '出荷時間あたり合計点数', unit: '点/h', decimals: 0,
      volKey: 'shipPcs',    volUnit: '点', volLabel: '合計点数',
      hKey:   'shippingH',  hUnit: 'h', hLabel: '出荷時間' },
  ];

  // Combo chart options: left Y = productivity (line), right Y = volume/time (bar)
  function comboOpts(ratioUnit, ratioDecimals, barUnit) {
    return {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#8892a4', font: { size: 11 }, boxWidth: 12, padding: 8 } },
        tooltip: {
          backgroundColor: '#1e2235', borderColor: '#3a3f5c', borderWidth: 1,
          titleColor: '#e2e8f0', bodyColor: '#a0aec0',
          callbacks: {
            label: ctx => {
              const v = ctx.parsed.y;
              if (v === null || v === undefined) return null;
              if (ctx.dataset.yAxisID === 'y') {
                return `${ctx.dataset.label}: ${ratioDecimals === 0 ? Math.round(v).toLocaleString('ja-JP') : v.toFixed(ratioDecimals)} ${ratioUnit}`;
              }
              const u = ctx.dataset._barUnit || barUnit;
              return `${ctx.dataset.label}: ${u === '点' ? Math.round(v).toLocaleString('ja-JP') : v.toLocaleString('ja-JP')} ${u}`;
            },
          },
        },
      },
      scales: {
        x: { ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e2235' } },
        y: {
          position: 'left',
          ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} ${ratioUnit}` },
          grid: { color: '#1e2235' }, suggestedMin: 0,
          title: { display: true, text: ratioUnit, color: '#8892a4', font: { size: 10 } },
        },
        y1: {
          position: 'right',
          ticks: { color: '#6b7a90', font: { size: 10 }, callback: v => v >= 1000 ? `${(v/1000).toFixed(0)}k` : `${v}` },
          grid: { drawOnChartArea: false }, suggestedMin: 0,
          title: { display: true, text: barUnit, color: '#6b7a90', font: { size: 10 } },
        },
      },
    };
  }

  // Render HTML
  let html = `<div class="prod-panel">
    <div class="chart-section-label">📈 生産性 ／ 最新月: ${lastMonth}
      <span style="float:right;display:flex;align-items:center;gap:6px;font-size:0.78rem">
        <span style="color:var(--muted)">棒グラフ:</span>
        <button id="prd-toggle-vol" class="select-btn" style="padding:2px 10px" onclick="switchProdBar('volume')">生産量</button>
        <button id="prd-toggle-time" class="select-btn" style="padding:2px 10px" onclick="switchProdBar('time')">時間</button>
      </span>
    </div>
    <div class="kpi-row">
      ${metrics.map(m => sites.map(s => kpiHtml(m.title, s, m.key, m.unit, m.decimals)).join('')).join('')}
    </div>`;

  metrics.forEach((m, i) => {
    html += `<div class="schart-section">
      <div class="schart-header">${m.title}
        <span style="font-weight:400;font-size:0.8rem;color:var(--muted)">${m.sub}</span>
        <span style="float:right;font-size:0.72rem;color:var(--muted)">折れ線(左軸): ${m.unit}　棒(右軸): 生産量/時間 切替</span>
      </div>
      ${chartWrapHtml(`prd-${i}`, months.length, { heightPx: 340, inlineHeight: true })}
    </div>`;
  });

  html += `</div>`;
  main.innerHTML = html;

  // Store references for toggle function
  window._prodBarMode = barMode;
  window._prodBarData = { metrics, data, sites };

  // Draw combo charts
  metrics.forEach((m, i) => {
    const ctx = document.getElementById(`prd-${i}`)?.getContext('2d');
    if (!ctx) return;

    const datasets = [];

    // Productivity lines per site (left Y)
    sites.forEach(site => {
      const color = SITE_COLORS[site] || '#fff';
      datasets.push({
        type: 'line',
        label: `${site} (${m.unit})`,
        data: data[site][m.key],
        borderColor: color,
        backgroundColor: color + '22',
        borderWidth: 2.5,
        pointRadius: 5,
        pointHoverRadius: 7,
        tension: 0.3,
        spanGaps: true,
        yAxisID: 'y',
        order: 0,
      });
    });

    // Volume/time bars per site (right Y) — controlled by barMode
    const barKey  = barMode === 'volume' ? m.volKey  : m.hKey;
    const barUnit = barMode === 'volume' ? m.volUnit : m.hUnit;
    const barLbl  = barMode === 'volume' ? m.volLabel : m.hLabel;
    sites.forEach(site => {
      const color = SITE_COLORS[site] || '#fff';
      datasets.push({
        type: 'bar',
        label: `${site} ${barLbl}(${barUnit})`,
        data: data[site][barKey],
        backgroundColor: color + '44',
        borderColor: color + '88',
        borderWidth: 1,
        yAxisID: 'y1',
        order: 2,
        _barUnit: barUnit,
      });
    });

    productivityChartInstances[`prd-${i}`] = new Chart(ctx, {
      data: { labels: months, datasets },
      options: comboOpts(m.unit, m.decimals, barUnit),
    });
  });

  // Set initial toggle button styles
  updateProdToggleButtons();
}

function updateProdToggleButtons() {
  const volBtn  = document.getElementById('prd-toggle-vol');
  const timeBtn = document.getElementById('prd-toggle-time');
  if (!volBtn || !timeBtn) return;
  const accentStyle = 'background:var(--accent-inabe);color:#000;border-color:var(--accent-inabe)';
  const plainStyle  = '';
  if (window._prodBarMode === 'time') {
    volBtn.style.cssText  = plainStyle;
    timeBtn.style.cssText = accentStyle;
  } else {
    volBtn.style.cssText  = accentStyle;
    timeBtn.style.cssText = plainStyle;
  }
}

window.switchProdBar = function(mode) {
  window._prodBarMode = mode;
  updateProdToggleButtons();
  // Need access to metrics and data; re-read from closure via a stored reference
  if (!window._prodBarData) return;
  const { metrics, data, sites } = window._prodBarData;
  metrics.forEach((m, i) => {
    const chart = productivityChartInstances[`prd-${i}`];
    if (!chart) return;
    const isVol   = mode === 'volume';
    const barKey  = isVol ? m.volKey  : m.hKey;
    const barUnit = isVol ? m.volUnit : m.hUnit;
    const barLbl  = isVol ? m.volLabel : m.hLabel;
    const n = sites.length;
    sites.forEach((site, si) => {
      const ds = chart.data.datasets[n + si];
      ds.data     = data[site][barKey];
      ds.label    = `${site} ${barLbl}(${barUnit})`;
      ds._barUnit = barUnit;
    });
    chart.options.scales.y1.title.text = barUnit;
    chart.update();
  });
};

  productionData = null; // 生産実績タブ等に戻った際、更新ボタンで実際に再取得されるようキャッシュも破棄する

  try {

      pastYearData = null; // 前年実績棒が表示されないだけで、他の集計・表示には影響しない

      pastYearCountData = null; // 人数画面の前年実績棒が表示されないだけで、他の集計・表示には影響しない
    }

    try {

      stdHoursMergeData = null; // 標準労働時間タブの折れ線が0扱いになるだけで、他の集計・表示には影響しない
    }

    const bases = SITES.filter(s => allData.employees.some(e => e.base === s));
    if (bases.length === 0) throw new Error('拠点データが見つかりません');

    // 更新前のタブ状態を復元する（拠点が無くなっていた場合のみ先頭拠点にフォールバック）
    if (prevActiveMode === 'site' && bases.includes(prevActiveBase)) {

  } catch (e) {

function renderPlanCompareCharts2(planData, prodData, mergeData) {
  const main = document.getElementById('main');
  const { months: planMonths, records: rawPlanRecords } = planData;
  const { months: actualMonths, records: actualRecords } = prodData || { months: [], records: [] };

  // 計画シートの実数計画カテゴリで null になっている月を、実績シートの同名メトリックで補完する
  // （過去月は計画シートに実績値がなく予定標準工数が 0 になるため）
  const records = rawPlanRecords.map(r => {
    if (r.cat !== '実数計画') return r;
    const hasNull = r.values.some(v => v === null);
    if (!hasNull) return r;
    const fallback = actualRecords.find(ar => ar.site === r.site && ar.metric === r.metric);
    if (!fallback) return r;
    const merged = r.values.map((v, pi) => {
      if (v !== null) return v;
      const month = planMonths[pi];
      const ai = actualMonths.indexOf(month);
      return ai >= 0 ? (fallback.values[ai] ?? null) : null;
    });
    return { ...r, values: merged };
  });
  const rows = loadYojitsuStdSettings();
  const conv = loadYojitsuCsConv();
  const originalCount = planMonths.length;
  const { calcRow, getProdVal } = createStdHoursEngine(records, planMonths, planMonths, originalCount, conv, null, '実数計画');

  // div ごとの生産計画量を拠点・月別に返す（右軸の折れ線用）
  const DIV_METRIC = { '栽培': '収穫量(kg)', '出荷': '出荷量(kg)' };
  const DIV_UNIT   = { '栽培': 'kg',          '出荷': 'kg' };
  function planVolume(site, div, mi) {
    return getProdVal(site, DIV_METRIC[div], mi);
  }

  const availSites = [...new Set(records.map(r => r.site))].filter(s => SITE_COLORS[s]);

  // 計画月（"2025/12"形式）に対応する実績工数を返す
  function workHoursForPlanMonths(site, typeFilter) {
    const { employees, months: activeMonths } = getActiveData();
    const emps = employees.filter(e => e.base === site && e.workType && typeFilter(e.workType));
    return planMonths.map(planMonth => {
      const ami = activeMonths.findIndex(m => normalizeMonth(m) === planMonth);
      if (ami < 0) return null;
      const total = emps.reduce((s, e) => s + (e.hours[ami] ?? 0), 0);
      return total > 0 ? Math.round(total * 10) / 10 : null;
    });
  }

  const TASK_COLORS = [
    '#ef4444','#f97316','#eab308','#fb7185','#fb923c',
    '#fde047','#fdba74','#dc2626','#fef08a','#e11d48',
  ];

  const divs = ['栽培', '出荷', '配送'];

  window._planCmpChartData2 = {};
  availSites.forEach(site => {
    divs.forEach(div => {
      const divRows = rows.filter(r => r.div === div);
      const typeFilter = div === '栽培'
        ? wt => workTypeClass(wt) === 'wt-栽培'
        : div === '配送'
          ? wt => workTypeClass(wt) === 'wt-配送'
          : wt => workTypeClass(wt) === 'wt-出荷';
      window._planCmpChartData2[`${site}-${div}`] = { divRows, actualH: workHoursForPlanMonths(site, typeFilter), div };
    });
  });

  /* ── 3拠点マージ：未来月（実績データがまだ無い月）の「実績工数」位置に、標準労働
     時間・最大労働時間から補完した棒を追加する（拠点・業務別モード・3拠点サマリ
     モード・拠点サマリモードの栽培・出荷セクションが対象）。mergeDataがnull（シート取得失敗）の場合は常に
     null/[]を返すだけなので、既存の表示には一切影響しない ────────────────────── */
  // B列が1（文字列"1"・数値1のいずれでも許容）かどうかを頑健に判定する
  function isThreeSiteMergeActiveFlag(v) {
    if (typeof v === 'string') v = v.trim();
    return v === 1 || v === '1' || Number(v) === 1;
  }

  // B列が2（文字列"2"・数値2のいずれでも許容。新規要員・追加待ちのステータス）
  // かどうかを頑健に判定する
  function isThreeSiteMergeNewStaffFlag(v) {
    if (typeof v === 'string') v = v.trim();
    return v === 2 || v === '2' || Number(v) === 2;
  }

  // rows（mergeData.rowsの一部、maxByYmを持つ）から月別列の合計{maxTotalByYm}を作る
  // 共通ヘルパー。deltaByYm（T列以降＝スタッフMの増減のみ）の月別合計に使う
  function threeSiteMergeAggFromRows(rows) {
    if (!rows.length) return null;
    const maxTotalByYm = {};
    mergeData.monthYms.forEach(ym => {
      let sum = 0, any = false;
      rows.forEach(r => { const v = r.maxByYm[ym]; if (typeof v === 'number' && !isNaN(v)) { sum += v; any = true; } });
      if (any) maxTotalByYm[ym] = Math.round(sum * 10) / 10;
    });
    return { maxTotalByYm };
  }

  // {stdTotalB1, newStaffByYm, deltaByYm}形式の集計を複数まとめて合算する共通ヘルパー
  // （拠点サマリ・3拠点サマリでdiv方向に合算する際に使う）。newStaffByYm・deltaByYm
  // とも月別オブジェクトのため、同じ「月ごとに存在する値だけ合計する」ロジックを共用する
  function mergeThreeSiteMergeAggShapes(items) {
    if (!items.length) return null;
    const stdTotalB1 = Math.round(items.reduce((s, a) => s + a.stdTotalB1, 0) * 10) / 10;
    const sumByYmField = field => {
      const out = {};
      mergeData.monthYms.forEach(ym => {
        let sum = 0, any = false;
        items.forEach(a => { const v = a[field][ym]; if (typeof v === 'number' && !isNaN(v)) { sum += v; any = true; } });
        if (any) out[ym] = Math.round(sum * 10) / 10;
      });
      return out;
    };
    return { stdTotalB1, newStaffByYm: sumByYmField('newStaffByYm'), deltaByYm: sumByYmField('deltaByYm') };
  }

  // 拠点×業務区分(栽培/出荷/配送)ごとの集計を返す。site=nullなら3拠点合算（全拠点合計
  // タブ・3拠点サマリタブ・拠点サマリタブで使用）。集計対象は、D・F・H列による
  // マッチングに加えて、E列が空でない（プロジェクト等の割当あり）行のみとする。
  // - stdTotalB1：B列＝1（稼働フラグ）の行のみのR列合計（固定値）
  // - newStaffByYm：B列＝2（新規要員・追加待ち）の行のうち、I列（開始月）が未設定
  //   またはその月以前の行だけを対象に、月ごとにR列を合計したもの（開始月を境に
  //   対象行が増えるため、月によって値が変わる）
  // - deltaByYm：T列以降（スタッフMの増減のみ。以前のような「合計－R列」の差分計算は
  //   不要で、シート側の値をそのまま月ごとに合計するだけでよい）をB=1・B=2両方の
  //   行を対象に合計したもの
  // R列（標準労働時間）は空でもよく、その場合はparseThreeSiteMergeSheet()側で0として
  // 扱われている
  function threeSiteMergeAgg(div, site) {
    if (!mergeData) return null;
    const baseMatch = r => r.div === div && (site == null || r.site === site) && r.prj !== '';
    const matched = mergeData.rows.filter(r => baseMatch(r) && isThreeSiteMergeActiveFlag(r.activeFlag));
    const newStaffMatched = mergeData.rows.filter(r => baseMatch(r) && isThreeSiteMergeNewStaffFlag(r.activeFlag));
    if (!matched.length && !newStaffMatched.length) return null;
    const stdTotalB1 = Math.round(matched.reduce((s, r) => s + r.stdHours, 0) * 10) / 10;
    const newStaffByYm = {};
    mergeData.monthYms.forEach(ym => {
      const eligible = newStaffMatched.filter(r => r.startYm == null || r.startYm <= ym);
      if (eligible.length) newStaffByYm[ym] = Math.round(eligible.reduce((s, r) => s + r.stdHours, 0) * 10) / 10;
    });
    const deltaCombined = threeSiteMergeAggFromRows([...matched, ...newStaffMatched]);
    return { stdTotalB1, newStaffByYm, deltaByYm: deltaCombined ? deltaCombined.maxTotalByYm : {} };
  }

  // agg（threeSiteMergeAgg()／mergeThreeSiteMergeAggAcrossDivsの戻り値）と、過去月
  // 計算に使うdivsForPast（agg集計に使ったdivの配列）・site（同site。nullなら全拠点）
  // から、指定月miにおける「標準労働時間」棒の実効値（積み上げ全体の高さ）を返す。
  // 過去月（ACTUAL_CUTOFF以前、既に実績が確定している月）はcomputeStdHoursLineForDivSite()
  // による整理済み_Mの実測値、未来月はstdTotalB1（青）＋newStaffByYm（黄）＋deltaByYm
  // （緑）の合計。threeSiteMergeStdHoursDatasets()・threeSiteMergeStdHoursTotal()の
  // 両方から使う共通ロジック
  function threeSiteMergeMonthlyValue(agg, divsForPast, site, mi) {
    if (!agg) return null;
    const ym = mnum(planMonths[mi]);
    if (ym <= ACTUAL_CUTOFF) {
      return divsForPast.reduce((s, div) => {
        const v = computeStdHoursLineForDivSite(div, site, planMonths)[mi];
        return s + (v !== null ? v : 0);
      }, 0);
    }
    const newStaff = agg.newStaffByYm[ym];
    const delta = agg.deltaByYm[ym];
    const total = agg.stdTotalB1
      + (typeof newStaff === 'number' ? newStaff : 0)
      + (typeof delta === 'number' ? delta : 0);
    return Math.round(total * 10) / 10;
  }

  // agg（3拠点マージの集計）から、「実績」棒と「標準工数」棒の中間に表示する
  // 「標準労働時間」棒（新規・中央）用のデータセットを構築する。divsForPast・site
  // （過去月の実測値計算に使う、aggの集計に使ったのと同じdiv配列・site）を渡す必要が
  // ある。過去月は整理済み_Mの実測値（computeStdHoursLineForDivSite）、未来月は
  // 3段積み上げ：
  //   - 青（標準労働時間）：stdTotalB1（固定値）
  //   - 黄（新規要員・開始済み）：newStaffByYm[該当月]（0以下・値なしは非表示）
  //   - 緑（増減）：deltaByYm[該当月]をそのまま使う（0・値なしは非表示。以前のような
  //     「合計との差分」への変換は不要で、シート側の値がすでに増減そのもの）
  function threeSiteMergeStdHoursDatasets(agg, divsForPast, site, opts) {
    opts = opts || {};
    if (!agg) return [];
    const stdData = planMonths.map((_, mi) => {
      const ym = mnum(planMonths[mi]);
      return ym <= ACTUAL_CUTOFF ? threeSiteMergeMonthlyValue(agg, divsForPast, site, mi) : agg.stdTotalB1;
    });
    const newStaffData = planMonths.map((_, mi) => {
      const ym = mnum(planMonths[mi]);
      if (ym <= ACTUAL_CUTOFF) return null;
      const v = agg.newStaffByYm[ym];
      return typeof v === 'number' && v > 0 ? v : null;
    });
    const deltaData = planMonths.map((_, mi) => {
      const ym = mnum(planMonths[mi]);
      if (ym <= ACTUAL_CUTOFF) return null;
      const v = agg.deltaByYm[ym];
      return typeof v === 'number' && v !== 0 ? Math.round(v * 10) / 10 : null;
    });
    const stdColor = opts.color || '#60a5fa';
    const newStaffColor = opts.newStaffColor || '#fbbf24';
    const deltaColor = opts.deltaColor || '#4ade80';
    const stdOpacity = opts.stdOpacity || 'cc';
    const newStaffOpacity = opts.newStaffOpacity || 'cc';
    const deltaOpacity = opts.deltaOpacity || 'cc';
    const stack = opts.stack || 'stdhours';
    const suffix = opts.labelSuffix || '';
    return [
      {
        type: 'bar', label: `標準労働時間${suffix}`, data: stdData,
        backgroundColor: stdColor + stdOpacity, borderColor: stdColor, borderWidth: 0,
        stack, yAxisID: 'y', order: 1, _threeSiteMergeStdHours: true,
      },
      {
        type: 'bar', label: `新規要員（開始済み）${suffix}`, data: newStaffData,
        backgroundColor: newStaffColor + newStaffOpacity, borderColor: newStaffColor, borderWidth: 0,
        stack, yAxisID: 'y', order: 1, _threeSiteMergeStdHours: true,
      },
      {
        type: 'bar', label: `増減${suffix}`, data: deltaData,
        backgroundColor: deltaColor + deltaOpacity, borderColor: deltaColor, borderWidth: 0,
        stack, yAxisID: 'y', order: 1, _threeSiteMergeStdHours: true,
      },
    ];
  }

  // 軸MAX算出用：指定月(mi、planMonths基準)における「標準労働時間」棒（積み上げ全体）の
  // 実効的な高さを返す。threeSiteMergeStdHoursDatasets()と同じ実効値計算を共有する
  // （divsForPast・siteはaggの集計に使ったのと同じものを渡す）
  function threeSiteMergeStdHoursTotal(agg, divsForPast, site, mi) {
    return threeSiteMergeMonthlyValue(agg, divsForPast, site, mi);
  }

  // 拠点サマリモード用：栽培・出荷（・配送）それぞれのthreeSiteMergeAgg()の結果を、
  // div区別なく1つの集計にまとめる（stdTotalB1・newStaffByYm・deltaByYmとも両div分の合計）
  function mergeThreeSiteMergeAggAcrossDivs(aggs) {
    const valid = aggs.filter(Boolean);
    if (!valid.length) return null;
    return mergeThreeSiteMergeAggShapes(valid);
  }

  let planCmpChartInstances = {};
  function destroyCharts() {
    Object.values(planCmpChartInstances).forEach(c => c.destroy());
    planCmpChartInstances = {};
  }

  // 表示する月のインデックスセット（任意の月を個別選択可）
  let planCmpSelected = new Set(planMonths.map((_, i) => i)); // 初期：全月選択
  const sl = arr => arr.filter((_, i) => planCmpSelected.has(i));
  function visMonths() { return planMonths.filter((_, i) => planCmpSelected.has(i)); }

  function tooltipOpts(showStdFooter, showActualTotal) {
    return {
      backgroundColor: '#1e2235', borderColor: '#3a3f5c', borderWidth: 1,
      titleColor: '#e2e8f0', bodyColor: '#e2e8f0',
      footerColor: '#e2e8f0', footerFont: { weight: 'normal' },
      callbacks: {
        label: ctx => {
          const v = ctx.parsed.y;
          if (v === null || v === undefined) return null;
          if (ctx.dataset._volumeLine) return `${ctx.dataset.label}: ${v.toLocaleString('ja-JP')} ${ctx.dataset._unit}`;
          // 3拠点マージの黄（新規要員）・緑（増減）セグメントは、いずれもそれ自体が
          // 意味を持つ絶対値（旧・最大労働時間セグメントのような「下段との差分」では
          // ない）ため、他セグメントの値と合算する変換は不要。そのままの値を表示する
          return `${ctx.dataset.label}: ${v.toLocaleString('ja-JP')} h`;
        },
        afterLabel: showActualTotal ? function (ctx) {
          const actualItems = (this.dataPoints || []).filter(i => i.dataset._actualGroup && i.parsed.y != null);
          if (!actualItems.length) return;
          const last = actualItems[actualItems.length - 1];
          if (ctx.datasetIndex !== last.datasetIndex || ctx.dataIndex !== last.dataIndex) return;
          const actualTotal = actualItems.reduce((s, i) => s + i.parsed.y, 0);
          if (actualTotal === 0) return;
          return `実績合計: ${Math.round(actualTotal).toLocaleString('ja-JP')} h`;
        } : undefined,
        footer: showStdFooter ? items => {
          const stdTotal = items
            .filter(i => i.dataset._stdGroup && i.parsed.y != null)
            .reduce((s, i) => s + i.parsed.y, 0);
          if (stdTotal === 0) return;
          const indent = showActualTotal ? '　' : '';
          return `${indent}標準工数合計: ${Math.round(stdTotal).toLocaleString('ja-JP')} h`;
        } : undefined,
      },
    };
  }

  function volumeLineDataset(site, div) {
    const data = planMonths.map((_, mi) => {
      const v = planVolume(site, div, mi);
      return v !== null ? Math.round(v * 10) / 10 : null;
    });
    return {
      type: 'line', label: DIV_METRIC[div], data,
      borderColor: '#94a3b8', backgroundColor: 'transparent',
      borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#94a3b8',
      tension: 0.3, yAxisID: 'y2', order: 0,
      _volumeLine: true, _unit: DIV_UNIT[div],
    };
  }

  function y2Axis(div, volumeData, maxOverride) {
    const max = maxOverride !== undefined ? maxOverride : (computeSharedAxisMax([volumeData.filter(v => v !== null)], 1000) || undefined);
    return {
      position: 'right',
      ticks: { color: '#64748b', font: { size: 10 }, callback: v => v.toLocaleString('ja-JP') },
      grid: { drawOnChartArea: false },
      suggestedMin: 0, max,
      title: { display: true, text: DIV_UNIT[div], color: '#64748b', font: { size: 10 } },
    };
  }

  // 雇用区分シリーズ定義（社員・パート・技能実習生）
  const EMP_SERIES = [
    { label: '社員',       match: e => (e.employment||'').includes('社員') && !(e.employment||'').includes('技能'), color: '#60a5fa' },
    { label: 'パート',     match: e => ['パート','アルバイト'].some(k => (e.employment||'').includes(k)),          color: '#fb923c' },
    { label: '技能実習生', match: e => (e.employment||'').includes('技能実習'),                                    color: '#c084fc' },
  ];

  // 計画月ごとの実績工数を雇用区分でフィルタして返す。filterDivsを渡すと、業務区分
  // チェックボックス（roleTypeFilter）駆動の対象div配列（'配送'を含みうる）で
  // 絞り込む（内部で'配送・栽培'・'配送・出荷'に展開）。省略時は既存の動作を
  // 完全に維持する（拠点別・表・3拠点サマリ・下段チャートの他の呼び出し元向け）
  function workHoursByEmpForPlanMonths(site, empMatcher, filterDivs) {
    const { employees, months: activeMonths } = getActiveData();
    const allowedDivs = filterDivs
      ? filterDivs.flatMap(d => d === '配送' ? ['配送・栽培', '配送・出荷'] : [d])
      : [...divs, '配送・栽培', '配送・出荷'];
    const emps = employees.filter(e => e.base === site && allowedDivs.includes(e.workType) && empMatcher(e));
    return planMonths.map(planMonth => {
      const ami = activeMonths.findIndex(m => normalizeMonth(m) === planMonth);
      if (ami < 0) return null;
      const total = emps.reduce((s, e) => s + (e.hours[ami] ?? 0), 0);
      return total > 0 ? Math.round(total * 10) / 10 : null;
    });
  }

  // 計画月ごとの人数を雇用区分でフィルタして返す（工数>0の人を1人と数える）。
  // workHoursByEmpForPlanMonths()と同様、栽培・出荷限定とする（filterDivs省略時）。
  // filterDivsを渡した場合はworkHoursByEmpForPlanMonths()と同じ展開ロジックで
  // allowedDivsを決定する
  function headcountByEmpForPlanMonths(site, empMatcher, filterDivs) {
    const { employees, months: activeMonths } = getActiveData();
    const allowedDivs = filterDivs
      ? filterDivs.flatMap(d => d === '配送' ? ['配送・栽培', '配送・出荷'] : [d])
      : divs;
    const emps = employees.filter(e => e.base === site && allowedDivs.includes(e.workType) && empMatcher(e));
    return planMonths.map(planMonth => {
      const ami = activeMonths.findIndex(m => normalizeMonth(m) === planMonth);
      if (ami < 0) return null;
      const count = emps.filter(e => (e.hours[ami] ?? 0) > 0).length;
      return count > 0 ? count : null;
    });
  }

  // ① 拠点別
  // planCmpSiteTabはグローバル変数（restoreSessionStateBeforeFirstLoad()で復元される）。
  // 未設定、または現在のavailSitesに存在しない値（例：拠点構成が変わった場合）の
  // ときのみ初期値を設定する。ここでlet宣言してしまうとローカルにシャドーイングされ、
  // 復元された値が反映されなくなるため、代入のみ行う（グローバルのlet宣言はトップレベルにある）
  const SITE_TABS = [...availSites, '全拠点合計'];
  if (!planCmpSiteTab || !SITE_TABS.includes(planCmpSiteTab)) {
    planCmpSiteTab = availSites[0] || 'いなべ';
  }

  // 月の数値比較用ヘルパー（renderSiteView内で共用）
  const mnum = m => { const [y, mo] = m.split('/').map(Number); return y * 100 + mo; };
  const ACTUAL_CUTOFF = mnum('2026/6');
  const HEADCOUNT_CUTOFF = mnum('2026/5'); // 人数実績は2026/5まで
  const BASE_MONTH = '2026/5';

  // 拠点ごとの標準工数合計・実績・予想データを構築。filterDivsを渡すと、業務区分
  // チェックボックス（roleTypeFilter）駆動の対象div配列で絞り込む（拠点サマリの
  // 下段チャート専用）。省略時は表タブ・3拠点サマリ向けに既存の動作を完全に維持する
  function computeSiteTotalData(site, filterDivs) {
    const stdTotalRaw = planMonths.map((_, mi) =>
      (filterDivs || divs).reduce((sum, div) => {
        const d = window._planCmpChartData2[`${site}-${div}`];
        if (!d) return sum;
        return sum + d.divRows.reduce((s, r) => {
          const res = calcRow(site, r, mi);
          return s + (res.h !== null ? res.h : 0);
        }, 0);
      }, 0) || null
    );
    const allActual = {};
    EMP_SERIES.forEach(et => { allActual[et.label] = workHoursByEmpForPlanMonths(site, et.match, filterDivs); });
    const baseIdx = planMonths.indexOf(BASE_MONTH);
    const baseH = {};
    EMP_SERIES.forEach(et => { baseH[et.label] = baseIdx >= 0 ? (allActual[et.label][baseIdx] ?? 0) : 0; });
    const techIncrement = planMonth => {
      const mn = mnum(planMonth);
      if (site === 'いなべ') return mn >= mnum('2026/8') ? 540 : 0;
      if (site === '群馬')   return mn >= mnum('2026/7') ? 180 : 0;
      if (site === '南丹')   return mn >= mnum('2026/8') ? 180 : 0;
      return 0;
    };
    const actualData = {}, forecastData = {};
    EMP_SERIES.forEach(et => {
      actualData[et.label] = planMonths.map((m, mi) =>
        mnum(m) <= ACTUAL_CUTOFF ? allActual[et.label][mi] : null
      );
      forecastData[et.label] = planMonths.map((m, mi) => {
        if (mnum(m) <= ACTUAL_CUTOFF) return null;
        if (et.label === '社員') return Math.round(baseH['社員'] * 10) / 10;
        if (et.label === '技能実習生') return Math.round((baseH['技能実習生'] + techIncrement(m)) * 10) / 10;
        return null;
      });
    });
    planMonths.forEach((m, mi) => {
      if (mnum(m) <= ACTUAL_CUTOFF) return;
      const std = stdTotalRaw[mi] ?? 0;
      const emp = forecastData['社員'][mi] ?? 0;
      const tech = forecastData['技能実習生'][mi] ?? 0;
      forecastData['パート'][mi] = Math.max(0, Math.round((std - emp - tech) * 10) / 10);
    });

    // 人数データ（実績: 〜2026/5、予想: 2026/7〜）
    const allActualCount = {};
    EMP_SERIES.forEach(et => { allActualCount[et.label] = headcountByEmpForPlanMonths(site, et.match, filterDivs); });
    const baseCount = {};
    EMP_SERIES.forEach(et => { baseCount[et.label] = baseIdx >= 0 ? (allActualCount[et.label][baseIdx] ?? 0) : 0; });
    // 2026/5時点のパート1人当たり工数
    const partHourPerPerson = baseCount['パート'] > 0 ? (baseH['パート'] / baseCount['パート']) : null;
    const actualCountData = {}, forecastCountData = {};
    EMP_SERIES.forEach(et => {
      actualCountData[et.label] = planMonths.map((m, mi) =>
        mnum(m) <= HEADCOUNT_CUTOFF ? allActualCount[et.label][mi] : null
      );
      forecastCountData[et.label] = planMonths.map((m, mi) => {
        if (mnum(m) <= ACTUAL_CUTOFF) return null; // 2026/6は空白
        if (et.label === '社員') return baseCount['社員'];
        if (et.label === '技能実習生') return baseCount['技能実習生'] + Math.round(techIncrement(m) / 180);
        if (et.label === 'パート') {
          if (!partHourPerPerson) return null;
          const fcH = forecastData['パート'][mi] ?? 0;
          return Math.round(fcH / partHourPerPerson * 10) / 10;
        }
        return null;
      });
    });

    return { stdTotalRaw, actualData, forecastData, actualCountData, forecastCountData };
  }

  // 標準工数合計 vs 勤務時間合計グラフを描画（単拠点 or 全拠点）
  // 「標準工数合計 vs 勤務時間合計」チャートの軸MAX算出用の実データ値一覧を返す。
  // std/actual/forecastはそれぞれ別スタックとして積み上げ表示されるため、
  // 実際にグラフ上で到達する高さ（＝スタック内の月ごとの合計）で判定する必要がある。
  // 雇用区分ごとの値を個別に見るだけだと、積み上げ後の実際の高さを過小評価してしまう
  function totalChartStackedValues(stdTotalRaw, actualDataMap, forecastDataMap) {
    const vm = visMonths();
    const actualTotals = stackedMonthlyTotals(vm, EMP_SERIES.map(et => ({ data: sl(actualDataMap[et.label]) })));
    const forecastTotals = stackedMonthlyTotals(vm, EMP_SERIES.map(et => ({ data: sl(forecastDataMap[et.label]) })));
    return [
      ...sl(stdTotalRaw).filter(v => v !== null),
      ...actualTotals,
      ...forecastTotals,
    ];
  }

  // opts.taskBreakdown（[{label, data, color}, ...]、1段目のallDivRows/stdByTaskを
  // そのまま流用）を渡すと「予定標準工数合計」を単一バーではなく、1段目と同じ
  // 工程別内訳（TASK_COLORS）の積み上げバーとして描画する。個々のタスク明細は
  // ツールチップには出さず、footer側の「標準工数合計」1行に集約する（tooltipの
  // labelコールバックで_stdGroupを弾く）。taskBreakdown未指定時は従来通り単一バー。
  function renderTotalChart(canvasId, stdTotalRaw, actualDataMap, forecastDataMap, opts) {
    const ctx = document.getElementById(canvasId)?.getContext('2d');
    if (!ctx) return;
    const extraDatasets = (opts && opts.extraDatasets) || [];
    const extraScales   = (opts && opts.extraScales)   || {};
    const taskBreakdown = (opts && opts.taskBreakdown) || null;
    const allVals = totalChartStackedValues(stdTotalRaw, actualDataMap, forecastDataMap);
    const yMax = (opts && opts.yMaxOverride !== undefined) ? opts.yMaxOverride : (computeSharedAxisMax([allVals], 100) || undefined);
    const stdDatasets = taskBreakdown
      ? taskBreakdown.map(t => ({
          type: 'bar', label: t.label, data: t.data,
          backgroundColor: t.color + 'cc', borderColor: t.color, borderWidth: 0,
          stack: 'std', yAxisID: 'y', order: 2, _stdGroup: true,
        }))
      : [{
          type: 'bar', label: '予定標準工数合計', data: sl(stdTotalRaw),
          backgroundColor: '#38bdf866', borderColor: '#38bdf8', borderWidth: 1,
          stack: 'std', yAxisID: 'y', order: 2, _stdGroup: true,
        }];
    const datasets = [
      ...stdDatasets,
      ...EMP_SERIES.map(et => ({
        type: 'bar', label: `${et.label}（実績）`, data: sl(actualDataMap[et.label]),
        backgroundColor: et.color + '99', borderColor: et.color, borderWidth: 0,
        stack: 'actual', yAxisID: 'y', order: 1,
      })),
      ...EMP_SERIES.map(et => ({
        type: 'bar', label: `${et.label}（予想）`, data: sl(forecastDataMap[et.label]),
        backgroundColor: et.color + '44', borderColor: et.color, borderWidth: 1,
        // 実績・予想は月ごとに排他（ACTUAL_CUTOFFで分かれる）ため、同じstack名に
        // まとめても積み上げ結果は変わらない。stack名を分けたままだと、Chart.jsが
        // 「実績」「予想」を別スロットとして幅を確保してしまい、月ごとに必ずどちらか
        // が空スロットになって予定標準工数バーとの間に隙間ができるため統一する
        stack: 'actual', yAxisID: 'y', order: 1,
      })),
      ...extraDatasets,
    ];
    planCmpChartInstances[canvasId] = new Chart(ctx, {
      data: { labels: visMonths(), datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: '#8892a4', font: { size: 10 }, boxWidth: 10, padding: 6 } },
          tooltip: {
            callbacks: {
              label: ctx => {
                if (ctx.parsed.y == null) return null;
                // 工程別内訳バーの明細行はツールチップに出さない（footerの「標準工数合計」に集約）
                if (ctx.dataset._stdGroup) return null;
                if (ctx.dataset._countLine) return `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('ja-JP')} 人`;
                return `${ctx.dataset.label}: ${Math.round(ctx.parsed.y).toLocaleString('ja-JP')} h`;
              },
              footer: items => {
                const workTotal = items.filter(i => (i.dataset.stack === 'actual' || i.dataset.stack === 'forecast') && !i.dataset._countLine && i.parsed.y != null).reduce((s, i) => s + i.parsed.y, 0);
                const stdTotal  = items.filter(i => i.dataset._stdGroup && i.parsed.y != null).reduce((s, i) => s + i.parsed.y, 0);
                const lines = [];
                if (workTotal > 0) lines.push(`勤務時間合計: ${Math.round(workTotal).toLocaleString('ja-JP')} h`);
                if (stdTotal  > 0) lines.push(`標準工数合計: ${Math.round(stdTotal).toLocaleString('ja-JP')} h`);
                return lines;
              },
            },
          },
        },
        scales: {
          // barPercentage: 1.0で各棒（予定標準工数〔工程別〕／実績・予想）が自分の
          // 枠内をフルに使うようにし、隣接する2本の棒の間の隙間を詰める
          x: { stacked: true, barPercentage: 1.0, ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e2235' } },
          y: { stacked: true, position: 'left', ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} h` }, grid: { color: '#1e2235' }, suggestedMin: 0, max: yMax, title: { display: true, text: 'h', color: '#8892a4', font: { size: 10 } } },
          ...extraScales,
        },
      },
    });
  }

  // 拠点タブ(いなべ/群馬/南丹/全拠点合計)のHTML断片。固定エリア側(renderSiteTabBarFixed)から呼ぶ。
  // 拠点サマリモード（'sitesummary'）は栽培+出荷を合算した拠点別サマリという性質上、
  // 「全拠点合計」ボタンは対象外とし、いなべ/群馬/南丹の3拠点のみ表示する
  function siteTabBarHtml() {
    const tabs = planCmpSubtab === 'sitesummary' ? availSites : SITE_TABS;
    return tabs.map(t =>
      `<button class="plancmp2-site-tab${planCmpSiteTab === t ? ' active' : ''}" data-site="${t}"
        style="padding:4px 14px;border-radius:6px;border:1px solid ${planCmpSiteTab === t ? '#38bdf8' : '#3a3f5c'};background:${planCmpSiteTab === t ? '#38bdf8' : 'transparent'};color:${planCmpSiteTab === t ? '#0f1117' : '#8892a4'};font-size:0.8rem;cursor:pointer;font-weight:${planCmpSiteTab === t ? '600' : '400'}">${t}</button>`
    ).join('');
  }

  // 拠点タブは表示月ドロップダウンと同じ固定エリア(#plancmp2-site-tabbar-fixed)に表示する。
  // 'site'サブタブの時だけ表示し、他サブタブでは非表示にする
  function renderSiteTabBarFixed() {
    const el = document.getElementById('plancmp2-site-tabbar-fixed');
    if (!el) return;
    // 'sitesummary'（拠点サマリ）も拠点タブで選択中拠点を切り替えられるようにする
    if (planCmpSubtab !== 'site' && planCmpSubtab !== 'sitesummary') { el.style.display = 'none'; el.innerHTML = ''; return; }
    // 拠点サマリモードには「全拠点合計」が存在しないため、他モードから切り替えた
    // 直後にplanCmpSiteTabが「全拠点合計」のままだった場合は先頭拠点に切り替える
    if (planCmpSubtab === 'sitesummary' && planCmpSiteTab === '全拠点合計') {
      planCmpSiteTab = availSites[0];
    }
    el.style.display = 'flex';
    el.innerHTML = siteTabBarHtml();
    el.querySelectorAll('.plancmp2-site-tab').forEach(btn => {
      btn.onclick = () => {
        planCmpSiteTab = btn.dataset.site;
        renderContent();
        saveSessionState();
      };
    });
  }

  function renderSiteView() {
    const content = document.getElementById('compare2-content');
    const vm = visMonths();

    let html = '';

    if (planCmpSiteTab === '全拠点合計') {
      divs.forEach(div => {
        html += `<div class="schart-section">
          <div class="schart-header">${div}（全拠点合計）</div>
          ${chartWrapHtml(`plancmp2-all-${div}`, vm.length, { heightPx: 320, inlineHeight: true, forceResponsive: true })}
        </div>`;
      });
    } else {
      const site = planCmpSiteTab;
      divs.forEach(div => {
        html += `<div class="schart-section">
          <div class="schart-header">${div}</div>
          ${chartWrapHtml(`plancmp2-${site}-${div}`, vm.length, { heightPx: 320, inlineHeight: true, forceResponsive: true })}
        </div>`;
      });
    }

    content.innerHTML = html;

    if (planCmpSiteTab === '全拠点合計') {
      // 全拠点合計: 栽培・出荷チャート（3拠点集計）
      divs.forEach(div => {
        const ctx = document.getElementById(`plancmp2-all-${div}`)?.getContext('2d');
        if (!ctx) return;
        const divRows = rows.filter(r => r.div === div);
        // 実績工数: 全拠点の actualH を合計
        const allActualH = planMonths.map((_, mi) =>
          availSites.reduce((s, site) => s + (window._planCmpChartData2[`${site}-${div}`]?.actualH[mi] ?? 0), 0) || null
        );
        // 予定標準: 全拠点合計で各タスク行を集計
        const taskData = divRows.map(r =>
          planMonths.map((_, mi) => {
            const total = availSites.reduce((s, site) => {
              const res = calcRow(site, r, mi);
              return s + (res.h !== null ? res.h : 0);
            }, 0);
            return total > 0 ? Math.round(total * 10) / 10 : null;
          })
        );
        // 計画量（右軸）: 全拠点合計
        const volData = planMonths.map((_, mi) =>
          availSites.reduce((s, site) => {
            const v = planVolume(site, div, mi);
            return s + (v !== null ? v : 0);
          }, 0) || null
        );
        // 予定標準（std）は全タスク行が積み上げ表示されるため、軸MAXはタスクごとの
        // 個別値ではなく、月ごとにタスクを跨いで合計した値（実際にグラフ上で到達する
        // 高さ）で判定する必要がある。taskData/allActualHとも未スライスの同じ
        // planMonths基準のインデックスなので、ここで合計してからsl()する
        const stdMonthlyTotalsAll = planMonths.map((_, mi) => taskData.reduce((s, d) => s + (d[mi] || 0), 0));
        const allAgg = threeSiteMergeAgg(div, null);
        // 実績棒（左）は未来月も空欄のまま（本来の実績のみ）とし、標準労働時間棒
        // （中央・新規）を過去/未来問わず全ての月に表示する（栽培・出荷共通）
        const stdHoursDs = threeSiteMergeStdHoursDatasets(allAgg, [div], null, { stack: 'stdhours' });
        const stdHoursTotals = planMonths.map((_, mi) => threeSiteMergeStdHoursTotal(allAgg, [div], null, mi));
        const allYValues = [
          ...sl(allActualH).filter(v => v !== null),
          ...sl(stdMonthlyTotalsAll).filter(v => v !== null),
          ...sl(stdHoursTotals).filter(v => v !== null),
        ];
        const yMax = computeSharedAxisMax([allYValues], 100) || undefined;
        const volMax = computeSharedAxisMax([sl(volData).filter(v => v !== null)], 1000) || undefined;
        const datasets = [
          {
            type: 'bar', label: '実績工数', data: sl(allActualH),
            backgroundColor: '#f8717199', borderColor: '#f87171', borderWidth: 1,
            stack: 'actual', yAxisID: 'y', order: 1,
          },
          ...stdHoursDs.map(ds => ({ ...ds, data: sl(ds.data) })),
          ...divRows.map((r, ri) => ({
            type: 'bar', label: r.task, data: sl(taskData[ri]),
            backgroundColor: TASK_COLORS[ri % TASK_COLORS.length] + 'cc',
            borderColor: TASK_COLORS[ri % TASK_COLORS.length],
            borderWidth: 0, stack: 'std', yAxisID: 'y', order: 2, _stdGroup: true,
          })),
          {
            type: 'line', label: DIV_METRIC[div], data: sl(volData),
            borderColor: '#94a3b8', backgroundColor: 'transparent',
            borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#94a3b8',
            tension: 0.3, yAxisID: 'y2', order: 0,
            _volumeLine: true, _unit: DIV_UNIT[div],
          },
        ];
        planCmpChartInstances[`plancmp2-all-${div}`] = new Chart(ctx, {
          data: { labels: visMonths(), datasets },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { labels: { color: '#8892a4', font: { size: 10 }, boxWidth: 10, padding: 6 } },
              tooltip: tooltipOpts(true),
            },
            scales: {
              x: { stacked: true, ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e2235' } },
              y: { stacked: true, position: 'left', ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} h` }, grid: { color: '#1e2235' }, suggestedMin: 0, max: yMax, title: { display: true, text: 'h', color: '#8892a4', font: { size: 10 } } },
              y2: {
                position: 'right',
                ticks: { color: '#64748b', font: { size: 10 }, callback: v => v.toLocaleString('ja-JP') },
                grid: { drawOnChartArea: false },
                suggestedMin: 0, max: volMax,
                title: { display: true, text: DIV_UNIT[div], color: '#64748b', font: { size: 10 } },
              },
            },
          },
        });
      });
    } else {
      // 単拠点: 栽培・出荷チャート
      const site = planCmpSiteTab;

      // 軸MAXの統一（全拠点合計は対象外）：いなべ・群馬・南丹の3拠点間で、
      // 同じチャート（栽培/出荷）の左軸・右軸それぞれの最大値を揃えるため、
      // 現在表示中のsiteだけでなくavailSites(実拠点)全体からMAXを算出する
      const siteValueArraysAllSites = divs.map(div =>
        availSites.map(s => {
          const d = window._planCmpChartData2[`${s}-${div}`];
          if (!d) return [];
          // 3拠点マージ：標準労働時間棒（中央・新規、全月表示）の実効的な高さも
          // 軸MAX算出に含める（栽培・出荷共通）
          const agg = threeSiteMergeAgg(div, s);
          return [...planCmpSelected].flatMap(mi => {
            const stdTotal = d.divRows.reduce((sum, r) => {
              const res = calcRow(s, r, mi);
              return sum + (res.h !== null ? res.h : 0);
            }, 0);
            return [stdTotal, d.actualH[mi], threeSiteMergeStdHoursTotal(agg, [div], s, mi)];
          });
        })
      );
      // volumeLineDataset()も拠点ごとに1回だけ計算し、下のチャート生成ループで再利用する
      const volDsAllSites = {};
      divs.forEach(div => {
        availSites.forEach(s => { volDsAllSites[`${s}-${div}`] = volumeLineDataset(s, div); });
      });

      const divYMax = {};
      const divVolMax = {};
      divs.forEach((div, di) => {
        divYMax[div] = computeSharedAxisMax(siteValueArraysAllSites[di], 100);
        divVolMax[div] = computeSharedAxisMax(
          availSites.map(s => sl(volDsAllSites[`${s}-${div}`].data).filter(v => v !== null)),
          1000
        );
      });

      divs.forEach(div => {
        const key = `${site}-${div}`;
        const d = window._planCmpChartData2[key];
        const ctx = document.getElementById(`plancmp2-${key}`)?.getContext('2d');
        if (!d || !ctx) return;
        const { divRows, actualH } = d;
        const datasets = [];
        datasets.push({
          type: 'bar', label: '実績工数', data: sl(actualH),
          backgroundColor: '#f8717199', borderColor: '#f87171', borderWidth: 1,
          stack: 'actual', yAxisID: 'y', order: 1,
        });
        // 実績棒（左）は未来月も空欄のままとし、標準労働時間棒（中央・新規）を
        // 過去/未来問わず全ての月に表示する（この拠点分のみ、栽培・出荷共通）
        threeSiteMergeStdHoursDatasets(threeSiteMergeAgg(div, site), [div], site, { stack: 'stdhours' })
          .forEach(ds => datasets.push({ ...ds, data: sl(ds.data) }));
        divRows.forEach((r, ri) => {
          const fullData = planMonths.map((_, mi) => {
            const res = calcRow(site, r, mi);
            return res.h !== null ? Math.round(res.h * 10) / 10 : null;
          });
          datasets.push({
            type: 'bar', label: r.task, data: sl(fullData),
            backgroundColor: TASK_COLORS[ri % TASK_COLORS.length] + 'cc',
            borderColor: TASK_COLORS[ri % TASK_COLORS.length],
            borderWidth: 0, stack: 'std', yAxisID: 'y', order: 2, _stdGroup: true,
          });
        });
        const volDs = volDsAllSites[`${site}-${div}`];
        const slicedVolDs = { ...volDs, data: sl(volDs.data) };
        datasets.push(slicedVolDs);
        planCmpChartInstances[key] = new Chart(ctx, {
          data: { labels: visMonths(), datasets },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { labels: { color: '#8892a4', font: { size: 10 }, boxWidth: 10, padding: 6 } },
              tooltip: tooltipOpts(true),
            },
            scales: {
              x: { stacked: true, ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e2235' } },
              y: { stacked: true, position: 'left', ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} h` }, grid: { color: '#1e2235' }, suggestedMin: 0, max: divYMax[div], title: { display: true, text: 'h', color: '#8892a4', font: { size: 10 } } },
              y2: y2Axis(div, slicedVolDs.data, divVolMax[div] || undefined),
            },
          },
        });
      });
    }
  }

  // ③ 表ビュー
  function renderTableView() {
    const content = document.getElementById('compare2-content');
    const vm = visMonths();
    const cellStyle = 'padding:5px 10px;text-align:right;font-size:0.78rem;white-space:nowrap;border:1px solid #2a2f4a';
    const headStyle = 'padding:5px 10px;text-align:center;font-size:0.75rem;white-space:nowrap;border:1px solid #2a2f4a;background:#1a1f35;color:#8892a4';
    const rowHeadStyle = 'padding:5px 10px;text-align:left;font-size:0.78rem;white-space:nowrap;border:1px solid #2a2f4a;background:#12172a;color:#cbd5e1;min-width:160px';
    const sectionHeadStyle = 'padding:5px 10px;text-align:left;font-size:0.78rem;font-weight:600;border:1px solid #2a2f4a;background:#0f1117;color:#38bdf8;';

    const fmt = (v, unit) => v === null || v === undefined ? '<span style="color:#3a3f5c">-</span>' : `${typeof v === 'number' ? (unit === 'h' ? Math.round(v).toLocaleString('ja-JP') : (Math.round(v * 10) / 10).toLocaleString('ja-JP')) : v}`;

    function buildSiteTable(site, siteLabel, siteData) {
      const { stdTotalRaw, actualData, forecastData, actualCountData, forecastCountData } = siteData;
      const months = visMonths();
      const mi = i => planMonths.indexOf(months[i]);

      const perPerson = (hours, count) => {
        if (hours === null || count === null || count === 0) return null;
        return Math.round(hours / count * 10) / 10;
      };
      const rows = [
        { label: '予定標準工数合計 (h)', unit: 'h', isSection: true },
        { label: '　予定標準工数合計', unit: 'h', getData: i => stdTotalRaw[mi(i)] },
        { label: '勤務時間 実績 (h)', unit: 'h', isSection: true },
        ...EMP_SERIES.map(et => ({ label: `　${et.label}（実績）`, unit: 'h', getData: i => actualData[et.label][mi(i)] })),
        { label: '勤務時間 予想 (h)', unit: 'h', isSection: true },
        ...EMP_SERIES.map(et => ({ label: `　${et.label}（予想）`, unit: 'h', getData: i => forecastData[et.label][mi(i)] })),
        { label: '人数 実績 (人)', unit: '人', isSection: true },
        ...EMP_SERIES.map(et => ({ label: `　${et.label}（実績）`, unit: '人', getData: i => actualCountData[et.label][mi(i)] })),
        { label: '人数 予想 (人)', unit: '人', isSection: true },
        ...EMP_SERIES.map(et => ({ label: `　${et.label}（予想）`, unit: '人', getData: i => forecastCountData[et.label][mi(i)] })),
        { label: '1人当たり勤務時間 実績 (h/人)', unit: 'h', isSection: true },
        ...EMP_SERIES.map(et => ({ label: `　${et.label}（実績）`, unit: 'h', getData: i => perPerson(actualData[et.label][mi(i)], actualCountData[et.label][mi(i)]) })),
        { label: '1人当たり勤務時間 予想 (h/人)', unit: 'h', isSection: true },
        ...EMP_SERIES.map(et => ({ label: `　${et.label}（予想）`, unit: 'h', getData: i => perPerson(forecastData[et.label][mi(i)], forecastCountData[et.label][mi(i)]) })),
      ];

      const headerCells = months.map(m => `<th style="${headStyle}">${m}</th>`).join('');
      const bodyRows = rows.map(row => {
        if (row.isSection) {
          return `<tr><td colspan="${months.length + 1}" style="${sectionHeadStyle}">${row.label}</td></tr>`;
        }
        const cells = months.map((_, i) => {
          const v = row.getData(i);
          return `<td style="${cellStyle};color:${v === null ? '#3a3f5c' : '#e2e8f0'}">${fmt(v, row.unit)}</td>`;
        }).join('');
        return `<tr><td style="${rowHeadStyle}">${row.label}</td>${cells}</tr>`;
      }).join('');

      return `<div class="schart-section" style="margin-bottom:24px">
        <div class="schart-header">${siteLabel}</div>
        <div style="overflow-x:auto">
          <table style="border-collapse:collapse;width:100%">
            <thead><tr><th style="${rowHeadStyle};background:#12172a">項目</th>${headerCells}</tr></thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>
      </div>`;
    }

    let html = '';
    // 各拠点
    availSites.forEach(site => {
      html += buildSiteTable(site, site, computeSiteTotalData(site));
    });

    // 全拠点合計
    const siteDataList = availSites.map(s => computeSiteTotalData(s));
    const allStdTotalRaw = planMonths.map((_, mi) =>
      siteDataList.reduce((sum, d) => sum + (d.stdTotalRaw[mi] ?? 0), 0) || null
    );
    const allActualData = {}, allForecastData = {}, allActualCountData = {}, allForecastCountData = {};
    EMP_SERIES.forEach(et => {
      allActualData[et.label] = planMonths.map((_, mi) => {
        const t = siteDataList.reduce((s, d) => s + (d.actualData[et.label][mi] ?? 0), 0);
        return t > 0 ? Math.round(t * 10) / 10 : null;
      });
      allForecastData[et.label] = planMonths.map((m, mi) => {
        if (mnum(m) <= ACTUAL_CUTOFF) return null;
        const t = siteDataList.reduce((s, d) => s + (d.forecastData[et.label][mi] ?? 0), 0);
        return t > 0 ? Math.round(t * 10) / 10 : null;
      });
      allActualCountData[et.label] = planMonths.map((_, mi) => {
        const t = siteDataList.reduce((s, d) => s + (d.actualCountData[et.label][mi] ?? 0), 0);
        return t > 0 ? t : null;
      });
      allForecastCountData[et.label] = planMonths.map((m, mi) => {
        if (mnum(m) <= ACTUAL_CUTOFF) return null;
        const t = siteDataList.reduce((s, d) => s + (d.forecastCountData[et.label][mi] ?? 0), 0);
        return t > 0 ? Math.round(t * 10) / 10 : null;
      });
    });
    html += buildSiteTable('all', '全拠点合計', {
      stdTotalRaw: allStdTotalRaw,
      actualData: allActualData,
      forecastData: allForecastData,
      actualCountData: allActualCountData,
      forecastCountData: allForecastCountData,
    });

    content.innerHTML = html;
  }

  // 3拠点サマリ用：computeSiteTotalData()の結果（拠点ごと）を、月・雇用形態ごとに
  // 3拠点合計へ集約する（mergeThreeSiteMergeAggAcrossDivsと同じ、値がある拠点分だけ
  // 合算する考え方。null（未実績・未予想の月）はどの拠点も同じ月で揃っている想定）
  function mergeSiteTotalDataAcrossSites(dataArray) {
    const sumArrays = arrs => planMonths.map((_, mi) => {
      let sum = 0, any = false;
      arrs.forEach(arr => {
        const v = arr[mi];
        if (v !== null && v !== undefined) { sum += v; any = true; }
      });
      return any ? Math.round(sum * 10) / 10 : null;
    });
    const stdTotalRaw = sumArrays(dataArray.map(d => d.stdTotalRaw));
    const actualData = {}, forecastData = {}, actualCountData = {}, forecastCountData = {};
    EMP_SERIES.forEach(et => {
      actualData[et.label] = sumArrays(dataArray.map(d => d.actualData[et.label]));
      forecastData[et.label] = sumArrays(dataArray.map(d => d.forecastData[et.label]));
      actualCountData[et.label] = sumArrays(dataArray.map(d => d.actualCountData[et.label]));
      forecastCountData[et.label] = sumArrays(dataArray.map(d => d.forecastCountData[et.label]));
    });
    return { stdTotalRaw, actualData, forecastData, actualCountData, forecastCountData };
  }

  // ② 3拠点サマリ：拠点サマリモード（renderSiteSummaryView）と同じ2段構成に、
  // 常に3拠点合算（sitesToShow = availSites固定）で表示する
  function renderSummaryView() {
    const content = document.getElementById('compare2-content');
    const sitesToShow = availSites;
    const vm = visMonths();

    let html = `<div class="schart-section">
      <div class="schart-header">実績工数（業務区分別）</div>
      ${chartWrapHtml('plansum2-combined', vm.length, { heightPx: 650, inlineHeight: true, forceResponsive: true })}
    </div>`;
    html += `<div class="schart-section">
      <div class="schart-header">実績工数（雇用区分別）</div>
      ${chartWrapHtml('plansum2-emp', vm.length, { heightPx: 320, inlineHeight: true, forceResponsive: true })}
    </div>`;
    content.innerHTML = html;

    // 業務区分チェックボックス（画面上部のroleTypeFilter）に応じて、この3拠点サマリ
    // チャート専用に対象divを動的に決定する（拠点サマリと同じロジック）。外側
    // スコープのdivs（['栽培','出荷','配送']、拠点別・表の各サブタブで共有）は
    // ここでは変更せず、この関数内だけのローカル変数としてシャドーイングする
    const divs = [];
    if (roleTypeFilter.has('栽培')) divs.push('栽培');
    if (roleTypeFilter.has('出荷')) divs.push('出荷');
    if (roleTypeFilter.has('配送・栽培') || roleTypeFilter.has('配送・出荷')) divs.push('配送');

    // 実績工数：栽培・出荷・配送それぞれのactualHを3拠点分合算。雇用形態フィルタ
    // （empTypeFilter）はwindow._planCmpChartData2側（workHoursForPlanMonths()内の
    // getActiveData()）で既に反映済みのため、ここでは業務区分（divs）の絞り込みのみ行う
    const actualByDiv = {};
    divs.forEach(div => {
      const actualBySite = sitesToShow.map(site => window._planCmpChartData2[`${site}-${div}`]?.actualH || planMonths.map(() => null));
      actualByDiv[div] = sl(planMonths.map((_, mi) => actualBySite.reduce((s, arr) => s + (arr[mi] || 0), 0)));
    });
    const actualMonthlyTotals = vm.map((_, mi) => divs.reduce((s, div) => s + (actualByDiv[div][mi] || 0), 0));

    // 予定標準工数（工程別）：栽培・出荷のタスク行を区別せず1つの積み上げグループとして
    // 3拠点分を合算
    const allDivRows = rows.filter(r => divs.includes(r.div));
    const stdByTask = allDivRows.map(r => sl(planMonths.map((_, mi) => {
      const total = sitesToShow.reduce((s, site) => {
        const res = calcRow(site, r, mi);
        return s + (res.h !== null ? res.h : 0);
      }, 0);
      return total > 0 ? Math.round(total * 10) / 10 : null;
    })));
    const stdMonthlyTotals = vm.map((_, mi) => stdByTask.reduce((s, data) => s + (data[mi] || 0), 0));

    // threeSiteMergeAgg()と同じロジックだが、雇用形態チェックボックス（empTypeFilter）を
    // 適用したフィルタ済み版（拠点サマリと同じロジック、site=null＝3拠点合算版）。
    // 既存のthreeSiteMergeAgg()・threeSiteMergeAggFromRows()自体は変更しない
    function threeSiteMergeAggFilteredByEmpType(div, site) {
      if (!mergeData) return null;
      const baseMatch = r => r.div === div && (site == null || r.site === site) && r.prj !== '';
      const rowsFiltered = applyEmpTypeFilter(mergeData.rows.filter(baseMatch));
      const matched = rowsFiltered.filter(r => isThreeSiteMergeActiveFlag(r.activeFlag));
      const newStaffMatched = rowsFiltered.filter(r => isThreeSiteMergeNewStaffFlag(r.activeFlag));
      if (!matched.length && !newStaffMatched.length) return null;
      const stdTotalB1 = Math.round(matched.reduce((s, r) => s + r.stdHours, 0) * 10) / 10;
      const newStaffByYm = {};
      mergeData.monthYms.forEach(ym => {
        const eligible = newStaffMatched.filter(r => r.startYm == null || r.startYm <= ym);
        if (eligible.length) newStaffByYm[ym] = Math.round(eligible.reduce((s, r) => s + r.stdHours, 0) * 10) / 10;
      });
      const deltaCombined = threeSiteMergeAggFromRows([...matched, ...newStaffMatched]);
      return { stdTotalB1, newStaffByYm, deltaByYm: deltaCombined ? deltaCombined.maxTotalByYm : {} };
    }

    // 標準労働時間（青・黄・緑）：栽培・出荷それぞれのthreeSiteMergeAggFilteredByEmpType()
    // （雇用形態フィルタ適用済み）をdiv方向にmergeThreeSiteMergeAggAcrossDivsで合算
    const mergedAgg = mergeThreeSiteMergeAggAcrossDivs(divs.map(div => threeSiteMergeAggFilteredByEmpType(div, null)));
    const stdHoursDs = threeSiteMergeStdHoursDatasets(mergedAgg, divs, null, { stack: 'stdhours', labelSuffix: '（3拠点合計）' });
    const stdHoursTotals = sl(planMonths.map((_, mi) => threeSiteMergeStdHoursTotal(mergedAgg, divs, null, mi)));

    // 軸のMAX値専用：業務区分（栽培/出荷/配送）・雇用形態のチェック状態に関わらず、
    // 「全部ON」を仮定した場合の実績・予定標準工数・標準労働時間の月別合計を算出する
    // （拠点サマリと同じロジック、site=null版）。実際に描画される棒（actualByDiv・
    // stdByTask・stdHoursDs、上のdivsベースの計算）自体は変更せず、sharedMaxの算出に
    // のみこちらを使うことで、チェックボックスの切り替えで軸の高さが変動しないようにする
    const ALL_DIVS = ['栽培', '出荷', '配送'];
    function actualHoursForPlanMonthsAllEmpTypes(site, typeFilter) {
      const { employees, months: activeMonths } = getActiveData();
      const emps = employees.filter(e => e.base === site && e.workType && typeFilter(e.workType));
      return planMonths.map(planMonth => {
        const ami = activeMonths.findIndex(m => normalizeMonth(m) === planMonth);
        if (ami < 0) return null;
        const total = emps.reduce((s, e) => s + (e.hours[ami] ?? 0), 0);
        return total > 0 ? Math.round(total * 10) / 10 : null;
      });
    }
    const actualByDivAllOn = {};
    ALL_DIVS.forEach(div => {
      const typeFilter = div === '栽培'
        ? wt => workTypeClass(wt) === 'wt-栽培'
        : div === '配送'
          ? wt => workTypeClass(wt) === 'wt-配送'
          : wt => workTypeClass(wt) === 'wt-出荷';
      const actualBySite = sitesToShow.map(site => actualHoursForPlanMonthsAllEmpTypes(site, typeFilter));
      actualByDivAllOn[div] = sl(planMonths.map((_, mi) => actualBySite.reduce((s, arr) => s + (arr[mi] || 0), 0)));
    });
    const actualMonthlyTotalsAllOn = vm.map((_, mi) => ALL_DIVS.reduce((s, div) => s + (actualByDivAllOn[div][mi] || 0), 0));

    const allDivRowsAllOn = rows.filter(r => ALL_DIVS.includes(r.div));
    const stdByTaskAllOn = allDivRowsAllOn.map(r => sl(planMonths.map((_, mi) => {
      const total = sitesToShow.reduce((s, site) => {
        const res = calcRow(site, r, mi);
        return s + (res.h !== null ? res.h : 0);
      }, 0);
      return total > 0 ? Math.round(total * 10) / 10 : null;
    })));
    const stdMonthlyTotalsAllOn = vm.map((_, mi) => stdByTaskAllOn.reduce((s, data) => s + (data[mi] || 0), 0));

    const mergedAggAllOn = mergeThreeSiteMergeAggAcrossDivs(ALL_DIVS.map(div => threeSiteMergeAgg(div, null)));
    const stdHoursTotalsAllOn = sl(planMonths.map((_, mi) => threeSiteMergeStdHoursTotal(mergedAggAllOn, ALL_DIVS, null, mi)));

    const sharedMax = computeSharedAxisMax([actualMonthlyTotalsAllOn, stdMonthlyTotalsAllOn, stdHoursTotalsAllOn], 100);

    // 折れ線（収穫量・出荷量）：3拠点分を合算。配送は生産量指標を持たないため、
    // 動的なdivsではなく栽培・出荷に固定する（拠点サマリと同じ理由）
    const volDataByDiv = {};
    ['栽培', '出荷'].forEach(div => {
      volDataByDiv[div] = sl(planMonths.map((_, mi) =>
        sitesToShow.reduce((s, site) => {
          const v = planVolume(site, div, mi);
          return s + (v !== null ? v : 0);
        }, 0) || null
      ));
    });
    const volMax = computeSharedAxisMax([volDataByDiv['栽培'], volDataByDiv['出荷']], 1000) || undefined;

    const ctx = document.getElementById('plansum2-combined')?.getContext('2d');
    if (ctx) {
      const datasets = [];
      // 実績工数：業務区分チェックボックスで選択されているdivだけ棒を生成する
      // （拠点サマリと同じ配色。栽培＝赤、出荷＝オレンジ、配送＝シアン）
      const ACTUAL_BAR_COLORS = { '栽培': '#f87171', '出荷': '#fb923c', '配送': '#22d3ee' };
      divs.forEach(div => {
        const color = ACTUAL_BAR_COLORS[div];
        datasets.push({
          type: 'bar', label: `${div}（実績）`, data: actualByDiv[div],
          backgroundColor: color + '99', borderColor: color, borderWidth: 1,
          stack: 'actual', order: 1, _actualGroup: true,
        });
      });
      stdHoursDs.forEach(ds => datasets.push({ ...ds, data: sl(ds.data) }));
      allDivRows.forEach((r, ri) => {
        datasets.push({
          type: 'bar', label: r.task, data: stdByTask[ri],
          backgroundColor: TASK_COLORS[ri % TASK_COLORS.length] + 'cc',
          borderColor: TASK_COLORS[ri % TASK_COLORS.length],
          borderWidth: 0, stack: 'std', order: 2, _stdGroup: true,
        });
      });
      datasets.push({
        type: 'line', label: DIV_METRIC['栽培'], data: volDataByDiv['栽培'],
        borderColor: '#94a3b8', backgroundColor: 'transparent',
        borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#94a3b8',
        tension: 0.3, yAxisID: 'y2', order: 0,
        _volumeLine: true, _unit: DIV_UNIT['栽培'],
      });
      datasets.push({
        type: 'line', label: DIV_METRIC['出荷'], data: volDataByDiv['出荷'],
        borderColor: '#c084fc', backgroundColor: 'transparent',
        borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#c084fc',
        tension: 0.3, yAxisID: 'y2', order: 0,
        _volumeLine: true, _unit: DIV_UNIT['出荷'],
      });
      planCmpChartInstances['sum-combined'] = new Chart(ctx, {
        data: { labels: vm, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { labels: { color: '#8892a4', font: { size: 10 }, boxWidth: 10, padding: 6 } },
            tooltip: tooltipOpts(true, true),
          },
          scales: {
            x: { stacked: true, ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e2235' } },
            y: {
              stacked: true, position: 'left',
              ticks: { color: '#8892a4', font: { size: 11 }, callback: v => `${v} h` },
              grid: { color: '#1e2235' }, suggestedMin: 0, max: sharedMax,
              title: { display: true, text: 'h', color: '#8892a4', font: { size: 10 } },
            },
            y2: {
              position: 'right',
              ticks: { color: '#64748b', font: { size: 10 }, callback: v => v.toLocaleString('ja-JP') },
              grid: { drawOnChartArea: false },
              suggestedMin: 0, max: volMax,
              title: { display: true, text: 'kg', color: '#64748b', font: { size: 10 } },
            },
          },
        },
      });
    }

    // 2段目：3拠点分のcomputeSiteTotalData()をmergeSiteTotalDataAcrossSitesで合算し、
    // renderTotalChart()に渡す。「予定標準工数合計」バーは1段目で計算済みのallDivRows/
    // stdByTaskをそのまま再利用し、工程別内訳（TASK_COLORS）の積み上げバーとして表示する
    // （二重計算を避けるため、ここでのcalcRow()再計算は行わない）
    {
      const allSitesTotalData = availSites.map(s => computeSiteTotalData(s, divs));
      const merged = mergeSiteTotalDataAcrossSites(allSitesTotalData);
      const { stdTotalRaw, actualData, forecastData, actualCountData, forecastCountData } = merged;
      const taskBreakdown = allDivRows.map((r, ri) => ({
        label: r.task, data: stdByTask[ri], color: TASK_COLORS[ri % TASK_COLORS.length],
      }));
      const totalYMax = computeSharedAxisMax(
        [totalChartStackedValues(stdTotalRaw, actualData, forecastData)],
        100
      ) || undefined;
      const siteCountMax = computeSharedAxisMax(
        [EMP_SERIES.flatMap(et => [
          ...sl(actualCountData[et.label]).filter(v => v !== null),
          ...sl(forecastCountData[et.label]).filter(v => v !== null),
        ])],
        1
      ) || undefined;
      const siteCountDatasets = EMP_SERIES.flatMap(et => [
        {
          type: 'line', label: `${et.label}人数（実績）`, data: sl(actualCountData[et.label]),
          borderColor: et.color, backgroundColor: 'transparent',
          borderWidth: 2, pointRadius: 3, pointBackgroundColor: et.color,
          tension: 0.3, yAxisID: 'y2', order: 0, _countLine: true, spanGaps: true,
        },
        {
          type: 'line', label: `${et.label}人数（予想）`, data: sl(forecastCountData[et.label]),
          borderColor: et.color, backgroundColor: 'transparent',
          borderWidth: 2, borderDash: [5, 4],
          pointRadius: 3, pointBackgroundColor: et.color, pointBorderColor: et.color,
          tension: 0.3, yAxisID: 'y2', order: 0, _countLine: true, spanGaps: true,
        },
      ]);
      const siteCountScale = {
        y2: {
          position: 'right',
          ticks: { color: '#64748b', font: { size: 10 }, callback: v => `${v} 人` },
          grid: { drawOnChartArea: false },
          suggestedMin: 0, max: siteCountMax,
          title: { display: true, text: '人', color: '#64748b', font: { size: 10 } },
        },
      };
      renderTotalChart('plansum2-emp', stdTotalRaw, actualData, forecastData,
        { extraDatasets: siteCountDatasets, extraScales: siteCountScale, yMaxOverride: totalYMax, taskBreakdown });
    }
  }

  // 拠点サマリ：拠点タブ（いなべ/群馬/南丹。全拠点合計はこのモードでは非表示）に
  // 連動し、選択中拠点について、既存の「拠点・業務別」モード（全拠点合計時と同じ
  // チャート構造：実績工数／標準労働時間＋最大労働時間／予定標準工数（工程別）の
  // 3段積み上げ）を、栽培・出荷の区別なく1本のチャートに統合して表示する。
  // 実績工数のみ、栽培・出荷の内訳がわかるよう暖色系2色の2セグメントに分ける
  function renderSiteSummaryView() {
    const content = document.getElementById('compare2-content');
    const sitesToShow = planCmpSiteTab === '全拠点合計' ? availSites : [planCmpSiteTab];
    const vm = visMonths();

    let html = `<div class="schart-section">
      <div class="schart-header">実績工数（業務区分別）</div>
      ${chartWrapHtml('plansitesum2-combined', vm.length, { heightPx: 650, inlineHeight: true, forceResponsive: true })}
    </div>`;
    html += `<div class="schart-section">
      <div class="schart-header">実績工数（雇用区分別）</div>
      ${chartWrapHtml(`plansitesum2-${planCmpSiteTab}-emp`, vm.length, { heightPx: 320, inlineHeight: true, forceResponsive: true })}
    </div>`;
    content.innerHTML = html;

    // 上段チャートの「栽培（実績）」「出荷（実績）」棒専用：画面上部の雇用形態
    // チェックボックス（empTypeFilter）と連動させるためのローカル計算。
    // window._planCmpChartData2（workHoursForPlanMonths()由来、拠点別・表・3拠点
    // サマリの各サブタブでも共有されるキャッシュ）はここでは使わず変更もしない。
    // ロジック自体はworkHoursForPlanMonths()と同じで、雇用形態フィルタの適用
    // （既存のapplyEmpTypeFilter()、empTypeFilterがnullなら絞り込み無し）を
    // 追加しただけ
    function actualHoursForPlanMonthsFiltered(site, typeFilter) {
      const { employees, months: activeMonths } = getActiveData();
      const emps = applyEmpTypeFilter(employees.filter(e => e.base === site && e.workType && typeFilter(e.workType)));
      return planMonths.map(planMonth => {
        const ami = activeMonths.findIndex(m => normalizeMonth(m) === planMonth);
        if (ami < 0) return null;
        const total = emps.reduce((s, e) => s + (e.hours[ami] ?? 0), 0);
        return total > 0 ? Math.round(total * 10) / 10 : null;
      });
    }

    // 業務区分チェックボックス（画面上部のroleTypeFilter）に応じて、この拠点サマリ
    // チャート専用に対象divを動的に決定する。'配送・栽培'・'配送・出荷'はどちらか
    // 一方でもチェックされていれば、内部的には'配送'を1回だけ対象にする（二重計上
    // 防止）。外側スコープのdivs（['栽培','出荷','配送']、拠点別・表・3拠点サマリの
    // 各サブタブで共有）はここでは変更せず、この関数内だけのローカル変数として
    // シャドーイングする
    const divs = [];
    if (roleTypeFilter.has('栽培')) divs.push('栽培');
    if (roleTypeFilter.has('出荷')) divs.push('出荷');
    if (roleTypeFilter.has('配送・栽培') || roleTypeFilter.has('配送・出荷')) divs.push('配送');

    // 実績工数：栽培・出荷・配送それぞれの実績工数（雇用形態フィルタ適用済み）を
    // 選択中拠点分（全拠点合計時は3拠点合算）集計
    const actualByDiv = {};
    divs.forEach(div => {
      const typeFilter = div === '栽培'
        ? wt => workTypeClass(wt) === 'wt-栽培'
        : div === '配送'
          ? wt => workTypeClass(wt) === 'wt-配送'
          : wt => workTypeClass(wt) === 'wt-出荷';
      const actualBySite = sitesToShow.map(site => actualHoursForPlanMonthsFiltered(site, typeFilter));
      actualByDiv[div] = sl(planMonths.map((_, mi) => actualBySite.reduce((s, arr) => s + (arr[mi] || 0), 0)));
    });
    const actualMonthlyTotals = vm.map((_, mi) => divs.reduce((s, div) => s + (actualByDiv[div][mi] || 0), 0));

    // 予定標準工数（工程別）：栽培・出荷のタスク行を区別せず1つの積み上げグループとして集計
    const allDivRows = rows.filter(r => divs.includes(r.div));
    const stdByTask = allDivRows.map(r => sl(planMonths.map((_, mi) => {
      const total = sitesToShow.reduce((s, site) => {
        const res = calcRow(site, r, mi);
        return s + (res.h !== null ? res.h : 0);
      }, 0);
      return total > 0 ? Math.round(total * 10) / 10 : null;
    })));
    const stdMonthlyTotals = vm.map((_, mi) => stdByTask.reduce((s, data) => s + (data[mi] || 0), 0));

    // threeSiteMergeAgg()と同じロジックだが、雇用形態チェックボックス（empTypeFilter）を
    // 適用したフィルタ済み版。拠点サマリの未来月「標準労働時間」棒専用のローカル関数
    // （既存のthreeSiteMergeAgg()・threeSiteMergeAggFromRows()自体は変更しない）。
    // empTypeFilterがnullの場合はapplyEmpTypeFilter()が素通しするため、既存の
    // threeSiteMergeAgg()と同じ結果になる
    function threeSiteMergeAggFilteredByEmpType(div, site) {
      if (!mergeData) return null;
      const baseMatch = r => r.div === div && (site == null || r.site === site) && r.prj !== '';
      const rowsFiltered = applyEmpTypeFilter(mergeData.rows.filter(baseMatch));
      const matched = rowsFiltered.filter(r => isThreeSiteMergeActiveFlag(r.activeFlag));
      const newStaffMatched = rowsFiltered.filter(r => isThreeSiteMergeNewStaffFlag(r.activeFlag));
      if (!matched.length && !newStaffMatched.length) return null;
      const stdTotalB1 = Math.round(matched.reduce((s, r) => s + r.stdHours, 0) * 10) / 10;
      const newStaffByYm = {};
      mergeData.monthYms.forEach(ym => {
        const eligible = newStaffMatched.filter(r => r.startYm == null || r.startYm <= ym);
        if (eligible.length) newStaffByYm[ym] = Math.round(eligible.reduce((s, r) => s + r.stdHours, 0) * 10) / 10;
      });
      const deltaCombined = threeSiteMergeAggFromRows([...matched, ...newStaffMatched]);
      return { stdTotalB1, newStaffByYm, deltaByYm: deltaCombined ? deltaCombined.maxTotalByYm : {} };
    }

    // 標準労働時間（青・黄・緑）：栽培・出荷それぞれのthreeSiteMergeAggFilteredByEmpType()
    // （雇用形態フィルタ適用済み）を合算してからthreeSiteMergeStdHoursDatasets()に渡す
    // （stdTotalB1・newStaffByYm・deltaByYmとも両div分の合計）
    const siteForAgg = sitesToShow.length > 1 ? null : sitesToShow[0];
    const mergedAgg = mergeThreeSiteMergeAggAcrossDivs(divs.map(div => threeSiteMergeAggFilteredByEmpType(div, siteForAgg)));
    const stdHoursDs = threeSiteMergeStdHoursDatasets(mergedAgg, divs, siteForAgg, sitesToShow.length > 1 ? { stack: 'stdhours', labelSuffix: '（3拠点合計）' } : { stack: 'stdhours' });
    const stdHoursTotals = sl(planMonths.map((_, mi) => threeSiteMergeStdHoursTotal(mergedAgg, divs, siteForAgg, mi)));

    // 軸のMAX値専用：業務区分（栽培/出荷/配送）・雇用形態のチェック状態に関わらず、
    // 「全部ON」を仮定した場合の実績・予定標準工数・標準労働時間の月別合計を算出する。
    // 実際に描画される棒（actualByDiv・stdByTask・stdHoursDs、上のdivsベースの計算）
    // 自体は変更せず、sharedMaxの算出にのみこちらを使うことで、チェックボックスの
    // 切り替えで軸の高さが変動しないようにする。対象拠点（sitesToShow/siteForAgg）は
